<style>
/* PROFILE ONLY: use the existing Dashboard sidebar and give Profile its own clean content viewport. */
#profile-page {
  position: fixed !important;
  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  left: 256px !important;
  display: none !important;
  width: calc(100% - 256px) !important;
  height: 100vh !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  z-index: 999999 !important;
  background: #f9fafb !important;
  overflow: hidden !important;
  pointer-events: auto !important;
}

#profile-page:not(.hidden) { display: block !important; }

/* SETTINGS: keep the Settings page above the Dashboard shell so its controls receive mouse/touch events reliably. */
#settings-page {
  position: fixed !important;
  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  left: 256px !important;
  width: calc(100% - 256px) !important;
  height: 100vh !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 24px !important;
  z-index: 999999 !important;
  background: #f9fafb !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  box-sizing: border-box !important;
  pointer-events: auto !important;
}

#settings-page:not(.hidden) { display: block !important; }

#settings-page,
#settings-page * { pointer-events: auto; }

/* Legacy switch selectors retained for compatibility with older Settings markup. */
#settings-page label.relative.inline-flex {
  position: relative !important;
  display: inline-flex !important;
  align-items: center !important;
  width: 44px !important;
  height: 24px !important;
  flex: 0 0 44px !important;
  cursor: pointer !important;
  z-index: 2 !important;
}

#settings-page label.relative.inline-flex > input[type="checkbox"] {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

#settings-page label.relative.inline-flex > div {
  position: relative !important;
  display: block !important;
  width: 44px !important;
  height: 24px !important;
  flex: 0 0 44px !important;
  border-radius: 9999px !important;
  cursor: pointer !important;
  pointer-events: none !important;
}

#settings-page > div,
#settings-page button,
#settings-page label { position: relative; z-index: 1; }

#profile-page > main {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
}

#profile-page > main > header {
  position: sticky !important;
  top: 0 !important;
  z-index: 100 !important;
  margin: 0 !important;
}

body:has(#profile-page:not(.hidden)) #dashboard-header,
body:has(#settings-page:not(.hidden)) #dashboard-header { display: none !important; }

#profile-page .max-w-4xl {
  width: 100% !important;
  max-width: 56rem !important;
}

#profile-page .max-w-4xl {
  width: auto !important;
  max-width: none !important;
  margin-left: 24px !important;
  margin-right: 24px !important;
}

#staff-page main > div > section {
  max-width: none !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
}

#bizos-upgrade-review-card {
  margin-left: 256px !important;
  margin-right: 24px !important;
}

#upgrade-modal > div {
  margin-left: 256px !important;
  margin-right: 24px !important;
}

@media (max-width: 768px) {
  #profile-page,
  #settings-page {
    left: 0 !important;
    width: 100% !important;
  }

  #profile-page .max-w-4xl {
    margin-left: 24px !important;
    margin-right: 24px !important;
  }

  #bizos-upgrade-review-card,
  #upgrade-modal > div {
    margin-left: 0 !important;
    margin-right: 0 !important;
  }

  /* Settings normally sits above the Dashboard shell. When its mobile
     navigation opens, let the sidebar and overlay rise above Settings. */
  #sidebar.open {
    z-index: 1000001 !important;
  }

  #sidebar-overlay.active {
    z-index: 1000000 !important;
  }
}
</style>

<script>
(function () {
  function normalizeProfileSource() {
    const page = document.getElementById('profile-page');
    if (!page) return;

    page.style.position = 'fixed';
    page.style.top = '0';
    page.style.left = window.innerWidth <= 768 ? '0' : '256px';
    page.style.right = '0';
    page.style.bottom = '0';
    page.style.width = window.innerWidth <= 768 ? '100%' : 'calc(100% - 256px)';
    page.style.height = '100vh';
    page.style.minHeight = '0';
    page.style.margin = '0';
    page.style.padding = '0';
    page.style.zIndex = '999999';
    page.style.overflow = 'hidden';

    const main = page.querySelector(':scope > main');
    if (main) {
      main.style.height = '100%';
      main.style.minHeight = '0';
      main.style.margin = '0';
      main.style.padding = '0';
      main.style.overflowY = 'auto';
      main.style.overflowX = 'hidden';
    }

    const header = main && main.querySelector(':scope > header');
    if (header) header.style.margin = '0';

    document.body.style.overflowX = 'hidden';
  }

  function normalizeSettingsSource() {
    const page = document.getElementById('settings-page');
    if (!page) return;

    page.style.position = 'fixed';
    page.style.top = '0';
    page.style.left = window.innerWidth <= 768 ? '0' : '256px';
    page.style.right = '0';
    page.style.bottom = '0';
    page.style.width = window.innerWidth <= 768 ? '100%' : 'calc(100% - 256px)';
    page.style.height = '100vh';
    page.style.minHeight = '0';
    page.style.margin = '0';
    page.style.padding = '24px';
    page.style.zIndex = '999999';
    page.style.overflowY = 'auto';
    page.style.overflowX = 'hidden';
    page.style.boxSizing = 'border-box';
    page.style.pointerEvents = 'auto';
  }

  function fixStaffSidebarLink() {
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;

    sidebar.querySelectorAll('nav button').forEach(function (button) {
      const label = (button.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (label === 'staff') {
        button.onclick = function () {
          if (typeof window.showStaffPage === 'function') window.showStaffPage();
        };
      }
    });
  }

  function fixBillingSidebarLink() {
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;

    sidebar.querySelectorAll('nav button').forEach(function (button) {
      const label = (button.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (label === 'billing') {
        button.onclick = function () {
          var profilePage = document.getElementById('profile-page');
          var dashboardPage = document.getElementById('dashboard-page');
          var currentView = 'dashboard';
          if (profilePage && !profilePage.classList.contains('hidden')) currentView = 'profile';
          else if (document.getElementById('settings-page') && !document.getElementById('settings-page').classList.contains('hidden')) currentView = 'settings';
          window.__bizosBillingReturnView = currentView;
          if (profilePage) profilePage.classList.add('hidden');
          var settingsPage = document.getElementById('settings-page');
          if (settingsPage) settingsPage.classList.add('hidden');
          if (dashboardPage) dashboardPage.classList.remove('hidden');
          if (typeof window.showUpgradeModal === 'function') window.showUpgradeModal();
        };
      }
    });
  }

  function fixBillingCloseReturn() {
    if (window.__bizosBillingCloseWrapped) return;
    if (typeof window.closeUpgradeModal !== 'function') return;

    var originalCloseUpgradeModal = window.closeUpgradeModal;
    window.closeUpgradeModal = function () {
      var returnView = window.__bizosBillingReturnView;
      var result = originalCloseUpgradeModal.apply(this, arguments);

      if (returnView === 'profile') {
        var dashboardPage = document.getElementById('dashboard-page');
        var profilePage = document.getElementById('profile-page');
        var settingsPage = document.getElementById('settings-page');
        if (dashboardPage) dashboardPage.classList.remove('hidden');
        if (settingsPage) settingsPage.classList.add('hidden');
        if (profilePage) {
          profilePage.classList.remove('hidden');
          profilePage.style.display = 'block';
        }
        normalizeProfileSource();
        setTimeout(function () {
          if (typeof window.loadProfileData === 'function') window.loadProfileData();
          if (typeof window.loadTeamMembers === 'function') window.loadTeamMembers();
        }, 0);
        window.__bizosBillingReturnView = null;
      } else if (returnView === 'settings') {
        var dashboardPage2 = document.getElementById('dashboard-page');
        var profilePage2 = document.getElementById('profile-page');
        var settingsPage2 = document.getElementById('settings-page');
        if (dashboardPage2) dashboardPage2.classList.remove('hidden');
        if (profilePage2) profilePage2.classList.add('hidden');
        if (settingsPage2) settingsPage2.classList.remove('hidden');
        normalizeSettingsSource();
        window.__bizosBillingReturnView = null;
      }

      return result;
    };
    window.__bizosBillingCloseWrapped = true;
  }

  function initializeNavigationFixes() {
    normalizeProfileSource();
    normalizeSettingsSource();
    fixStaffSidebarLink();
    fixBillingSidebarLink();
    fixBillingCloseReturn();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeNavigationFixes, { once: true });
  } else {
    initializeNavigationFixes();
  }

  window.addEventListener('pageshow', initializeNavigationFixes);
  window.addEventListener('resize', function () {
    normalizeProfileSource();
    normalizeSettingsSource();
  });
})();
</script>
