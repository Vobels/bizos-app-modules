<style>
/* PROFILE: keep the page in normal document flow, aligned with Dashboard. */
#profile-page {
  position: relative !important;
  inset: auto !important;
  display: none !important;
  width: 100% !important;
  height: auto !important;
  min-width: 0 !important;
  min-height: 100vh !important;
  margin: 0 !important;
  padding: 0 !important;
  z-index: 1 !important;
  background: #f9fafb !important;
  overflow: visible !important;
}

#profile-page:not(.hidden) { display: block !important; }

/* profile.html has a simple main/header/content structure, not a Dashboard flex shell. */
#profile-page > main {
  display: block !important;
  width: 100% !important;
  height: auto !important;
  min-height: 100vh !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: visible !important;
}

/* Header is the first element: keep it directly at the top. */
#profile-page > main > header {
  position: sticky !important;
  top: 0 !important;
  z-index: 100 !important;
  margin: 0 !important;
}

/* The body container follows the header immediately. */
#profile-page > main > div {
  margin: 0 !important;
  padding-top: 24px !important;
}

#profile-page .max-w-4xl {
  width: 100% !important;
  max-width: 56rem !important;
}

#profile-page[style] {
  position: relative !important;
  inset: auto !important;
  height: auto !important;
  overflow: visible !important;
}

body:has(#profile-page:not(.hidden)) {
  overflow-x: hidden !important;
  overflow-y: auto !important;
}

@media (max-width: 768px) {
  #profile-page > main > div {
    padding-top: 16px !important;
  }
}
</style>

<script>
(function () {
  function normalizeProfileSource() {
    const page = document.getElementById('profile-page');
    if (!page) return;

    page.style.position = 'relative';
    page.style.top = 'auto';
    page.style.left = 'auto';
    page.style.right = 'auto';
    page.style.bottom = 'auto';
    page.style.width = '100%';
    page.style.height = 'auto';
    page.style.overflow = 'visible';
    page.style.zIndex = '1';

    const main = page.querySelector(':scope > main');
    if (main) {
      main.style.height = 'auto';
      main.style.minHeight = '100vh';
      main.style.overflow = 'visible';
      main.style.margin = '0';
      main.style.padding = '0';
    }

    const header = main && main.querySelector(':scope > header');
    if (header) {
      header.style.margin = '0';
    }

    const body = main && main.querySelector(':scope > div');
    if (body) {
      body.style.margin = '0';
    }

    document.body.style.overflowX = 'hidden';
    document.body.style.overflowY = 'auto';
  }

  function fixStaffSidebarLink() {
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;

    sidebar.querySelectorAll('nav button').forEach(function (button) {
      const label = (button.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (label === 'staff') {
        button.onclick = function () {
          if (typeof window.showStaffPage === 'function') window.showStaffPage();
        };
      }
    });
  }

  function initializeNavigationFixes() {
    normalizeProfileSource();
    fixStaffSidebarLink();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeNavigationFixes, { once: true });
  } else {
    initializeNavigationFixes();
  }

  window.addEventListener('pageshow', initializeNavigationFixes);
})();
</script>
