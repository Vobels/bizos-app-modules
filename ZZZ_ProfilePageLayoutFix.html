<style>
/* PROFILE ONLY: use the existing Dashboard sidebar and give Profile its own clean content viewport. */
#profile-page {
  position: fixed !important;
  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  left: 256px !important;
  display: none !important;
  width: calc(100% - 256px) !important;
  height: 100vh !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  z-index: 20 !important;
  background: #f9fafb !important;
  overflow: hidden !important;
}

#profile-page:not(.hidden) { display: block !important; }

/* Profile's own header is the only header shown for the Profile view. */
#profile-page > main {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  min-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
}

#profile-page > main > header {
  position: sticky !important;
  top: 0 !important;
  z-index: 100 !important;
  margin: 0 !important;
}

/* Do not show the Dashboard header underneath Profile. */
body:has(#profile-page:not(.hidden)) #dashboard-header {
  display: none !important;
}

#profile-page .max-w-4xl {
  width: 100% !important;
  max-width: 56rem !important;
}

@media (max-width: 768px) {
  #profile-page {
    left: 0 !important;
    width: 100% !important;
  }
}
</style>

<script>
(function () {
  function normalizeProfileSource() {
    const page = document.getElementById('profile-page');
    if (!page) return;

    page.style.position = 'fixed';
    page.style.top = '0';
    page.style.left = window.innerWidth <= 768 ? '0' : '256px';
    page.style.right = '0';
    page.style.bottom = '0';
    page.style.width = window.innerWidth <= 768 ? '100%' : 'calc(100% - 256px)';
    page.style.height = '100vh';
    page.style.minHeight = '0';
    page.style.margin = '0';
    page.style.padding = '0';
    page.style.zIndex = '20';
    page.style.overflow = 'hidden';

    const main = page.querySelector(':scope > main');
    if (main) {
      main.style.height = '100%';
      main.style.minHeight = '0';
      main.style.margin = '0';
      main.style.padding = '0';
      main.style.overflowY = 'auto';
      main.style.overflowX = 'hidden';
    }

    const header = main && main.querySelector(':scope > header');
    if (header) header.style.margin = '0';

    document.body.style.overflowX = 'hidden';
  }

  function fixStaffSidebarLink() {
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;

    sidebar.querySelectorAll('nav button').forEach(function (button) {
      const label = (button.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (label === 'staff') {
        button.onclick = function () {
          if (typeof window.showStaffPage === 'function') window.showStaffPage();
        };
      }
    });
  }

  function initializeNavigationFixes() {
    normalizeProfileSource();
    fixStaffSidebarLink();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeNavigationFixes, { once: true });
  } else {
    initializeNavigationFixes();
  }

  window.addEventListener('pageshow', initializeNavigationFixes);
  window.addEventListener('resize', normalizeProfileSource);
})();
</script>
