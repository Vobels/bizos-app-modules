<div id="client-module-v12-root" class="client-module-v12">
  <div class="module-v12-head">
    <div><span class="section-kicker" id="client-module-kicker">APP WORKSPACE</span><h2 id="client-module-title">Module</h2><p id="client-module-description">Manage records and review your module activity.</p></div>
    <div class="module-v12-actions"><button type="button" onclick="clientModuleV12Refresh()">Refresh</button><button id="client-module-add" type="button" class="primary" onclick="clientModuleV12New()">Add record</button></div>
  </div>
  <div id="client-module-message"></div>
  <div id="client-module-kpis" class="client-module-kpis"></div>
  <div id="client-module-insight" class="client-module-panel"></div>
  <div class="client-module-panel">
    <div class="client-module-toolbar"><div><strong id="client-module-record-title">Records</strong><span id="client-module-record-count"></span></div><div class="client-module-toolbar-actions"><input id="client-module-search" type="search" placeholder="Search records..." oninput="clientModuleV12RenderTable()"><button type="button" class="client-module-tool" onclick="clientModuleV12SetMode('records')">Records</button><button type="button" class="client-module-tool" onclick="clientModuleV12SetMode('sheet')">Spreadsheet View</button><button type="button" class="client-module-tool" onclick="clientModuleV12Export()">Export</button><button type="button" class="client-module-tool" onclick="clientModuleV12ToggleImport()">Import</button></div></div>
    <div id="client-module-table" class="client-module-table"></div><div id="client-module-sheet" class="client-module-sheet hidden"></div><div id="client-module-import" class="client-module-import hidden"><strong>Import records</strong><p>Paste CSV data using the first row as the column headers.</p><textarea id="client-module-import-text" placeholder="Column1,Column2,Column3"></textarea><div class="client-module-editor-actions"><button type="button" onclick="clientModuleV12ToggleImport()">Cancel</button><button type="button" class="primary" onclick="clientModuleV12Import()">Import records</button></div></div>
  </div>
  <div id="client-module-editor" class="client-module-editor hidden"></div>
</div>
<script>
(function(){
  var state={module:'',headers:[],records:[],editingRow:null,loaded:false,readOnly:false,mode:'records'};
  var defs={
    Finance:{label:'Finance',description:'Income, expenses and financial records.',kpis:[['Records','count'],['Revenue','sum:Amount:revenue'],['Expenses','sum:Amount:expense'],['Net result','net']]},
    Ecommerce:{label:'E-commerce',description:'Orders, products and online sales records.',kpis:[['Orders','count'],['Sales','sum:Amount:sales'],['Pending','status:pending'],['Customers','unique:Customer']]},
    Sales:{label:'Sales',description:'Sales pipeline and deal records.',kpis:[['Deals','count'],['Pipeline value','sum:Amount'],['Won','status:won'],['Lost','status:lost']]},
    CRM:{label:'CRM',description:'Customers, leads and relationship records.',kpis:[['Customers','count'],['Leads','status:lead'],['Active','status:active'],['Follow-ups','status:follow-up']]},
    HR:{label:'HR',description:'Employee and human resources records.',kpis:[['Employees','count'],['Active','status:active'],['On leave','status:on leave'],['Departments','unique:Department'],['Total payroll','hr:payroll'],['Average salary','hr:averageSalary'],['Recent hires','hr:recentHires']]},
    Logistics:{label:'Logistics',description:'Shipments, delivery and logistics records.',kpis:[['Shipments','count'],['In transit','status:in transit'],['Delivered','status:delivered'],['Pending','status:pending']]},
    Tax:{label:'Tax',description:'Tax records, filings and compliance data.',kpis:[['Records','count'],['Taxable amount','sum:Amount'],['Tax due','sum:Tax_Amount'],['Filed','status:filed']]},
    Agro:{label:'Agro',description:'Agriculture activities, production and costs.',kpis:[['Records','count'],['Production','sum:Quantity'],['Revenue','sum:Revenue'],['Costs','sum:Total_Cost']]},
    Productivity:{label:'Productivity',description:'Tasks and productivity records.',kpis:[['Tasks','count'],['Completed','status:completed'],['Pending','status:pending'],['Overdue','status:overdue']]},
    POS:{label:'POS',description:'Point-of-sale transactions and records.',kpis:[['Transactions','count'],['Sales','sum:Total_Amount'],['Items sold','sum:Quantity'],['Cash','pos:cash']]},
    Attendance:{label:'Attendance',description:'Staff attendance and time records.',kpis:[['Records','count'],['Present','status:present'],['Absent','status:absent'],['Late','status:late']]},
    Warehouse:{label:'Warehouse',description:'Inventory, stock and warehouse records.',kpis:[['Products','count'],['Stock units','sum:Quantity'],['Low stock','warehouse:low'],['Inventory value','warehouse:value']]},
    };
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function def(){return defs[state.module]||{label:state.module,description:'Manage records for this application.',kpis:[['Records','count'],['Value','sum:Amount'],['Active','status:active'],['Completed','status:completed']]};}
  function keyMatch(h,w){var x=String(h||'').toLowerCase().replace(/[^a-z0-9]/g,'');return String(w||'').toLowerCase().replace(/[^a-z0-9]/g,'')===x;}
  function findHeader(words){for(var i=0;i<state.headers.length;i++){for(var j=0;j<words.length;j++)if(keyMatch(state.headers[i],words[j]))return state.headers[i];}return '';}
  function val(r,h){return h?String(r&&r[h]!=null?r[h]:''):'';}
  function num(v){var n=Number(String(v||'').replace(/,/g,''));return isFinite(n)?n:0;}
  function money(v){var c=(window.__CLIENT&&window.__CLIENT.currency)||'NGN';try{return new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:2}).format(num(v));}catch(e){return num(v).toLocaleString();}}
  function statusCount(records,status){var h=findHeader(['Status','State']);if(!h)return 0;return records.filter(function(r){return val(r,h).trim().toLowerCase()===status;}).length;}
  function sumField(records,h,filter){if(!h)return 0;return records.reduce(function(t,r){if(filter){var th=findHeader(['Type','Transaction_Type','Record_Type']);if(th&&val(r,th).toLowerCase()!==filter)return t;}return t+num(r[h]);},0);}
  function uniqueCount(records,h){if(!h)return 0;var x={};records.forEach(function(r){var v=val(r,h).trim();if(v)x[v.toLowerCase()]=1;});return Object.keys(x).length;}
  function kpiValue(kind){
    if(kind==='count')return String(state.records.length);
    var p=kind.split(':');
    if(p[0]==='sum')return money(sumField(state.records,findHeader([p[1]]),p[2]));
    if(p[0]==='status')return String(statusCount(state.records,p[1]));
    if(p[0]==='unique')return String(uniqueCount(state.records,findHeader([p[1]])));
    if(p[0]==='net'){var h=findHeader(['Amount']);return money(sumField(state.records,h,'revenue')-sumField(state.records,h,'expense'));}
    if(p[0]==='warehouse'){
      var qtyHeader=findHeader(['Quantity']);
      var minHeader=findHeader(['Min_Stock']);
      var costHeader=findHeader(['Unit_Cost']);
      if(p[1]==='low'){
        if(!qtyHeader||!minHeader)return '0';
        return String(state.records.filter(function(r){return num(val(r,qtyHeader))<num(val(r,minHeader));}).length);
      }
      if(p[1]==='value'){
        if(!qtyHeader||!costHeader)return money(0);
        return money(state.records.reduce(function(t,r){return t+(num(val(r,qtyHeader))*num(val(r,costHeader)));},0));
      }
    }
    if(p[0]==='pos'){
       if(p[1]==='cash'){
         var ph=findHeader(['Payment_Method']);
         var ah=findHeader(['Total_Amount']);
         return money(state.records.reduce(function(t,r){return val(r,ph).trim().toLowerCase()==='cash'?t+num(val(r,ah)):t;},0));
       }
     }
     if(p[0]==='hr'){
      var salaryHeader=findHeader(['Salary']);
      if(p[1]==='payroll')return money(state.records.reduce(function(t,r){return t+num(val(r,salaryHeader));},0));
      if(p[1]==='averageSalary')return money(state.records.length&&salaryHeader?state.records.reduce(function(t,r){return t+num(val(r,salaryHeader));},0)/state.records.filter(function(r){return num(val(r,salaryHeader))>0;}).length:0);
      if(p[1]==='recentHires'){
        var hireHeader=findHeader(['Hire_Date']);
        if(!hireHeader)return '0';
        var cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
        return String(state.records.filter(function(r){var d=new Date(val(r,hireHeader));return !isNaN(d.getTime())&&d>=cutoff;}).length);
      }
    }
    return '—';
  }
  function renderKpis(){var d=def();document.getElementById('client-module-kpis').innerHTML=d.kpis.map(function(k){return '<div class="client-module-kpi"><span>'+esc(k[0])+'</span><strong>'+esc(kpiValue(k[1]))+'</strong></div>';}).join('');}
  function renderQuickInsight(){var d=def(),box=document.getElementById('client-module-insight');if(!box)return;var count=state.records.length;var lead=d.kpis&&d.kpis.length?d.kpis[1]:null;var headline=count?'Quick Insight':'Quick Insight';var detail=count?(d.label+' currently has '+count+' record'+(count===1?'':'s')+'. '+(lead?esc(lead[0])+' is '+esc(kpiValue(lead[1]))+'.':'Review the records below for the latest activity.'):'No '+esc(d.label)+' records have been added yet. Add a record to start building this workspace summary.';box.innerHTML='<div class="client-module-toolbar"><div><strong>'+headline+'</strong><p style="margin:6px 0 0;color:#6b7280">'+detail+'</p></div></div>';}
  function filtered(){var q=String(document.getElementById('client-module-search').value||'').toLowerCase().trim();if(!q)return state.records;return state.records.filter(function(r){return state.headers.some(function(h){return String(r[h]==null?'':r[h]).toLowerCase().indexOf(q)>=0;});});}
  window.clientModuleV12RenderTable=function(){renderTable();};
  
  function renderTable(){
    var rows=filtered(), box=document.getElementById('client-module-table');document.getElementById('client-module-record-count').textContent=' · '+rows.length+' record'+(rows.length===1?'':'s');
    if(!state.headers.length){box.innerHTML='<div class="client-module-empty">No fields were found for this module.</div>';return;}
    var cols=state.headers.slice(0,8);
    box.innerHTML='<div class="client-module-scroll"><table><thead><tr>'+cols.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'<th>Actions</th></tr></thead><tbody>'+rows.slice(0,100).map(function(r){return '<tr>'+cols.map(function(h){return '<td>'+esc(r[h])+'</td>';}).join('')+'<td class="client-module-row-actions">'+(state.readOnly?'<span class="client-module-readonly">Read only</span>':'<button type="button" onclick="clientModuleV12Edit('+Number(r._row||0)+')">Edit</button><button type="button" onclick="clientModuleV12Delete('+Number(r._row||0)+')">Delete</button>')+'</td></tr>';}).join('')+'</tbody></table></div>'+(rows.length>100?'<div class="client-module-more">Showing the first 100 matching records.</div>':'');
  }
  function recordId(r){
    return r&&((state.module==='Ecommerce'&&r.Order_ID)||(state.module==='Sales'&&r.Deal_ID)||(state.module==='CRM'&&r.Contact_ID)||(state.module==='HR'&&r.Employee_ID)||(state.module==='Logistics'&&r.Shipment_ID)||(state.module==='Tax'&&r.Tax_ID)||(state.module==='Agro'&&r.Record_ID)||(state.module==='Productivity'&&r.Record_ID)||(state.module==='POS'&&r.Transaction_ID)||(state.module==='Attendance'&&r.Record_ID)||(state.module==='Warehouse'&&r.Item_ID)||(state.module==='Finance'&&r.Transaction_ID));
  }
  function csvCell(v){var s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
  function csvParse(text){
    var rows=[],row=[],cell='',quoted=false;
    for(var i=0;i<text.length;i++){var ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(ch===','&&!quoted){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(function(x){return String(x).trim()!=='';}))rows.push(row);row=[];cell='';}else cell+=ch;}row.push(cell);if(row.some(function(x){return String(x).trim()!=='';}))rows.push(row);return rows;
  }
  function renderSheet(){
    var box=document.getElementById('client-module-sheet');if(!box)return;
    var cols=state.headers,rows=filtered();
    if(!cols.length){box.innerHTML='<div class="client-module-empty">No fields were found for this module.</div>';return;}
    box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong>Spreadsheet Editor</strong><button type="button" class="client-module-tool primary" onclick="clientModuleV12SaveSheet()">Save spreadsheet changes</button></div><div class="client-module-sheet"><table><thead><tr>'+cols.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+rows.slice(0,100).map(function(r){return '<tr data-row="'+Number(r._row||0)+'">'+cols.map(function(h){return '<td><input data-field="'+esc(h)+'" value="'+esc(r[h]).replace(/"/g,'&quot;')+'"></td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
  }
  window.clientModuleV12SetMode=function(mode){state.mode=mode==='sheet'?'sheet':'records';var table=document.getElementById('client-module-table'),sheet=document.getElementById('client-module-sheet');if(table)table.classList.toggle('hidden',state.mode!=='records');if(sheet){sheet.classList.toggle('hidden',state.mode!=='sheet');if(state.mode==='sheet')renderSheet();}document.getElementById('client-module-import').classList.add('hidden');};
  window.clientModuleV12ToggleImport=function(){if(state.readOnly){showMessage('This module is read-only for staff accounts.',true);return;}var e=document.getElementById('client-module-import');e.classList.toggle('hidden');};
  window.clientModuleV12Export=function(){
    var rows=filtered(),lines=[state.headers.map(csvCell).join(',')];rows.forEach(function(r){lines.push(state.headers.map(function(h){return csvCell(r[h]);}).join(','));});
    var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.module||'records')+'_records.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},500);
  };
  window.clientModuleV12Import=function(){
    var text=document.getElementById('client-module-import-text').value||'',parsed=csvParse(text);
    if(parsed.length<2){showMessage('Add CSV headers and at least one record.',true);return;}
    var headers=parsed[0].map(function(x){return String(x||'').trim();}),payloads=[];
    for(var i=1;i<parsed.length;i++){var d={};headers.forEach(function(h,j){if(h)d[h]=parsed[i][j]||'';});payloads.push(d);}
    var i=0,done=0,failed=0,next=function(){if(i>=payloads.length){showMessage(done+' record(s) imported.'+(failed?' '+failed+' failed.':''),failed>0);document.getElementById('client-module-import-text').value='';clientModuleV12ToggleImport();clientModuleV12Refresh(true);return;}var d=payloads[i++];google.script.run.withSuccessHandler(function(r){if(r&&r.success===false)failed++;else done++;next();}).withFailureHandler(function(){failed++;next();}).saveRecord(state.module,d,window.clientSessionId);};next();
  };
  window.clientModuleV12SaveSheet=function(){
    if(state.readOnly){showMessage('This module is read-only for staff accounts.',true);return;}
    var rows=document.querySelectorAll('#client-module-sheet tbody tr'),i=0,failed=0,saveNext=function(){if(i>=rows.length){showMessage('Spreadsheet changes saved.'+(failed?' '+failed+' row(s) failed.':''),failed>0);clientModuleV12Refresh(true);return;}var tr=rows[i++],row=state.records.find(function(x){return Number(x._row)===Number(tr.getAttribute('data-row'));}),id=recordId(row),d={};if(!id){failed++;saveNext();return;}tr.querySelectorAll('input[data-field]').forEach(function(el){d[el.getAttribute('data-field')]=el.value;});google.script.run.withSuccessHandler(function(r){if(r&&r.success===false)failed++;saveNext();}).withFailureHandler(function(){failed++;saveNext();}).updateRecord(state.module,d,id,window.clientSessionId);};saveNext();
  };

  function showMessage(msg,error){var e=document.getElementById('client-module-message');e.className=error?'module-msg error':'module-msg';e.textContent=msg||'';}
  function editorControl(h,v){
    var name=esc(h).replace(/"/g,'&quot;'), value=String(v==null?'':v);
    if(state.module==='Sales' && h==='Stage'){
      var options=['lead','qualified','proposal','negotiation','closed_won','closed_lost'];
      return '<select name="'+name+'">'+options.map(function(o){return '<option value="'+esc(o)+'"'+(value.toLowerCase()===o?' selected':'')+'>'+esc(o.replace(/_/g,' '))+'</option>';}).join('')+'</select>';
    }
    if(state.module==='Sales' && h==='Payment_Method'){
      var methods=['pending','cash','bank_transfer','card','mobile_money','other'];
      return '<select name="'+name+'">'+methods.map(function(o){return '<option value="'+esc(o)+'"'+(value.toLowerCase()===o?' selected':'')+'>'+esc(o.replace(/_/g,' '))+'</option>';}).join('')+'</select>';
    }
    if(state.module==='HR' && h==='Status'){
      var statuses=['active','on leave'];
      return '<select name="'+name+'">'+statuses.map(function(o){return '<option value="'+esc(o)+'"'+(value.toLowerCase()===o?' selected':'')+'>'+esc(o.replace(/_/g,' '))+'</option>';}).join('')+'</select>';
    }
    if(/(^Date$|_Date$|^ETA$)/i.test(h)) return '<input type="date" name="'+name+'" value="'+esc(value).replace(/"/g,'&quot;')+'">';
    if(/(Amount|Price|Cost|Revenue|Tax|Quantity|Probability|Rate)/i.test(h)) return '<input type="number" step="any" name="'+name+'" value="'+esc(value).replace(/"/g,'&quot;')+'">';
    return '<input name="'+name+'" value="'+esc(value).replace(/"/g,'&quot;')+'">';
  }
  function renderEditor(row){
    var editing=!!row, html='<div class="client-module-editor-head"><div><span class="section-kicker">'+(editing?'EDIT RECORD':'NEW RECORD')+'</span><h3>'+(editing?'Update record':'Add record')+'</h3></div><button type="button" onclick="clientModuleV12CloseEditor()">Close</button></div><form onsubmit="clientModuleV12Save(event)"><div class="client-module-form-grid">';
    state.headers.forEach(function(h){var v=editing?row[h]:'';html+='<label>'+esc(h)+editorControl(h,v)+'</label>';});
    html+='</div><div class="client-module-editor-actions"><button type="button" onclick="clientModuleV12CloseEditor()">Cancel</button><button class="primary" type="submit">'+(editing?'Save changes':'Create record')+'</button></div></form>';
    var e=document.getElementById('client-module-editor');e.innerHTML=html;e.classList.remove('hidden');
    if(state.module==='Ecommerce'){
      var q=e.querySelector('[name="Quantity"]'),p=e.querySelector('[name="Unit_Price"]'),sub=e.querySelector('[name="Subtotal"]'),ship=e.querySelector('[name="Shipping_Cost"]'),tax=e.querySelector('[name="Tax"]'),total=e.querySelector('[name="Total_Amount"]');
      var calc=function(){var qty=Number(q&&q.value||0),price=Number(p&&p.value||0),shipping=Number(ship&&ship.value||0),taxValue=Number(tax&&tax.value||0),subtotal=qty*price;if(sub)sub.value=subtotal.toFixed(2);if(total)total.value=(subtotal+shipping+taxValue).toFixed(2);};
      [q,p,ship,tax].forEach(function(el){if(el)el.addEventListener('input',calc);});calc();
    }
    e.scrollIntoView({behavior:'smooth',block:'start'});
  }
  window.clientModuleV12New=function(){if(state.readOnly){showMessage('This module is read-only for staff accounts.',true);return;}state.editingRow=null;renderEditor(null);};
  window.clientModuleV12Edit=function(row){if(state.readOnly){showMessage('This module is read-only for staff accounts.',true);return;}var r=state.records.find(function(x){return Number(x._row)===Number(row);});if(r){state.editingRow=Number(row);renderEditor(r);}};
  window.clientModuleV12CloseEditor=function(){document.getElementById('client-module-editor').classList.add('hidden');};
  window.clientModuleV12Delete=function(row){if(state.readOnly){showMessage('This module is read-only for staff accounts.',true);return;}if(!confirm('Delete this record?'))return;var record=state.records.find(function(x){return Number(x._row)===Number(row);});if(!record){showMessage('Record not found.',true);return;}var index=Number(record._row)-2;if(index<0){showMessage('Invalid record position.',true);return;}google.script.run.withSuccessHandler(function(r){if(r&&r.success===false){showMessage(r.message||'Could not delete record.',true);return;}showMessage('Record deleted.');clientModuleV12Refresh(true);}).withFailureHandler(function(e){showMessage(window.clientFriendlyError(e&&e.message,'Could not delete record.'),true);}).deleteRecord(state.module,index,window.clientSessionId);};
  window.clientModuleV12Save=function(ev){ev.preventDefault();var form=ev.target,d={};state.headers.forEach(function(h){var el=form.elements[h];if(el)d[h]=el.value;});var done=function(r){if(r&&r.success===false){showMessage(r.message||'Could not save record.',true);return;}showMessage(state.editingRow?'Record updated.':'Record created.');state.editingRow=null;clientModuleV12CloseEditor();clientModuleV12Refresh(true);};if(state.editingRow){var existing=state.records.find(function(x){return Number(x._row)===Number(state.editingRow);});var recordId=existing&&((state.module==='Ecommerce'&&existing.Order_ID)||(state.module==='Sales'&&existing.Deal_ID)||(state.module==='CRM'&&existing.Contact_ID)||(state.module==='HR'&&existing.Employee_ID)||(state.module==='Logistics'&&existing.Shipment_ID)||(state.module==='Tax'&&existing.Tax_ID)||(state.module==='Agro'&&existing.Record_ID)||(state.module==='Productivity'&&existing.Record_ID)||(state.module==='POS'&&existing.Transaction_ID)||(state.module==='Attendance'&&existing.Record_ID)||(state.module==='Warehouse'&&existing.Item_ID)||(state.module==='Finance'&&existing.Transaction_ID));if(!recordId){showMessage('Record ID not found.',true);return;}google.script.run.withSuccessHandler(done).withFailureHandler(function(e){showMessage(window.clientFriendlyError(e&&e.message,'Could not update record.'),true);}).updateRecord(state.module,d,recordId,window.clientSessionId);}else{google.script.run.withSuccessHandler(done).withFailureHandler(function(e){showMessage(window.clientFriendlyError(e&&e.message,'Could not create record.'),true);}).saveRecord(state.module,d,window.clientSessionId);}};
  window.clientModuleV12Refresh=function(force){if(!state.module)return;google.script.run.withSuccessHandler(function(r){if(!r||r.success===false){showMessage(r&&r.message||'Could not load module data.',true);return;}state.headers=Array.isArray(r.headers)?r.headers:[];state.records=Array.isArray(r.records)?r.records:[];state.loaded=true;renderKpis();renderQuickInsight();renderTable();if(state.mode==='sheet')renderSheet();}).withFailureHandler(function(e){showMessage(window.clientFriendlyError(e&&e.message,'Could not load module data.'),true);}).getModuleDataWithSync(state.module,window.clientSessionId);};
  window.clientModuleV12Open=function(moduleName){state.module=String(moduleName||'');state.editingRow=null;state.readOnly=false;var d=def();document.getElementById('client-module-kicker').textContent='APP WORKSPACE';document.getElementById('client-module-title').textContent=d.label;document.getElementById('client-module-description').textContent=d.description;document.getElementById('client-module-record-title').textContent=d.label+' records';document.getElementById('client-module-search').value='';state.mode='records';clientModuleV12CloseEditor();google.script.run.withSuccessHandler(function(summary){var meta=summary&&summary[state.module];state.readOnly=!!(meta&&meta.isReadOnly);var add=document.getElementById('client-module-add');if(add){add.disabled=state.readOnly;add.title=state.readOnly?'This module is read-only for staff accounts.':'';}clientModuleV12Refresh();}).withFailureHandler(function(){clientModuleV12Refresh();}).getClientModuleSummary(window.clientSessionId);};
})();
</script>
