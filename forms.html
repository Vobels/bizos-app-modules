<script>
// =====ENTERPRISE CONTATCT FORM
// Show Enterprise Contact Modal (Popup)
function showEnterpriseContact() {
  // Remove existing modal if any
  const existing = document.getElementById('enterprise-contact-modal');
  if (existing) existing.remove();
  
  const modalHtml = `
    <div id="enterprise-contact-modal" class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100000]">
      <div class="modal-content max-w-md w-full bg-white rounded-lg p-6" style="animation: none; transform: scale(1);">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-[#5D2A86]">Enterprise Inquiry</h2>
          <button onclick="closeEnterpriseModal()" class="text-gray-400 hover:text-gray-600">
            <i class="fas fa-times text-xl"></i>
          </button>
        </div>
        
        <form id="enterprise-contact-form" onsubmit="submitEnterpriseInquiry(event)">
          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
            <input type="text" id="ent-name" class="w-full p-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500" required>
          </div>
          
          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
            <input type="email" id="ent-email" class="w-full p-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500" required>
          </div>
          
          <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Company Name *</label>
            <input type="text" id="ent-company" class="w-full p-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500" required>
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Message (Optional)</label>
            <textarea id="ent-message" rows="4" class="w-full p-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500" placeholder="Tell us about your needs..."></textarea>
          </div>
          
          <button type="submit" class="w-full bg-[#5D2A86] text-white py-2 rounded-lg font-semibold hover:bg-[#4a1f6b] transition">
            Send Inquiry
          </button>
          
          <button type="button" onclick="closeEnterpriseModal()" class="w-full mt-2 text-gray-500 text-sm py-2 hover:text-gray-700">
            Cancel
          </button>
        </form>
        
        <p class="text-xs text-gray-400 text-center mt-4">
          We'll respond within 24 hours
        </p>
      </div>
    </div>
  `;
  
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  
  // Prevent body scroll when modal is open
  document.body.style.overflow = 'hidden';
}

function closeEnterpriseModal() {
  const modal = document.getElementById('enterprise-contact-modal');
  if (modal) modal.remove();
  document.body.style.overflow = '';
}

function submitEnterpriseInquiry(event) {
  event.preventDefault();
  
  const name = document.getElementById('ent-name').value;
  const email = document.getElementById('ent-email').value;
  const company = document.getElementById('ent-company').value;
  const message = document.getElementById('ent-message').value;
  
  if (!name || !email || !company) {
    showNotification('Please fill in all required fields', 'warning');
    return;
  }
  
  const submitBtn = event.target.querySelector('button[type="submit"]');
  const originalText = submitBtn.textContent;
  submitBtn.textContent = 'Sending...';
  submitBtn.disabled = true;
  
  google.script.run
    .withSuccessHandler(function(response) {
      submitBtn.textContent = originalText;
      submitBtn.disabled = false;
      
      if (response.success) {
        closeEnterpriseModal();
        showNotification('Inquiry sent! We\'ll contact you within 24 hours.', 'success');
      } else {
        showNotification(response.message || 'Failed to send inquiry', 'error');
      }
    })
    .withFailureHandler(function(error) {
      submitBtn.textContent = originalText;
      submitBtn.disabled = false;
      showNotification('Failed to send. Please try again.', 'error');
    })
    .sendEnterpriseInquiry(name, email, company, message);
}

function contactSales() {
  showEnterpriseContact();
}
</script>
