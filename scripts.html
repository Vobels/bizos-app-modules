// ==================== SESSION MANAGEMENT ====================
function saveSession(sessionId, user) {
  if (sessionId) {
    localStorage.setItem('bizos_session', sessionId);
    localStorage.setItem('bizos_user', JSON.stringify(user));
    currentSessionId = sessionId;
    currentUser = user;
  }
}

function loadSession() {
  const sessionId = localStorage.getItem('bizos_session');
  const userJson = localStorage.getItem('bizos_user');

  if (sessionId && userJson) {
    try {
      currentSessionId = sessionId;
      currentUser = JSON.parse(userJson);
      return true;
    } catch (e) {
      return false;
    }
  }
  return false;
}

function clearSession() {
  localStorage.removeItem('bizos_session');
  localStorage.removeItem('bizos_user');
  currentSessionId = null;
  currentUser = null;
}

function loadAppData() {
  if (BIZ_CACHE.initialized) return Promise.resolve(BIZ_CACHE.data);
  
  return new Promise((resolve) => {
    Promise.all([
      new Promise(r => callGoogleScript('getDashboardKPIs', [], r, () => r({}))),
      new Promise(r => callGoogleScript('getRecentTransactions', [10], r, () => r([]))),
      new Promise(r => callGoogleScript('getModuleSummary', [], r, () => r({})))

      BIZ_CACHE.data = { kpis, recentTransactions: transactions, modules };
      BIZ_CACHE.initialized = true;
      resolve(BIZ_CACHE.data);
    });
  });
}

// ==================== UTILITIES ====================
function formatCurrency(amount) {
  const num = parseFloat(amount || 0);
  return new Intl.NumberFormat('en-US', {
    style: 'currency',
    currency: 'USD',
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(num);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

function checkPasswordStrength(password) {
  let strength = 0;
  let message = '';
  let color = '';
  
  if (password.length >= 8) strength++;
  if (/[a-z]/.test(password)) strength++;
  if (/[A-Z]/.test(password)) strength++;
  if (/[0-9]/.test(password)) strength++;
  if (/[^A-Za-z0-9]/.test(password)) strength++;
  
  if (strength <= 2) {
    message = 'Weak password';
    color = 'text-red-600';
  } else if (strength <= 3) {
    message = 'Fair password';
    color = 'text-yellow-600';
  } else if (strength <= 4) {
    message = 'Good password';
    color = 'text-blue-600';
  } else {
    message = 'Strong password';
    color = 'text-green-600';
  }
  
  return { strength, message, color, score: strength };
}

function updatePasswordStrength(inputId, indicatorId) {
  const password = document.getElementById(inputId).value;
  const indicator = document.getElementById(indicatorId);
  
  if (!indicator) return;
  
  if (password.length === 0) {
    indicator.innerHTML = '';
    return;
  }
  
  const result = checkPasswordStrength(password);
  const barWidth = (result.score / 5) * 100;
  
  let barColor = '';
  if (result.score <= 2) barColor = 'bg-red-500';
  else if (result.score <= 3) barColor = 'bg-yellow-500';
  else if (result.score <= 4) barColor = 'bg-blue-500';
  else barColor = 'bg-green-500';
  
  indicator.innerHTML = `
    <div class="mt-1">
      <div class="w-full bg-gray-200 rounded-full h-1.5">
        <div class="${barColor} h-1.5 rounded-full" style="width: ${barWidth}%"></div>
      </div>
      <p class="text-xs ${result.color} mt-1">${result.message}</p>
    </div>
  `;
}

function togglePassword(inputId) {
  const input = document.getElementById(inputId);
  const button = input.nextElementSibling;
  const icon = button.querySelector('i');
  
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}

// ==================== API WRAPPER ====================
function callGoogleScript(functionName, params, successHandler, errorHandler) {
  const timeout = setTimeout(() => {
    errorHandler(new Error('Request timeout'));
  }, 30000);

  let finalParams = [...params];

  if (
    functionName !== 'authenticateUser' &&
    functionName !== 'signUpUser' &&
    functionName !== 'resetPassword'
  ) {
    if (currentSessionId) {
      finalParams.push(currentSessionId);
    } else {
      errorHandler(new Error('No active session'));
      clearTimeout(timeout);
      return;
    }
  }

  google.script.run
    .withSuccessHandler(res => {
      clearTimeout(timeout);
      successHandler(res);
    })
    .withFailureHandler(err => {
      clearTimeout(timeout);
      console.error('Script error:', err);
      errorHandler(err);
    })[functionName](...finalParams);
}

// ==================== MODULE ACCESS CONTROL ====================
function checkModuleAccess(moduleName) {
  const tier = currentUser?.subscriptionTier || 'free';
  const isDemo = currentUser?.isDemo === true || currentUser?.isDemo === 'YES';
  const userRole = currentUser?.role || 'staff';
  const isOwnerOrAdmin = userRole === 'owner' || userRole === 'admin';
  
  // ===== STAFF: Check if module is assigned =====
  if (!isOwnerOrAdmin) {
    const assignedModules = currentUser?.accessibleModules || ['Ecommerce'];
    if (!assignedModules.includes(moduleName)) {
      showNotification('You do not have access to this module', 'warning');
      return false;
    }
    return true;
  }
  
  // ===== DEMO: Read-only =====
  if (isDemo) {
    showNotification('Demo Mode - Read Only. Upgrade to Sovereign to save data.', 'warning');
    return false;
  }
  
  // ===== FREE: Only Finance and Ecommerce =====
  if (tier === 'free' && !['Ecommerce'].includes(moduleName)) {
    showNotification('Upgrade to Sovereign to access all apps!', 'warning');
    return false;
  }
  
  return true;
}

function getModuleAccess(moduleName) {
  // SAFE: Check if currentUser exists
  if (!currentUser) {
    console.log("getModuleAccess: No currentUser, returning default access");
    return {
      isAccessible: false,
      isLocked: true,
      isReadOnly: false,
      showInSidebar: true,
      badge: '',
      message: 'Please log in to access modules'
    };
  }
  
  const rawTier = currentUser?.subscriptionTier || 'free';
  const isDemo = currentUser?.isDemo === true || currentUser?.isDemo === 'YES';
  const userRole = currentUser?.role || 'staff';
  const isOwnerOrAdmin = userRole === 'owner' || userRole === 'admin';
  
  // ===== STAFF: Check if module is assigned =====
  if (!isOwnerOrAdmin) {
    const assignedModules = currentUser?.accessibleModules || ['Ecommerce'];
    const isAssigned = assignedModules.includes(moduleName);
    
    return {
      isAccessible: isAssigned,
      isLocked: !isAssigned,
      isReadOnly: true,
      showInSidebar: true,
      badge: isAssigned ? '' : '🔒',
      message: isAssigned ? 'View only' : 'This module is not assigned to you'
    };
  }
  
  // ===== OWNER/ADMIN: Check subscription tier =====
  // IMPORTANT: isDemo should NOT affect premium users
  let tierCode = 'starter';
  
  // Check if user is premium (sovereign, professional, tier2, enterprise)
  const isPremium = rawTier === 'sovereign' || rawTier === 'tier2' || 
                    rawTier === 'professional' || rawTier === 'enterprise';
  
  if (isDemo && !isPremium) {
    // Only show demo for non-premium users
    tierCode = 'demo';
  } else if (isPremium) {
    tierCode = 'sovereign';  // Premium gets all modules
  } else if (rawTier === 'enterprise') {
    tierCode = 'enterprise';
  } else {
    tierCode = 'starter';    // Free users get Finance + Ecommerce
  }
  
  const tierConfig = {
    demo: {
      accessibleModules: ['Finance', 'Ecommerce', 'Sales', 'CRM', 'HR', 'Logistics', 'Tax', 'Agro', 'Productivity', 'POS', 'Attendance', 'Warehouse' ],
      isReadOnly: true,
      showAllModules: true,
      badge: '(Demo)'
    },
    starter: {
      accessibleModules: ['Finance', 'Ecommerce'],
      isReadOnly: false,
      showAllModules: true,
      badge: ''
    },
    sovereign: {
      accessibleModules: ['Finance', 'Ecommerce', 'Sales', 'CRM', 'HR', 'Logistics', 'Tax', 'Agro', 'Productivity', 'POS', 'Attendance', 'Warehouse' ],
      isReadOnly: false,
      showAllModules: true,
      badge: ''
    },
    enterprise: {
      accessibleModules: ['Finance', 'Ecommerce', 'Sales', 'CRM', 'HR', 'Logistics', 'Tax', 'Agro', 'Productivity', 'POS', 'Attendance', 'Warehouse' ],
      isReadOnly: false,
      showAllModules: true,
      badge: ''
    }
  };
  
  const config = tierConfig[tierCode] || tierConfig.starter;
  const isAccessible = config.accessibleModules.includes(moduleName);
  
  return {
    isAccessible: isAccessible,
    isLocked: !isAccessible && tierCode === 'starter',
    isReadOnly: config.isReadOnly && isAccessible,
    showInSidebar: config.showAllModules,
    badge: config.badge,
    message: isAccessible ? (config.isReadOnly ? 'Demo Mode - Read Only' : '') : 'Upgrade to Sovereign to access this module'
  };
}


// ==================== AUTHENTICATION - LOGIN ====================
window.handleLogin = function(event) {
  if (event) event.preventDefault();

  const businessName = document.getElementById('login-business-name')?.value.trim();
  const email = document.getElementById('login-email')?.value.trim();
  const password = document.getElementById('login-password')?.value;

  if (!businessName || !email || !password) {
    showNotification('Please enter business name, email, and password', 'warning');
    return;
  }

  const submitBtn = event?.target?.querySelector('button[type="submit"]');
  const originalText = submitBtn?.textContent;
  if (submitBtn) {
    submitBtn.textContent = 'Signing in...';
    submitBtn.disabled = true;
  }

  google.script.run
    .withSuccessHandler(res => {
      if (submitBtn) {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
      
      if (res.success) {
        saveSession(res.sessionId, res.user);
        
        const loginModal = document.getElementById('login-modal');
        if (loginModal) loginModal.classList.add('hidden');
        
        console.log('Session saved:', {
          sessionId: currentSessionId,
          user: currentUser,
          businessId: currentUser?.businessId
        });

        const testSession = localStorage.getItem('bizos_session');
        console.log('LocalStorage session exists:', !!testSession);

        if (window.pendingUpgrade && res.user.subscriptionTier === 'free') {
          window.pendingUpgrade = false;
          setTimeout(() => {
            showUpgradeModal();
          }, 500);
        }

        const landingPage = document.getElementById('landing-page');
        const dashboardPage = document.getElementById('dashboard-page');
        
        if (landingPage) landingPage.classList.add('hidden');
        if (dashboardPage) dashboardPage.classList.remove('hidden');
        
        if (dashboardPage) {
          dashboardPage.style.display = 'block';
          dashboardPage.classList.remove('hidden');
        }
        
        loadDashboard();
        
        setTimeout(() => {
          loadModulesList();
        }, 100);

                // ============================================================
        // FORCE ENHANCED DASHBOARD AFTER LOGIN - FIXES ARROWS
        // ============================================================
        setTimeout(function() {
          console.log('🔄 Forcing enhanced dashboard after login');
          loadEnhancedDashboard();
        }, 500);
        // ============================================================

        
        console.log("Dashboard elements check:", {
          dashboardPage: document.getElementById('dashboard-page'),
          dashboardHome: document.getElementById('dashboard-home'),
          moduleView: document.getElementById('module-view'),
          pageTitle: document.getElementById('page-title')
        });
        
        showNotification(res.message, 'success');
        
        if (window.pendingModule) {
          setTimeout(() => {
            if (typeof openModule === 'function') {
              openModule(window.pendingModule);
              window.pendingModule = null;
            }
          }, 500);
        }
      } else {
        showNotification(res.message, 'error');
        
        if (res.message && (res.message.includes('pending verification') || res.message.includes('verify'))) {
          const emailInput = document.getElementById('login-email')?.value.trim();
          
          setTimeout(() => {
            const shouldResend = confirm(
              "Your account exists but is not verified.\n\nWould you like to receive a new verification email?"
            );
            if (shouldResend && emailInput) {
              google.script.run
                .withSuccessHandler(function(response) {
                  if (response.success) {
                    showNotification('Verification email sent! Please check your inbox.', 'success');
                  } else {
                    showNotification(response.message, 'error');
                  }
                })
                .withFailureHandler(function(error) {
                  showNotification("Failed to resend verification. Please contact support.", 'error');
                })
                .resendVerificationEmail(emailInput);
            }
          }, 500);
        }
      }
    })
    .withFailureHandler(err => {
      if (submitBtn) {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
      console.error('Login error:', err);
      showNotification('Login failed. Please try again.', 'error');
    })
    .authenticateUser(email, password, businessName);
};

function handleLogout() {
  // Clear the browser session immediately so logout cannot leave the user
  // visually authenticated while the server request is still running.
  const sessionId = currentSessionId || localStorage.getItem('bizos_session');

  clearSession();

  // Force the authenticated shell back to the public landing/login state.
  if (typeof window.__bizosForceLanding === 'function') {
    window.__bizosForceLanding();
  } else {
    const dashboardPage = document.getElementById('dashboard-page');
    const profilePage = document.getElementById('profile-page');
    const settingsPage = document.getElementById('settings-page');
    const staffPage = document.getElementById('staff-page');
    const landingPage = document.getElementById('landing-page');
    [dashboardPage, profilePage, settingsPage, staffPage].forEach(function (page) {
      if (page) page.classList.add('hidden');
    });
    if (landingPage) landingPage.classList.remove('hidden');

}

function loadEnhancedDashboard() {

      if (response && response.success) {

function updateEnhancedKPIs(kpis) {
  const revenueEl = document.getElementById('kpi-revenue');
  const expensesEl = document.getElementById('kpi-expenses');
  const profitEl = document.getElementById('kpi-profit');
  const marginEl = document.getElementById('kpi-margin');
  
  if (revenueEl) {
    revenueEl.innerHTML = `
      ${formatCurrency(kpis.revenue.value)}
      <span class="text-sm ${kpis.revenue.change >= 0 ? 'text-green-500' : 'text-red-500'} ml-2">
        <i class="fas fa-arrow-${kpis.revenue.change >= 0 ? 'up' : 'down'}"></i>
        ${Math.abs(kpis.revenue.change).toFixed(1)}%
      </span>
    `;
  }
  
  if (expensesEl) {
    expensesEl.innerHTML = `
      ${formatCurrency(kpis.expenses.value)}
      <span class="text-sm ${kpis.expenses.change <= 0 ? 'text-green-500' : 'text-red-500'} ml-2">
        <i class="fas fa-arrow-${kpis.expenses.change <= 0 ? 'down' : 'up'}"></i>
        ${Math.abs(kpis.expenses.change).toFixed(1)}%
      </span>
    `;
  }
  
  if (profitEl) {
    const profitColor = kpis.netProfit.value >= 0 ? 'text-green-600' : 'text-red-600';
    profitEl.innerHTML = `
      <span class="${profitColor}">${formatCurrency(kpis.netProfit.value)}</span>
      <span class="text-sm ${kpis.netProfit.change >= 0 ? 'text-green-500' : 'text-red-500'} ml-2">
        <i class="fas fa-arrow-${kpis.netProfit.change >= 0 ? 'up' : 'down'}"></i>
        ${Math.abs(kpis.netProfit.change).toFixed(1)}%
      </span>
    `;
  }
  
  if (marginEl) {
    const marginColor = kpis.profitMargin.value >= 15 ? 'text-green-600' : (kpis.profitMargin.value >= 5 ? 'text-yellow-600' : 'text-red-600');
    marginEl.innerHTML = `
      <span class="${marginColor}">${kpis.profitMargin.value.toFixed(1)}%</span>
      <span class="text-sm ${kpis.profitMargin.change >= 0 ? 'text-green-500' : 'text-red-500'} ml-2">
        <i class="fas fa-arrow-${kpis.profitMargin.change >= 0 ? 'up' : 'down'}"></i>
        ${Math.abs(kpis.profitMargin.change).toFixed(1)}%
      </span>
    `;
  }
}

function updateBusinessHealth(health) {
  const container = document.getElementById('business-health-container');
  if (!container) return;
  
  const score = health.overall;
  const scoreColor = score >= 70 ? '#10b981' : (score >= 40 ? '#f59e0b' : '#ef4444');
  
  let metricsHtml = '<div class="space-y-3">';
  health.metrics.forEach(metric => {
    metricsHtml += `
      <div>
        <div class="flex justify-between text-sm mb-1">
          <span>${metric.name}</span>
          <span class="font-medium">${metric.current}</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="rounded-full h-2" style="width: ${metric.score}%; background-color: ${scoreColor}"></div>
        </div>
        <p class="text-xs text-gray-500 mt-1">Target: ${metric.target}</p>
      </div>
    `;
  });
  metricsHtml += '</div>';
  
  let recommendationsHtml = '<div class="space-y-2 mt-4">';
  health.recommendations.forEach(rec => {
    const priorityColor = rec.priority === 'high' ? 'text-red-600' : 'text-yellow-600';
    recommendationsHtml += `
      <div class="flex items-start space-x-2 text-sm">
        <i class="fas fa-lightbulb ${priorityColor} mt-0.5"></i>
        <div>
          <p class="text-gray-700">${rec.message}</p>
          <p class="text-xs text-gray-500">${rec.action}</p>
        </div>
      </div>
    `;
  });
  recommendationsHtml += '</div>';
  
  container.innerHTML = `
    <div class="text-center mb-4">
      <div class="relative inline-flex items-center justify-center">
        <svg class="w-24 h-24 transform -rotate-90">
          <circle cx="48" cy="48" r="42" fill="none" stroke="#e5e7eb" stroke-width="8"/>
          <circle cx="48" cy="48" r="42" fill="none" stroke="${scoreColor}" stroke-width="8" 
                  stroke-dasharray="${2 * Math.PI * 42}" stroke-dashoffset="${2 * Math.PI * 42 * (1 - score/100)}"/>
        </svg>
        <span class="absolute text-2xl font-bold">${score}</span>
      </div>
      <p class="text-sm text-gray-600 mt-2">Overall Health Score</p>
    </div>
    ${metricsHtml}
    <div class="border-t pt-4 mt-4">
      <h4 class="font-semibold text-sm mb-2">Recommendations</h4>
      ${recommendationsHtml}
    </div>
  `;
}

// ==================== CHART FUNCTIONS ====================
function updateCharts(charts) {
  if (typeof Chart === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    script.onload = () => renderCharts(charts);
    document.head.appendChild(script);
  } else {
    renderCharts(charts);
  }
}

function renderCharts(charts) {
  const revenueExpenseCtx = document.getElementById('revenue-expense-chart')?.getContext('2d');
  if (revenueExpenseCtx && charts.revenueVsExpenses) {
    if (window.revenueExpenseChart) window.revenueExpenseChart.destroy();
    
    window.revenueExpenseChart = new Chart(revenueExpenseCtx, {
      type: 'line',
      data: {
        labels: charts.revenueVsExpenses.labels,
        datasets: [
          {
            label: 'Revenue',
            data: charts.revenueVsExpenses.revenue,
            borderColor: '#10b981',
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            fill: true,
            tension: 0.4
          },
          {
            label: 'Expenses',
            data: charts.revenueVsExpenses.expenses,
            borderColor: '#ef4444',
            backgroundColor: 'rgba(239, 68, 68, 0.1)',
            fill: true,
            tension: 0.4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top' },
          tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${formatCurrency(ctx.raw)}` } }
        }
      }
    });
  }
  
  const expenseBreakdownCtx = document.getElementById('expense-breakdown-chart')?.getContext('2d');
  if (expenseBreakdownCtx && charts.expenseBreakdown) {
    if (window.expenseBreakdownChart) window.expenseBreakdownChart.destroy();
    
    window.expenseBreakdownChart = new Chart(expenseBreakdownCtx, {
      type: 'doughnut',
      data: {
        labels: charts.expenseBreakdown.labels,
        datasets: [{
          data: charts.expenseBreakdown.values,
          backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right' },
          tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${formatCurrency(ctx.raw)}` } }
        }
      }
    });
  }
}

                           'showDashboardHome()'}"

          </button>

      </div>
    `;
  }).join('');
}

function filterApps() {
  const searchTerm = document.getElementById('apps-search')?.value.toLowerCase() || '';
  const appCards = document.querySelectorAll('#all-apps-grid > div');
  
  appCards.forEach(card => {
    const title = card.querySelector('h3')?.textContent.toLowerCase() || '';
    if (title.includes(searchTerm)) {
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
}


// ==================== MODULE MANAGEMENT====================

function openModule(moduleName) {
  const access = getModuleAccess(moduleName);
  
  if (!access.isAccessible) {
    showNotification(access.message || 'Upgrade to access this module', 'warning');
    showUpgradeModal();
    return;
  }
  
  currentModuleName = moduleName;
  
  // Get all page containers
  const dashboardHome = document.getElementById('dashboard-home');
  const moduleView = document.getElementById('module-view');
  const dashboardPage = document.getElementById('dashboard-page');
  const appsPage = document.getElementById('apps-page');
  const profilePage = document.getElementById('profile-page');
  const settingsPage = document.getElementById('settings-page');
  
  // HIDE ALL OTHER PAGES
  if (dashboardHome) {
    dashboardHome.classList.add('hidden');
    dashboardHome.style.display = 'none';
  }
  if (appsPage) {
    appsPage.classList.add('hidden');
    appsPage.style.display = 'none';
  }
  if (profilePage) {
    profilePage.classList.add('hidden');
    profilePage.style.display = 'none';
  }
  if (settingsPage) {
    settingsPage.classList.add('hidden');
    settingsPage.style.display = 'none';
  }
  
  // SHOW MODULE VIEW
  if (moduleView) {
    moduleView.classList.remove('hidden');
    moduleView.style.display = 'block';
  }
  if (dashboardPage) {
    dashboardPage.classList.remove('hidden');
    dashboardPage.style.display = 'block';
  }
  
  const pageTitle = document.getElementById('page-title');
  const moduleTitle = document.getElementById('module-title');
  const moduleConfig = MODULES[moduleName];
  
  if (pageTitle) pageTitle.textContent = moduleConfig?.label || moduleName;
  if (moduleTitle) moduleTitle.textContent = moduleConfig?.label || moduleName;
  
  loadModuleForm(moduleName);
  loadModuleTableWithSync(moduleName);
}

    // DEMO USERS: Show all modules with (Demo) badge

      container.innerHTML += `

function setupDynamicFields(moduleName) {
  console.log('Setting up dynamic fields for:', moduleName);
  
  // ==================== FINANCE MODULE ====================
  if (moduleName === 'Finance') {
    const typeSelect = document.getElementById('Type');
    const categorySelect = document.getElementById('Category');
    
    if (typeSelect) {
      const newTypeSelect = typeSelect.cloneNode(true);
      typeSelect.parentNode.replaceChild(newTypeSelect, typeSelect);
      
      newTypeSelect.addEventListener('change', function(e) {
        const selectedType = e.target.value;
        console.log('Type changed to:', selectedType);
        if (selectedType) {
          triggerCategoryLoad(selectedType);
        }
      });
      
      if (newTypeSelect.value) {
        triggerCategoryLoad(newTypeSelect.value);
      }
    }
    
    if (categorySelect) {
      const newCategorySelect = categorySelect.cloneNode(true);
      categorySelect.parentNode.replaceChild(newCategorySelect, categorySelect);
      
      newCategorySelect.addEventListener('change', function(e) {
        const selectedCategory = e.target.value;
        console.log('Category changed to:', selectedCategory);
        triggerSubcategoryLoad(selectedCategory);
      });
    }
  }
  
  // ==================== AGRO MODULE (ONLY ONCE) ====================
  if (moduleName === 'Agro') {
    const agroTypeSelect = document.getElementById('Type');
    
    if (agroTypeSelect) {
      const newAgroTypeSelect = agroTypeSelect.cloneNode(true);
      agroTypeSelect.parentNode.replaceChild(newAgroTypeSelect, agroTypeSelect);
      
      newAgroTypeSelect.addEventListener('change', function(e) {
        const type = e.target.value;
        console.log('Agro type changed to:', type);
        
        const cropField = document.getElementById('crop_field');
        const livestockField = document.getElementById('livestock_field');
        const activitySelect = document.getElementById('Activity');
        const quantityInput = document.getElementById('Quantity');
        const unitCostInput = document.getElementById('Unit_Cost');
        const totalCostInput = document.getElementById('Total_Cost');
        const sellingPriceInput = document.getElementById('Selling_Price');
        const revenueInput = document.getElementById('Revenue');
        
        if (cropField) cropField.style.display = type === 'Crop' ? 'block' : 'none';
        if (livestockField) livestockField.style.display = type === 'Livestock' ? 'block' : 'none';
        
        if (activitySelect && type) {
          callGoogleScript('getAgroActivities', [type], (activities) => {
            activitySelect.innerHTML = '<option value="">Select Activity</option>';
            activities.forEach(act => {
              activitySelect.innerHTML += `<option value="${act}">${act}</option>`;
            });
          });
        }
        
        const calculateCost = () => {
          const qty = parseFloat(quantityInput?.value) || 0;
          const cost = parseFloat(unitCostInput?.value) || 0;
          if (totalCostInput) {
            totalCostInput.value = (qty * cost).toFixed(2);
          }
        };
        
        const calculateRevenue = () => {
          const qty = parseFloat(quantityInput?.value) || 0;
          const price = parseFloat(sellingPriceInput?.value) || 0;
          if (revenueInput) {
            revenueInput.value = (qty * price).toFixed(2);
          }
        };
        
        if (quantityInput) {
          const newQuantity = quantityInput.cloneNode(true);
          quantityInput.parentNode.replaceChild(newQuantity, quantityInput);
          newQuantity.addEventListener('input', () => { calculateCost(); calculateRevenue(); });
        }
        
        if (unitCostInput) {
          const newUnitCost = unitCostInput.cloneNode(true);
          unitCostInput.parentNode.replaceChild(newUnitCost, unitCostInput);
          newUnitCost.addEventListener('input', calculateCost);
        }
        
        if (sellingPriceInput) {
          const newSellingPrice = sellingPriceInput.cloneNode(true);
          sellingPriceInput.parentNode.replaceChild(newSellingPrice, sellingPriceInput);
          newSellingPrice.addEventListener('input', calculateRevenue);
        }
      });
      
      if (newAgroTypeSelect.value) {
        const event = new Event('change');
        newAgroTypeSelect.dispatchEvent(event);
      }
    }
  }
  
  // ==================== SALES / ECOMMERCE MODULE ====================
  if (moduleName === 'Sales' || moduleName === 'Ecommerce') {
    console.log('Setting up Ecommerce/Sales fields, waiting for DOM...');
    
    let attempts = 0;
    const maxAttempts = 10;
    
    function setupEcommerceFields() {
      attempts++;
      console.log(`Attempt ${attempts} to setup Ecommerce fields`);
      
      const quantityInput = document.getElementById('Quantity');
      const priceInput = document.getElementById('Unit_Price');
      const totalInput = document.getElementById('Total_Amount');
      
      if (quantityInput && priceInput) {
        try {
          const calculateTotal = () => {
            const qty = parseFloat(quantityInput?.value) || 0;
            const price = parseFloat(priceInput?.value) || 0;
            if (totalInput) {
              totalInput.value = (qty * price).toFixed(2);
            }
          };
          
          const newQuantity = quantityInput.cloneNode(true);
          quantityInput.parentNode?.replaceChild(newQuantity, quantityInput);
          newQuantity.addEventListener('input', calculateTotal);
          
          const newPrice = priceInput.cloneNode(true);
          priceInput.parentNode?.replaceChild(newPrice, priceInput);
          newPrice.addEventListener('input', calculateTotal);
          
          calculateTotal();
          console.log('Ecommerce/Sales fields setup complete');
        } catch (err) {
          console.error('Error setting up Ecommerce fields:', err);
        }
      } else if (attempts < maxAttempts) {
        setTimeout(setupEcommerceFields, 200);
      } else {
        console.error('Could not find Ecommerce/Sales form elements after', maxAttempts, 'attempts');
      }
    }
    
    setTimeout(setupEcommerceFields, 200);
  }
}

function setupAutoCalculations(moduleName) {
  if (moduleName === 'Finance') {
    // No auto-calculation needed for finance
  }
  else if (moduleName === 'Sales' || moduleName === 'Ecommerce') {
    const quantity = document.getElementById('Quantity');
    const unitPrice = document.getElementById('Unit_Price');
    const totalAmount = document.getElementById('Total_Amount');
    
    const calculateTotal = () => {
      const qty = parseFloat(quantity?.value) || 0;
      const price = parseFloat(unitPrice?.value) || 0;
      if (totalAmount) totalAmount.value = (qty * price).toFixed(2);
    };
    
    if (quantity) quantity.addEventListener('input', calculateTotal);
    if (unitPrice) unitPrice.addEventListener('input', calculateTotal);
  }
  else if (moduleName === 'Agro') {
    const quantity = document.getElementById('Quantity');
    const unitCost = document.getElementById('Unit_Cost');
    const totalCost = document.getElementById('Total_Cost');
    const sellingPrice = document.getElementById('Selling_Price');
    const revenue = document.getElementById('Revenue');
    
    const calculateCost = () => {
      const qty = parseFloat(quantity?.value) || 0;
      const cost = parseFloat(unitCost?.value) || 0;
      if (totalCost) totalCost.value = (qty * cost).toFixed(2);
    };
    
    const calculateRevenue = () => {
      const qty = parseFloat(quantity?.value) || 0;
      const price = parseFloat(sellingPrice?.value) || 0;
      if (revenue) revenue.value = (qty * price).toFixed(2);
    };
    
    if (quantity) quantity.addEventListener('input', () => { calculateCost(); calculateRevenue(); });
    if (unitCost) unitCost.addEventListener('input', calculateCost);
    if (sellingPrice) sellingPrice.addEventListener('input', calculateRevenue);
  }
}

function setDefaultValues() {

function triggerCategoryLoad(selectedType) {
  if (!selectedType) {
    console.warn('triggerCategoryLoad: No type selected');
    return;
  }
  
  console.log('Loading categories for type:', selectedType);
  
  callGoogleScript('getCategoriesByType', [selectedType], 
    (categories) => {
      try {
        console.log('Categories received:', categories);
        const categorySelect = document.getElementById('Category');
        if (categorySelect) {
          if (categories && Array.isArray(categories) && categories.length > 0) {
            categorySelect.innerHTML = '<option value="">Select Category</option>';
            categories.forEach(cat => {
              categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
            categorySelect.innerHTML += '<option value="Other">Other (Add New)</option>';
          } else {
            categorySelect.innerHTML = '<option value="">Select Category</option><option value="Other">Other</option>';
          }
        }
      } catch (err) {
        console.error('Error in triggerCategoryLoad callback:', err);
      }
    },
    (error) => {
      console.error('Failed to load categories for type:', selectedType, error);
      const categorySelect = document.getElementById('Category');
      if (categorySelect) {
        categorySelect.innerHTML = '<option value="">Select Category</option><option value="Other">Other</option>';
      }
    }
  );
}

function triggerSubcategoryLoad(selectedCategory) {
  if (!selectedCategory || selectedCategory === 'Other' || selectedCategory === '') {
    console.log('No subcategory load needed for:', selectedCategory);
    return;
  }
  
  console.log('Loading subcategories for category:', selectedCategory);
  
  callGoogleScript('getSubcategories', [selectedCategory], 
    (subcategories) => {
      try {
        console.log('Subcategories received:', subcategories);
        const subcatSelect = document.getElementById('Subcategory');
        if (subcatSelect) {
          if (subcategories && Array.isArray(subcategories) && subcategories.length > 0) {
            subcatSelect.innerHTML = '<option value="">Select Subcategory</option>';
            subcategories.forEach(sub => {
              subcatSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
            });
            subcatSelect.innerHTML += '<option value="Other">Other</option>';
          } else {
            subcatSelect.innerHTML = '<option value="">Select Subcategory</option><option value="Other">Other</option>';
          }
        }
      } catch (err) {
        console.error('Error in triggerSubcategoryLoad callback:', err);
      }
    },
    (error) => {
      console.error('Failed to load subcategories for category:', selectedCategory, error);
      const subcatSelect = document.getElementById('Subcategory');
      if (subcatSelect) {
        subcatSelect.innerHTML = '<option value="">Select Subcategory</option><option value="Other">Other</option>';
      }
    }
  );
}

function submitModuleForm() {
  // First check access using checkModuleAccess
  if (!checkModuleAccess(currentModuleName)) {
    return;  // Notification already shown in checkModuleAccess
  }
  
  // Then do the actual save
  if (isLoading) {
    showNotification('Please wait...', 'warning');
    return;
  }
  
  isLoading = true;
  
  const form = document.getElementById('module-form');
  const inputs = form.querySelectorAll('input, select, textarea');
  
  const data = {};
  inputs.forEach(input => {
    if (input.id) {
      data[input.id] = input.value;
    }
  });
  
  if (!data.Date && MODULES[currentModuleName]?.sheet === 'Financial_Data') {
    data.Date = new Date().toISOString().split('T')[0];
  }
  
  callGoogleScript(
    'saveRecord',
    [currentModuleName, data],
    (res) => {
      showNotification(res.message, res.success ? 'success' : 'error');
      if (res.success) {
        inputs.forEach(input => {
          if (input.type !== 'submit') input.value = '';
        });
        loadModuleTable(currentModuleName);
      }
      isLoading = false;
    },
    () => {
      showNotification('Save failed. Please try again.', 'error');
      isLoading = false;
    }
  );
}

function loadModuleTableWithSync(moduleName) {
  callGoogleScript(
    'getModuleDataWithSync',
    [moduleName],
    (response) => {
      // ===== ADD THIS SAFETY CHECK AT THE VERY TOP =====
      if (!response) {
        console.error('getModuleDataWithSync returned null');
        const thead = document.getElementById('module-table-head');
        const tbody = document.getElementById('module-table-body');

        showNotification('Failed to load data. Please refresh.', 'error');
        return;

      if (response.success === false) {
        showNotification(response.message || 'Failed to load module data', 'error');

      // ===== HANDLE RESPONSE THAT MIGHT BE DIRECT ARRAY =====
      let records = [];

        <tr>

function editRecord(index) {
  const record = currentModuleData[index];
  const form = document.getElementById('module-form');
  
  if (!form) return;
  
  Object.keys(record).forEach(key => {
    const input = form.querySelector(`#${key}`);
    if (input) input.value = record[key];
  });
  
  form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  showNotification('Edit the record and click Save', 'info');
}

function showDeleteModal(index) {
  currentDeleteIndex = index;
  const modal = document.getElementById('delete-modal');
  if (modal) modal.classList.remove('hidden');
}

function confirmDelete() {
  if (currentDeleteIndex === null) return;
  
  // Check access before deleting
  if (!checkModuleAccess(currentModuleName)) {
    closeDeleteModal();
    return;
  }
  
  callGoogleScript(
    'deleteRecord',
    [currentModuleName, currentDeleteIndex],
    (res) => {
      showNotification(res.message, res.success ? 'success' : 'error');
      if (res.success) {
        loadModuleTable(currentModuleName);
      }
      closeDeleteModal();
      currentDeleteIndex = null;
    },
    () => {
      showNotification('Delete failed', 'error');
      closeDeleteModal();
    }
  );
}

function closeDeleteModal() {
  const modal = document.getElementById('delete-modal');
  if (modal) modal.classList.add('hidden');
}

function closeImportModal() {
  const modal = document.getElementById('import-modal');
  if (modal) modal.classList.add('hidden');
}

function searchTable() {
  const searchTerm = document.getElementById('table-search')?.value.toLowerCase() || '';
  const filterType = document.getElementById('filter-type')?.value || '';
  
  filteredRecords = currentModuleData.filter(record => {
    let matchesSearch = true;
    if (searchTerm) {
      matchesSearch = Object.values(record).some(value => 
        String(value).toLowerCase().includes(searchTerm)
      );
    }
    
    let matchesType = true;
    if (filterType && filterType !== '') {
      matchesType = (record.Type || '').toLowerCase() === filterType;
    }
    
    return matchesSearch && matchesType;
  });
  
  currentPage = 1;
  renderTableWithPagination();
}

// ==================== TABLE PAGINATION ====================
function renderTableWithPagination() {
  const start = (currentPage - 1) * recordsPerPage;
  const end = start + recordsPerPage;
  const pageRecords = filteredRecords.slice(start, end);
  
  renderTableBody(pageRecords);
  
  const totalPages = Math.ceil(filteredRecords.length / recordsPerPage);
  updatePaginationControls(totalPages);
}

function renderTableBody(pageRecords) {
  const tbody = document.getElementById('module-table-body');
  if (!tbody) return;
  
  if (!pageRecords || pageRecords.length === 0) {
    tbody.innerHTML = '<tr><td colspan="100" class="text-center text-gray-500 py-8">No records found</td></tr>';
    return;
  }
  
  const headers = Object.keys(pageRecords[0]);
  
  tbody.innerHTML = pageRecords.map((row, i) => `
    <tr class="hover:bg-gray-50">
      ${headers.map(h => `<td class="px-4 py-2 text-sm text-gray-600">${row[h] || ''}</td>`).join('')}
      <td class="px-4 py-2 text-sm">
        <button onclick="editRecord(${(currentPage - 1) * recordsPerPage + i})" class="text-blue-600 hover:text-blue-800 mr-3">
          <i class="fas fa-edit"></i>
        </button>
        <button onclick="showDeleteModal(${(currentPage - 1) * recordsPerPage + i})" class="text-red-600 hover:text-red-800">
          <i class="fas fa-trash"></i>
        </button>
      </td>
    </tr>
  `).join('');
}

function updatePaginationControls(totalPages) {
  let paginationHtml = `
    <div class="flex justify-between items-center mt-4">
      <div class="text-sm text-gray-500">
        Showing ${(currentPage-1)*recordsPerPage+1} to ${Math.min(currentPage*recordsPerPage, filteredRecords.length)} of ${filteredRecords.length} records
      </div>
      <div class="flex gap-2">
        <button onclick="changePage(${currentPage-1})" ${currentPage === 1 ? 'disabled' : ''} 
                class="px-3 py-1 border rounded ${currentPage === 1 ? 'opacity-50' : 'hover:bg-gray-100'}">
          Previous
        </button>
        <span class="px-3 py-1">Page ${currentPage} of ${totalPages}</span>
        <button onclick="changePage(${currentPage+1})" ${currentPage === totalPages ? 'disabled' : ''}
                class="px-3 py-1 border rounded ${currentPage === totalPages ? 'opacity-50' : 'hover:bg-gray-100'}">
          Next
        </button>
      </div>
    </div>
  `;
  
  const existingPagination = document.querySelector('.pagination-controls');
  if (existingPagination) existingPagination.remove();
  
  const tableContainer = document.querySelector('#module-view .table-container');
  if (tableContainer) {
    tableContainer.insertAdjacentHTML('afterend', `<div class="pagination-controls">${paginationHtml}</div>`);
  }
}

function changePage(newPage) {
  currentPage = newPage;
  renderTableWithPagination();
}

// ==================== TABLE EDITABLE (Double-click to edit) ====================
function makeTableEditable() {
  document.querySelectorAll('#module-table-body td').forEach(cell => {
    cell.addEventListener('dblclick', function(e) {
      const row = this.closest('tr');
      const rowIndex = row.getAttribute('data-index');
      const columnName = row.getAttribute('data-columns').split(',')[this.cellIndex];
      const currentValue = this.textContent;
      
      const input = document.createElement('input');
      input.value = currentValue;
      input.className = 'w-full p-1 border rounded';
      input.addEventListener('blur', function() {
        const newValue = this.value;
        if (newValue !== currentValue) {
          updateCellValue(rowIndex, columnName, newValue);
        }
        cell.textContent = newValue;
      });
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') this.blur();
      });
      
      this.textContent = '';
      this.appendChild(input);
      input.focus();
    });
  });
}

function updateCellValue(rowIndex, columnName, newValue) {
  callGoogleScript(
    'updateRecordField',
    [currentModuleName, rowIndex, columnName, newValue],
    (response) => {
      if (response.success) {
        showNotification('Updated', 'success');
      } else {
        showNotification('Update failed', 'error');
        loadModuleTable(currentModuleName);
      }
    }
  );
}

  callGoogleScript('getModuleData', [currentModuleName], (data) => {

                     originalRecord['Record_ID'] || originalRecord['Employee_ID'];

// ==================== EXPORT / IMPORT ====================
function exportModuleData() {
  if (!currentModuleName) {
    showNotification('No module selected', 'warning');
    return;
  }
  
  showNotification('Exporting data...', 'info');
  
  callGoogleScript(
    'exportModuleData',
    [currentModuleName],
    (res) => {
      if (res.success && res.csv) {
        const blob = new Blob([res.csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = res.filename || `${currentModuleName}_export.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification('Export successful', 'success');
      } else {
        showNotification(res.message || 'Export failed', 'error');
      }
    },
    () => showNotification('Export failed', 'error')
  );
}

  const modal = document.getElementById('import-modal');

function uploadCSV() {
  const fileInput = document.getElementById('csv-file-input');
  if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
    showNotification('Please select a CSV file', 'warning');
    return;
  }
  
  const file = fileInput.files[0];
  const reader = new FileReader();
  
  reader.onload = function(e) {
    const content = e.target.result;
    const lines = content.split('\n');
    const rows = lines.slice(1).map(line => line.split(',')).filter(row => row.length > 1);
    
    if (rows.length === 0) {
      showNotification('CSV file is empty', 'warning');
      return;
    }
    
    callGoogleScript(
      'importCSV',
      [currentModuleName, rows],
      (res) => {
        showNotification(res.message, res.success ? 'success' : 'error');
        if (res.success) {
          closeImportModal();
          loadModuleTable(currentModuleName);
          fileInput.value = '';
        }
      },
      () => showNotification('Import failed', 'error')
    );
  };
  
  reader.readAsText(file);
}

function detectUserCountryLightweight() {
  return new Promise((resolve) => {
    // Use a simple, reliable CDN that works everywhere
    const script = document.createElement('script');
    script.src = 'https://ipapi.co/json/?callback=handleCountryResponse';
    
    // Set timeout to prevent hanging
    const timeout = setTimeout(() => {
      script.remove();
      // Fallback to US (not Nigeria) - more neutral for global trust
      resolve({ country: 'United States', countryCode: 'US', currency: 'USD', symbol: '$' });
    }, 3000);
    
    window.handleCountryResponse = function(data) {
      clearTimeout(timeout);
      script.remove();
      resolve({
        country: data.country_name || 'United States',
        countryCode: data.country_code || 'US',
        currency: data.currency || 'USD',
        symbol: data.currency_symbol || '$'
      });
    };
    
    document.head.appendChild(script);
  });
}

async function handleUpgradeRequest(event) {
  event.preventDefault();
  
  const country = document.getElementById('upgrade-country').value;
  if (!country) {
    showNotification('Please select your country', 'warning');
    return;
  }
  
  // Collect business details
  const businessDetails = {};
  const requiredFields = window.currentCountryRequirements?.requiredFields || [];
  
  for (const field of requiredFields) {
    const value = document.getElementById(`upgrade-${field}`)?.value;
    if (!value) {
      showNotification(`Please provide ${window.currentCountryRequirements?.fieldLabels[field] || field}`, 'warning');
      return;
    }
    businessDetails[field] = value;
  }
  
  // Handle file upload if present
  const fileInput = document.getElementById('business-certificate');
  let certificateBase64 = null;
  let certificateName = null;
  
  if (fileInput && fileInput.files.length > 0) {
    const file = fileInput.files[0];
    
    // Check file size (max 2MB)
    if (file.size > 2 * 1024 * 1024) {
      showNotification('File size must be less than 2MB', 'warning');
      return;
    }
    
    // Check file type
    const allowedTypes = ['application/pdf', 'image/png', 'image/jpeg', 'image/jpg'];
    if (!allowedTypes.includes(file.type)) {
      showNotification('Please upload PDF, PNG, or JPG file', 'warning');
      return;
    }
    
    // Show progress
    const progressDiv = document.getElementById('upload-progress');
    const progressBar = document.getElementById('upload-progress-bar');
    if (progressDiv) progressDiv.classList.remove('hidden');
    if (progressBar) progressBar.style.width = '30%';
    
    try {
      // Convert to base64
      certificateBase64 = await fileToBase64(file);
      certificateName = file.name;
      
      if (progressBar) progressBar.style.width = '100%';
      setTimeout(() => {
        if (progressDiv) progressDiv.classList.add('hidden');
        if (progressBar) progressBar.style.width = '0%';
      }, 500);
    } catch (error) {
      console.error('File conversion error:', error);
      showNotification('Failed to process file', 'error');
      if (progressDiv) progressDiv.classList.add('hidden');
      return;
    }
  }
  
  const submitBtn = event.target.querySelector('button[type="submit"]');
  const originalText = submitBtn.textContent;
  submitBtn.textContent = 'Submitting...';
  submitBtn.disabled = true;
  
  const upgradeData = {
    country: country,
    businessDetails: businessDetails,
    certificateBase64: certificateBase64,
    certificateName: certificateName,
    tier: 'sovereign'
  };
  
  console.log('Sending upgrade request with:', {
    country: country,
    hasCertificate: !!certificateBase64,
    certificateName: certificateName,
    businessDetailsFields: Object.keys(businessDetails)
  });
  
  callGoogleScript(
    'handleUpgradeRequest',
    [upgradeData],
    (res) => {
      submitBtn.textContent = originalText;
      submitBtn.disabled = false;
      
      if (res.success) {
        showNotification(res.message, 'success');
        closeUpgradeModal();
        if (res.redirectUrl) {
          // Apps Script runs this page inside a sandboxed iframe. The callback
          // is asynchronous, so top-window navigation can be blocked by the
          // iframe sandbox. Navigate the current frame to the server-rendered
          // payment page instead; the payment page handles its own user-driven
          // top-level checkout navigation.
          var redirectUrl = String(res.redirectUrl);
          console.log('Upgrade request created. Opening payment method:', redirectUrl);
          window.location.assign(redirectUrl);
          return;
        }
        // Reset form
        document.getElementById('upgrade-form').reset();
        const fileInput = document.getElementById('business-certificate');
        if (fileInput) fileInput.value = '';
        const previewDiv = document.getElementById('file-name-preview');
        if (previewDiv) previewDiv.classList.add('hidden');
      } else {
        showNotification(res.message, 'error');
      }
    },
    (error) => {
      submitBtn.textContent = originalText;
      submitBtn.disabled = false;
      console.error('Upgrade request error:', error);
      showNotification('Upgrade request failed. Please try again.', 'error');
    }
  );
}

// Helper function to convert file to base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const base64String = reader.result;
      resolve(base64String);
    };
    reader.onerror = (error) => {
      console.error('FileReader error:', error);
      reject(error);
    };
    reader.readAsDataURL(file);
  });
}

// Store country requirements globally
window.currentCountryRequirements = null;

// Modified loadCountryRequirementsForUpgrade
function loadCountryRequirementsForUpgrade() {
  const country = document.getElementById('upgrade-country').value;
  const fieldsContainer = document.getElementById('upgrade-country-fields');
  const requirementsDiv = document.getElementById('upgrade-requirements');
  const requirementsText = document.getElementById('upgrade-requirements-text');
  const documentUploadSection = document.getElementById('document-upload-section');
  
  if (!country) {
    fieldsContainer.innerHTML = '';
    requirementsDiv.classList.add('hidden');
    if (documentUploadSection) documentUploadSection.classList.add('hidden');
    window.currentCountryRequirements = null;
    return;
  }
  
  fieldsContainer.innerHTML = '<div class="text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i>Loading requirements...</div>';
  if (documentUploadSection) documentUploadSection.classList.add('hidden');
  
  google.script.run
    .withSuccessHandler(function(response) {
      if (response.success) {
        // Store requirements globally
        window.currentCountryRequirements = response;
        
        let fieldsHtml = '';
        response.requiredFields.forEach(field => {
          const label = response.fieldLabels[field] || field;
          const placeholder = response.placeholders[field] || `Enter ${label}`;
          fieldsHtml += `
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-2">${label} *</label>
              <input type="text" id="upgrade-${field}" name="upgrade-${field}" 
                     class="input-field w-full border rounded-lg p-2" 
                     placeholder="${placeholder}" required>
              <p class="text-xs text-gray-500 mt-1">Required for ${country} verification</p>
            </div>
          `;
        });
        fieldsContainer.innerHTML = fieldsHtml;
        
        // Show document upload section
        if (documentUploadSection && response.documentTypes && response.documentTypes.length > 0) {
          documentUploadSection.classList.remove('hidden');
          const docRequirementsText = document.getElementById('document-requirements-text');
          if (docRequirementsText) {
            docRequirementsText.innerHTML = `<strong>Required documents:</strong> ${response.documentTypes.join(', ')}`;
          }
        }
        
        let docsList = '<ul class="list-disc list-inside mt-2">';
        if (response.documentTypes && response.documentTypes.length > 0) {
          response.documentTypes.forEach(doc => {
            docsList += `<li>${doc}</li>`;
          });
        } else {
          docsList += '<li>Business Registration Certificate</li>';
          docsList += '<li>Tax Identification Document</li>';
        }
        docsList += '</ul>';
        
        requirementsText.innerHTML = `
          <strong><i class="fas fa-file-alt mr-1"></i> Required Documents for ${response.country || country}:</strong>
          ${docsList}
          <p class="mt-2"><strong>Processing time:</strong> ${response.processingTime || '24-48 hours'}</p>
          <p class="mt-2 text-sm text-yellow-700"><i class="fas fa-info-circle mr-1"></i> Upload your documents below. They will be verified after payment.</p>
        `;
        requirementsDiv.classList.remove('hidden');
      } else {
        fieldsContainer.innerHTML = `<div class="text-red-500 p-4 text-center">${response.message || 'Country not supported'}</div>`;
        if (documentUploadSection) documentUploadSection.classList.add('hidden');
        requirementsDiv.classList.add('hidden');
      }
    })
    .withFailureHandler(function(error) {
      console.error('Error loading country requirements:', error);
      fieldsContainer.innerHTML = '<div class="text-red-500 p-4 text-center">Error loading requirements. Please try again.</div>';
      if (documentUploadSection) documentUploadSection.classList.add('hidden');
    })
    .getCountryRequirements(country);
}

  });
  
  // Find and activate the clicked tab
  const activeTab = document.querySelector(`.recent-tab[data-type="${tabType}"]`);
  if (activeTab) {
    activeTab.classList.remove('text-gray-500', 'border-transparent');
    activeTab.classList.add('text-purple-600', 'border-purple-600', 'active-tab');
  }
  
  // Hide all recent records lists
  document.querySelectorAll('.recent-records-list').forEach(list => {
    list.classList.add('hidden');
  });
  
  // Show the selected list
  const targetList = document.getElementById(`recent-${tabType}-records`);
  if (targetList) {
    targetList.classList.remove('hidden');
  }
}

// Global loading overlay
function showGlobalLoading(message = 'Loading...') {
  let overlay = document.getElementById('global-loading-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'global-loading-overlay';
    overlay.style.cssText = `
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.9);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 999999; backdrop-filter: blur(5px);
    `;
    overlay.innerHTML = `
      <div class="flex flex-col items-center">
        <div class="global-loader"></div>
        <p id="loading-message" class="text-gray-700 mt-6 text-lg font-medium">${message}</p>
      </div>
    `;
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
  const msgEl = document.getElementById('loading-message');
  if (msgEl) msgEl.textContent = message;
}

function hideGlobalLoading() {
  const overlay = document.getElementById('global-loading-overlay');
  if (overlay) overlay.style.display = 'none';
}

// Wrapped API call with loading
function callGoogleScriptWithLoading(functionName, params, successHandler, errorHandler, loadingMessage = 'Please wait...') {
  showGlobalLoading(loadingMessage);
  callGoogleScript(functionName, params, 
    (res) => { hideGlobalLoading(); if (successHandler) successHandler(res); },
    (err) => { hideGlobalLoading(); if (errorHandler) errorHandler(err); }
  );
}

// Show skeleton loader for tables
function showTableSkeleton(tableId, columns = 5, rows = 5) {
  const table = document.getElementById(tableId);
  if (!table) return;
  const tbody = table.querySelector('tbody') || table;
  let html = '';
  for (let i = 0; i < rows; i++) {

function initSidebarEvents() {
  console.log('Initializing sidebar events');
  
  // Menu toggle button
  const menuToggle = document.getElementById('menu-toggle');
  if (menuToggle) {
    // Remove any existing listeners to avoid duplicates
    const newToggle = menuToggle.cloneNode(true);
    if (menuToggle.parentNode) {
      menuToggle.parentNode.replaceChild(newToggle, menuToggle);
    }
    newToggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      toggleSidebar();
    });
    console.log('Menu toggle event bound');
  } else {
    console.warn('Menu toggle button not found');
  }
  
  // Sidebar overlay click
  const overlay = document.getElementById('sidebar-overlay');
  if (overlay) {
    const newOverlay = overlay.cloneNode(true);
    if (overlay.parentNode) {
      overlay.parentNode.replaceChild(newOverlay, overlay);
    }
    newOverlay.addEventListener('click', closeSidebar);
    console.log('Overlay click event bound');
  }
  
  // Profile sidebar menu toggle (if exists)
  const profileMenuToggle = document.getElementById('profile-menu-toggle');
  if (profileMenuToggle) {
    const newProfileToggle = profileMenuToggle.cloneNode(true);
    if (profileMenuToggle.parentNode) {
      profileMenuToggle.parentNode.replaceChild(newProfileToggle, profileMenuToggle);
    }
    newProfileToggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      toggleProfileSidebar();
    });
    console.log('Profile menu toggle event bound');
  }
  
  // Profile sidebar overlay
  const profileOverlay = document.getElementById('profile-sidebar-overlay');
  if (profileOverlay) {
    const newProfileOverlay = profileOverlay.cloneNode(true);
    if (profileOverlay.parentNode) {
      profileOverlay.parentNode.replaceChild(newProfileOverlay, profileOverlay);
    }
    newProfileOverlay.addEventListener('click', closeProfileSidebar);
  }
}

// Close sidebar when window is resized above mobile breakpoint
function handleResize() {
  if (window.innerWidth > 768) {
    closeSidebar();
    closeProfileSidebar();
  }
}

// Click outside to close (for mobile)
function handleDocumentClick(event) {
  const sidebar = document.getElementById('sidebar');
  const menuToggle = document.getElementById('menu-toggle');
  const profileSidebar = document.getElementById('profile-sidebar');
  const profileMenuToggle = document.getElementById('profile-menu-toggle');
  
  // Close main sidebar if clicking outside
  if (window.innerWidth <= 768 && sidebar && sidebar.classList.contains('open')) {
    if (!sidebar.contains(event.target) && event.target !== menuToggle && !menuToggle?.contains(event.target)) {
      closeSidebar();
    }
  }
  
  // Close profile sidebar if clicking outside
  if (window.innerWidth <= 768 && profileSidebar && profileSidebar.classList.contains('open')) {
    if (!profileSidebar.contains(event.target) && event.target !== profileMenuToggle && !profileMenuToggle?.contains(event.target)) {
      closeProfileSidebar();
    }
  }
}

        container.innerHTML += `
          <button onclick="openModule('${moduleName}')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center space-x-3">
            <i class="fas ${iconClass} text-gray-500 w-5"></i>

            <i class="fas fa-lock text-gray-400 text-xs"></i>
          </button>
        `;
      }
      modulesRendered++;
    } else {
      container.innerHTML += `
        <button onclick="openModule('${moduleName}')" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center space-x-3">
          <i class="fas ${iconClass} text-gray-500 w-5"></i>
          <span>${label}</span>
        </button>
      `;
      modulesRendered++;

  const menu = document.getElementById('settings-sidebar-menu');

  const chevron = document.getElementById('settings-sidebar-chevron');
  if (!menu) return;
  const willOpen = menu.classList.contains('hidden');
  menu.classList.toggle('hidden', !willOpen);

  if (chevron) chevron.classList.toggle('rotate-180', willOpen);

function loadNotificationPreferences() {
  const prefs = JSON.parse(localStorage.getItem('bizos_notification_prefs') || '{}');
  
  const toggles = {
    'notif-features': prefs.features !== false,
    'notif-system': prefs.system !== false,
    'notif-weekly': prefs.weekly === true,
    'notif-security': prefs.security !== false,
    'notif-marketing': prefs.marketing === true
  };
  
  for (const [id, checked] of Object.entries(toggles)) {
    const el = document.getElementById(id);
    if (el) el.checked = checked;
  }
}

function saveNotificationPreferences() {
  const prefs = {
    features: document.getElementById('notif-features').checked,
    system: document.getElementById('notif-system').checked,
    weekly: document.getElementById('notif-weekly').checked,
    security: document.getElementById('notif-security').checked,
    marketing: document.getElementById('notif-marketing').checked
  };
  
  localStorage.setItem('bizos_notification_prefs', JSON.stringify(prefs));

// ===== NOTIFICATION DROPDOWN FUNCTIONS =====

function toggleNotificationCenter() {
  const dropdown = document.getElementById('notification-dropdown');
  if (dropdown) {
    dropdown.classList.toggle('hidden');
    if (!dropdown.classList.contains('hidden')) {
      loadNotificationsForDropdown();
    }
  }
}

function loadNotificationsForDropdown() {
  const list = document.getElementById('notification-list');
  if (!list) return;
  
  const prefs = JSON.parse(localStorage.getItem('bizos_notification_prefs') || '{}');
  let notifications = [];
  let badgeCount = 0;
  
  // Welcome notification
  if (!localStorage.getItem('bizos_welcome_seen')) {
    notifications.push({
      id: 1,
      icon: 'fa-bell',
      color: 'text-purple-600',
      title: 'Welcome to BizOS!',
      message: 'Get started with your new account',
      time: 'Just now',
      module: 'All'
    });
    badgeCount++;
  }
  
  // Feature updates (if enabled)
  if (prefs.features !== false) {
    notifications.push({
      id: 2,
      icon: 'fa-rocket',
      color: 'text-blue-600',
      title: 'New Feature Available',
      message: 'Check out the new Warehouse Management module',
      time: '1 hour ago',
      module: 'Warehouse'
    });
    badgeCount++;
  }
  
  // Security alerts (if enabled)
  if (prefs.security !== false) {
    notifications.push({
      id: 3,
      icon: 'fa-shield-alt',
      color: 'text-green-600',
      title: 'Security Update',
      message: 'Your account is secure. 2FA available.',
      time: '2 hours ago',
      module: 'Security'
    });
    badgeCount++;
  }
  
  // System alerts (if enabled)
  if (prefs.system !== false) {
    notifications.push({
      id: 4,
      icon: 'fa-info-circle',
      color: 'text-yellow-600',
      title: 'System Update',
      message: 'BizOS v2.4.1 released with performance improvements',
      time: '5 hours ago',
      module: 'All'
    });
    badgeCount++;
  }
  
  // Update badge
  const badge = document.getElementById('notification-badge');
  if (badge) {
    if (badgeCount > 0) {
      badge.textContent = badgeCount > 9 ? '9+' : badgeCount;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }
  
  if (notifications.length === 0) {
    list.innerHTML = `
      <div class="p-4 text-center text-gray-400 text-sm">
        <i class="fas fa-check-circle text-2xl block mb-2 text-green-500"></i>
        All caught up!
      </div>
    `;
    return;
  }
  
  list.innerHTML = notifications.map(n => `
    <div class="flex items-start p-3 hover:bg-gray-50 rounded-lg transition cursor-pointer" onclick="handleNotificationClick('${n.module}')">
      <div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center mr-3 flex-shrink-0">
        <i class="fas ${n.icon} ${n.color}"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-medium text-gray-900 text-sm">${n.title}</p>
        <p class="text-sm text-gray-500 truncate">${n.message}</p>
        <p class="text-xs text-gray-400 mt-1">${n.time}</p>
      </div>
    </div>
  `).join('');
}

function markAllNotificationsRead() {
  const badge = document.getElementById('notification-badge');
  if (badge) {
    badge.classList.add('hidden');
    badge.textContent = '0';

  const list = document.getElementById('notification-list');

// ==================== MODAL SCROLL FIX (SAFE VERSION) ====================
// Instead of locking body scroll, let modals scroll naturally

function setupModalScrollLock() {
  // This is a safer approach - just ensure modals scroll internally
  document.querySelectorAll('.modal').forEach(modal => {
    const content = modal.querySelector('.modal-content');
    if (content) {
      content.style.maxHeight = '90vh';
      content.style.overflowY = 'auto';
    }
  });
}

// Call on DOM ready

  // Just set max-height on modals, don't lock body
  setupModalScrollLock();
});
