<style>
/* BizOS — single-page upgrade review + confirmation */
#upgrade-form [data-bizos-workspace-email],#upgrade-form [data-bizos-confirmation]{box-sizing:border-box}
#upgrade-form [data-bizos-confirmation]{margin-top:20px;padding:16px;border:1px solid #e9d5ff;background:#faf5ff;border-radius:12px}
#upgrade-form [data-bizos-confirmation] label{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
#upgrade-form [data-bizos-confirmation] input{margin-top:3px;width:16px;height:16px;flex:0 0 auto}
</style>
<script>
(function(){
'use strict';
var installed=false,originalCallGoogleScript=null,workspaceEmail='',pendingUpgradeChecked=false,pendingUpgradeActive=false,editingRequestId='';
function notify(message,type){if(typeof window.showNotification==='function')window.showNotification(message,type||'info');else alert(message)}
function getSessionId(){return localStorage.getItem('bizos_session')||'';}
function getCurrentEmail(){if(window.currentUser&&window.currentUser.email)return String(window.currentUser.email).trim();try{var user=JSON.parse(localStorage.getItem('bizos_user')||'{}');return String(user.email||'').trim()}catch(e){return ''}}
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function checkPendingUpgrade(){
 if(pendingUpgradeChecked||typeof window.callGoogleScript!=='function')return;
 pendingUpgradeChecked=true;
 window.callGoogleScript('getPendingUpgradeRequestStatus',[''],function(result){
  if(!result||!result.success||!result.hasPending)return;
  var modal=document.getElementById('upgrade-modal');if(!modal)return;
  var content=modal.querySelector('.modal-content');if(!content||content.querySelector('[data-bizos-pending-upgrade]'))return;
  pendingUpgradeActive=true;
  var business=escapeHtml(result.businessName||'your business');
  var tier=escapeHtml(result.tier||'sovereign');
  var requestId=encodeURIComponent(result.requestId||'');
  var country=encodeURIComponent(result.country||'');
  var box=document.createElement('div');box.setAttribute('data-bizos-pending-upgrade','1');box.className='mx-6 mt-4 p-4 bg-amber-50 border border-amber-200 rounded-lg';
  box.innerHTML='<div class="flex items-start gap-3"><div class="w-9 h-9 rounded-full bg-amber-100 flex items-center justify-center flex-shrink-0"><i class="fas fa-clock text-amber-600"></i></div><div class="flex-1"><p class="font-semibold text-amber-900">Upgrade in progress</p><p class="text-sm text-amber-800 mt-1">You already have a pending <strong>'+tier+'</strong> upgrade for <strong>'+business+'</strong>. You can continue the existing payment instead of submitting another request.</p><button type="button" data-bizos-continue-upgrade="1" class="mt-3 bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition text-sm font-semibold">Continue Your Request <i class="fas fa-arrow-right ml-1"></i></button></div></div>';
  var first=content.firstElementChild;content.insertBefore(box,first||null);
  var btn=box.querySelector('[data-bizos-continue-upgrade]');if(btn)btn.onclick=function(){
    if(result.redirectUrl){window.location.href=String(result.redirectUrl);return;}
    notify('Unable to resume your payment request. Please refresh and try again.','error');
  };
 },function(){pendingUpgradeChecked=false});
}
function injectReviewControls(){
 checkPendingUpgrade();
 var form=document.getElementById('upgrade-form');if(!form)return;
 var existingEmail=form.querySelector('[data-bizos-workspace-email]'),existingConfirmation=form.querySelector('[data-bizos-confirmation]');
 if(!workspaceEmail)workspaceEmail=getCurrentEmail();
 if(!existingEmail){var emailBox=document.createElement('div');emailBox.setAttribute('data-bizos-workspace-email','1');emailBox.className='mb-5 p-4 bg-purple-50 border border-purple-100 rounded-lg';emailBox.innerHTML='<label class="block text-sm font-semibold text-gray-800 mb-2">Workspace Email *</label><input id="bizos-workspace-email-form" type="email" required autocomplete="email" class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-purple-500 focus:border-purple-500" placeholder="you@company.com" value="'+escapeHtml(workspaceEmail)+'"><p class="text-xs text-gray-600 mt-2">Use a Gmail address or a business/domain email connected to a Google Account or Google Workspace. This is where your BizOS workspace access details will be sent.</p>';form.insertBefore(emailBox,form.firstElementChild)}else{var emailInput=document.getElementById('bizos-workspace-email-form');if(emailInput&&workspaceEmail)emailInput.value=workspaceEmail}
 if(!existingConfirmation){var confirmation=document.createElement('div');confirmation.setAttribute('data-bizos-confirmation','1');confirmation.innerHTML='<p class="text-sm font-semibold text-purple-900 mb-2"><i class="fas fa-clipboard-check mr-2"></i>Review & Confirm</p><p class="text-sm text-gray-700 mb-3">Please review the business information you entered above. Make any corrections before continuing.</p><label><input id="bizos-confirm-info" type="checkbox" required><span class="text-sm text-gray-800">I have reviewed my workspace email and business information and confirm that they are correct.</span></label>';form.appendChild(confirmation)}
 var submit=form.querySelector('button[type="submit"]');if(submit)submit.innerHTML='Review & Continue to Payment <i class="fas fa-arrow-right ml-2"></i>';
 var title=document.querySelector('#upgrade-modal h2');if(title)title.textContent='Review & Confirm Your Upgrade';
}
function prepareUpgradeEdit(requestId){
 editingRequestId=String(requestId||'').trim();
 if(!editingRequestId||typeof window.callGoogleScript!=='function')return;
 window.__BIZOS_EDIT_UPGRADE_REQUEST_ID=editingRequestId;
 window.callGoogleScript('getPendingUpgradeRequestStatus',[''],function(result){
   if(!result||!result.success||!result.hasPending||String(result.requestId||'')!==editingRequestId){
     notify('We could not load your pending upgrade details. Please return to Billing and try again.','error');return;
   }
   var form=document.getElementById('upgrade-form');
   var emailInput=document.getElementById('bizos-workspace-email-form');
   if(emailInput&&result.workspaceEmail)emailInput.value=result.workspaceEmail;
   workspaceEmail=String(result.workspaceEmail||workspaceEmail||'').trim();
   var countryInput=document.getElementById('upgrade-country');
   var countrySelector=document.getElementById('upgrade-country-select');
   if(countryInput)countryInput.value=String(result.country||'');
   if(countrySelector)countrySelector.value=String(result.country||'');
   var title=document.querySelector('#upgrade-modal h2');if(title)title.textContent='Correct Your Upgrade Details';
   var submit=document.querySelector('#upgrade-form button[type="submit"]');if(submit)submit.innerHTML='Save & Continue to Payment <i class="fas fa-arrow-right ml-2"></i>';
   var pendingBox=document.querySelector('[data-bizos-pending-upgrade]');if(pendingBox)pendingBox.remove();
   if(typeof window.loadCountryRequirementsForUpgrade==='function'){
     window.loadCountryRequirementsForUpgrade();
     var attempts=0;
     var timer=setInterval(function(){
       attempts++;
       if(window.currentCountryRequirements){
         var details=result.businessDetails||{};
         Object.keys(details).forEach(function(field){
           var input=document.getElementById('upgrade-'+field);
           if(input)input.value=details[field]==null?'':details[field];
         });
         clearInterval(timer);
       }
       if(attempts>40)clearInterval(timer);
     },100);
   }
   var note=document.querySelector('#upgrade-form [data-bizos-edit-note]');
   if(!note){
     note=document.createElement('p');note.setAttribute('data-bizos-edit-note','1');note.className='text-xs text-gray-500 mt-2';
     note.textContent='You are editing your existing upgrade request. Your request ID will remain the same.';
     var submitBtn=document.querySelector('#upgrade-form button[type="submit"]');if(submitBtn&&submitBtn.parentNode)submitBtn.parentNode.appendChild(note);
   }
 },function(){notify('We could not load your pending upgrade details. Please refresh and try again.','error')});
}
window.prepareUpgradeEdit=prepareUpgradeEdit;

function prepareAndSubmit(event){
 var form=event&&event.target&&event.target.closest?event.target.closest('#upgrade-form'):document.getElementById('upgrade-form');if(!form)return;
 event.preventDefault();event.stopImmediatePropagation();
 var emailInput=document.getElementById('bizos-workspace-email-form');workspaceEmail=emailInput?String(emailInput.value||'').trim():'';
 if(!/^\S+@\S+\.\S+$/.test(workspaceEmail)){notify('Please enter a valid workspace email.','warning');if(emailInput)emailInput.focus();return}
 var checkbox=document.getElementById('bizos-confirm-info');if(!checkbox||!checkbox.checked){notify('Please review your information and confirm it before continuing to payment.','warning');if(checkbox)checkbox.focus();return}
 if(typeof window.handleUpgradeRequest!=='function'){notify('Upgrade form is not ready. Please refresh and try again.','error');return}
 console.log('[BizOS Upgrade] submit intercepted; starting authoritative upgrade request');
 try{
   var result=window.handleUpgradeRequest(event);
   if(result&&typeof result.catch==='function')result.catch(function(error){
     console.error('[BizOS Upgrade] unexpected submission error:',error);
     notify('Upgrade request failed. Please try again.','error');
   });
 }catch(error){
   console.error('[BizOS Upgrade] submission start failed:',error);
   notify('Upgrade request failed. Please try again.','error');
 }
}
function routeUpgradePaymentResult(result){
 if(!result||!result.redirectUrl)return result;
 var redirect=String(result.redirectUrl);
 var paymentMarker='/payment?';
 var markerIndex=redirect.indexOf(paymentMarker);
 if(markerIndex!==-1){
  var base=redirect.substring(0,markerIndex);
  var query=redirect.substring(markerIndex+paymentMarker.length);
  result.redirectUrl=base+'/payment-method?'+query;
 }
 return result;
}
function install(){
 if(installed)return;
 if(typeof window.handleUpgradeRequest!=='function'||typeof window.callGoogleScript!=='function')return;
 originalCallGoogleScript=window.callGoogleScript;
 window.callGoogleScript=function(functionName,params,successHandler,errorHandler){
  var args=Array.prototype.slice.call(arguments);
  if(functionName==='handleUpgradeRequest'&&params&&params[0]&&typeof params[0]==='object')args[1]=[Object.assign({},params[0],{workspaceEmail:workspaceEmail,editRequestId:editingRequestId||''})];
  if(functionName==='handleUpgradeRequest'&&typeof args[2]==='function'){var originalSuccess=args[2];args[2]=function(result){return originalSuccess(routeUpgradePaymentResult(result))}}
  return originalCallGoogleScript.apply(this,args);
 };
 document.addEventListener('submit',prepareAndSubmit,true);
 var attempts=0,timer=setInterval(function(){attempts++;var modal=document.getElementById('upgrade-modal'),form=document.getElementById('upgrade-form');if(modal&&form&&!modal.classList.contains('hidden'))injectReviewControls();if(attempts>120)clearInterval(timer)},250);
 document.addEventListener('click',function(){setTimeout(injectReviewControls,0)},true);installed=true;
}
function boot(){install();injectReviewControls()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,50)},{once:true});else setTimeout(boot,50);setInterval(boot,1000);
})();
</script>
