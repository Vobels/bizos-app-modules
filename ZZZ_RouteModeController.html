<script>
// ============================================================
// ZZZ_RouteModeController.html - PUBLIC ROUTE BRIDGE
// ============================================================
(function () {
  const PUBLIC_ORIGIN = 'https://bizos.higroups.com';
  const ROUTES = { landing:'/', dashboard:'/dashboard', profile:'/profile', staff:'/staff', admin:'/admin', 'admin-settings':'/admin/settings' };
  function normalizeRoute(value) {
    const raw = String(value || '').trim().toLowerCase();
    if (!raw) return '/';
    if (raw === '/') return '/';
    if (raw.charAt(0) !== '/') return ROUTES[raw] || '/';
    const clean = raw.replace(/\/+$/, '') || '/';
    return Object.values(ROUTES).indexOf(clean) !== -1 ? clean : '/';
  }
  function notifyPublicShell(path) {
    const route = normalizeRoute(path);
    try { if (window.parent && window.parent !== window) window.parent.postMessage({type:'bizos-route',path:route}, PUBLIC_ORIGIN); } catch (error) { console.warn('BizOS route bridge could not notify parent:', error); }
  }
  window.bizOSPublicRoute = function(path) { const route=normalizeRoute(path); notifyPublicShell(route); return route; };
  window.addEventListener('message', function(event) {
    if (event.origin !== PUBLIC_ORIGIN) return;
    if (!event.data || event.data.type !== 'bizos-route-request') return;
    const route=normalizeRoute(event.data.path); window.__BIZOS_PUBLIC_ROUTE=route;
    if (typeof window.handlePublicRouteRequest === 'function') window.handlePublicRouteRequest(route);
  });
  window.addEventListener('load', function() {
    const initialRoute=normalizeRoute(window.__BIZOS_INITIAL_ROUTE || '/');
    window.__BIZOS_PUBLIC_ROUTE=initialRoute; notifyPublicShell(initialRoute);
  });
})();
</script>
