<script>
(function () {
  const mode = String(window.__BIZOS_ROUTE_MODE || 'landing').toLowerCase();
  const target = String(window.__BIZOS_ROUTE_TARGET || mode || 'landing').toLowerCase();
  const PUBLIC_ORIGIN = 'https://bizos.higroups.com';
  let initialLoad = true;
  let originalLoadSession = null;

  function showOnly(id) {
    const pageIds = ['landing-page', 'dashboard-page', 'profile-page', 'cms-page'];
    pageIds.forEach(function (pageId) {
      const el = document.getElementById(pageId);
      if (!el) return;
      if (pageId === id) el.classList.remove('hidden');
      else el.classList.add('hidden');
    });
  }

  function dashboardVisible() {
    const el = document.getElementById('dashboard-page');
    return !!el && !el.classList.contains('hidden');
  }

  function notifyParent(path) {
    try {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'bizos-route', path: path }, PUBLIC_ORIGIN);
      }
    } catch (e) {}
  }

  function applyInitialMode() {
    if (target === 'profile') {
      showOnly('dashboard-page');
      return;
    }

    if (target === 'staff') {
      showOnly('dashboard-page');
      return;
    }

    if (mode === 'dashboard' || target === 'dashboard') {
      showOnly('dashboard-page');
    } else {
      // / must always start on the landing page, even when a session exists.
      showOnly('landing-page');
    }
  }

  if (mode !== 'dashboard' && typeof window.loadSession === 'function') {
    originalLoadSession = window.loadSession;
    window.loadSession = function () {
      if (initialLoad) return false;
      return originalLoadSession.apply(this, arguments);
    };
  }

  applyInitialMode();

  window.addEventListener('load', function () {
    initialLoad = false;

    if (originalLoadSession) {
      window.loadSession = originalLoadSession;
      originalLoadSession = null;
    }

    if (target === 'profile') {
      if (typeof window.showProfilePage === 'function') {
        window.showProfilePage();
      }
      notifyParent('/profile');
      return;
    }

    if (target === 'staff') {
      // BizOS currently manages staff through the HR module. Keep the public
      // route stable while reusing the existing module implementation.
      if (typeof window.openModule === 'function') {
        window.openModule('HR');
      }
      notifyParent('/staff');
      return;
    }

    if (target === 'admin' || target === 'admin-settings') {
      // Admin is a dedicated Apps Script page and is handled by doGet.
      notifyParent(target === 'admin-settings' ? '/admin/settings' : '/admin');
      return;
    }

    if (mode === 'dashboard' || target === 'dashboard') {
      showOnly('dashboard-page');
      notifyParent('/dashboard');
    } else {
      showOnly('landing-page');
      notifyParent('/');
    }
  });

  window.addEventListener('pageshow', function () {
    if (!initialLoad && (mode === 'dashboard' || target === 'dashboard')) {
      showOnly('dashboard-page');
    }
  });
})();
</script>
