<script>
(function () {
  // The master entry point sets this from the requested public route.
  const mode = String(window.__BIZOS_ROUTE_MODE || 'landing').toLowerCase();

  function showOnly(id) {
    const pageIds = ['landing-page', 'dashboard-page', 'profile-page', 'cms-page'];
    pageIds.forEach(function (pageId) {
      const el = document.getElementById(pageId);
      if (!el) return;
      if (pageId === id) el.classList.remove('hidden');
      else el.classList.add('hidden');
    });
  }

  function applyRouteMode() {
    if (mode === 'dashboard') {
      showOnly('dashboard-page');
    } else {
      // Root is always the public landing page, even when a session exists.
      showOnly('landing-page');
    }
  }

  // Apply immediately so the existing session loader cannot turn / into dashboard.
  applyRouteMode();

  window.addEventListener('load', function () {
    applyRouteMode();
    setTimeout(applyRouteMode, 0);
  });

  window.addEventListener('pageshow', function () {
    applyRouteMode();
  });
})();
</script>
