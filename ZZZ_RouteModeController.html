<script>
// PUBLIC ROUTE CONTROLLER
// GAS owns the internal view; the outer public shell owns the browser URL.
(function () {
  const ROUTES = {
    landing: '/',
    dashboard: '/dashboard',
    profile: '/profile',
    staff: '/staff',
    apps: '/apps',
    app: '/apps',
    settings: '/settings',
    admin: '/admin',
    'admin-settings': '/admin/settings'
  };

  function normalizeRoute(value) {
    const raw = String(value || '').trim().toLowerCase();
    if (!raw || raw === '/') return '/';
    if (ROUTES[raw]) return ROUTES[raw];
    const clean = '/' + raw.replace(/^\/+|\/+$/g, '');
    return Object.values(ROUTES).indexOf(clean) !== -1 ? clean : '/';
  }

  function notifyPublicShell(path) {
    const route = normalizeRoute(path);
    try {
      if (window.top !== window) {
        window.top.postMessage({ type: 'bizos-route', path: route }, '*');
      }
    } catch (error) {
      console.warn('BizOS route bridge notify failed:', error);
    }
  }

  function routeFunctionReady(route) {
    if (route === '/') return true;
    if (route === '/dashboard') return typeof window.showDashboardHome === 'function';
    if (route === '/profile' || route === '/staff') return typeof window.showProfilePage === 'function';
    if (route === '/apps') return typeof window.showAppsPage === 'function';
    if (route === '/settings') return typeof window.showSettingsPage === 'function';
    return true;
  }

  function applyRoute(route) {
    route = normalizeRoute(route);
    window.__BIZOS_PUBLIC_ROUTE = route;

    if (route === '/') {
      if (typeof window.showLandingPage === 'function') window.showLandingPage();
      return;
    }

    if (route === '/dashboard') {
      if (typeof window.showDashboardHome === 'function') window.showDashboardHome();
      return;
    }

    if (route === '/profile') {
      if (typeof window.showProfilePage === 'function') window.showProfilePage();
      return;
    }

    if (route === '/staff') {
      if (typeof window.showProfilePage === 'function') {
        window.showProfilePage();
        setTimeout(function () {
          if (typeof window.showProfileTab === 'function') window.showProfileTab('team');
        }, 250);
      }
      return;
    }

    if (route === '/apps') {
      if (typeof window.showAppsPage === 'function') window.showAppsPage();
      return;
    }

    if (route === '/settings') {
      if (typeof window.showSettingsPage === 'function') window.showSettingsPage();
      return;
    }
  }

  function waitForNavigationFunctions(route, attempts) {
    attempts = attempts || 0;

    if (routeFunctionReady(route)) {
      applyRoute(route);
      notifyPublicShell(route);
      return;
    }

    if (attempts < 100) {
      setTimeout(function () {
        waitForNavigationFunctions(route, attempts + 1);
      }, 100);
    } else {
      console.warn('BizOS route controller: navigation function not ready for', route);
    }
  }

  window.bizOSPublicRoute = function (path) {
    const route = normalizeRoute(path);
    applyRoute(route);
    notifyPublicShell(route);
    return route;
  };

  window.handlePublicRouteRequest = function (path) {
    waitForNavigationFunctions(normalizeRoute(path), 0);
  };

  window.addEventListener('message', function (event) {
    if (!event.data || event.data.type !== 'bizos-route-request') return;
    window.handlePublicRouteRequest(event.data.path);
  });

  function initializeInitialRoute() {
    const initialRoute = normalizeRoute(window.__BIZOS_INITIAL_ROUTE || '/');
    console.log('BizOS route controller: initial route =', initialRoute);
    waitForNavigationFunctions(initialRoute, 0);
  }

  // Run as soon as the page is ready, rather than waiting only for window.load.
  // This avoids racing the application's normal session bootstrap.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeInitialRoute, { once: true });
  } else {
    initializeInitialRoute();
  }
})();
</script>
