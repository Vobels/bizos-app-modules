<style>
:root{--brand:#2E7D32;--ink:#17221a;--muted:#6d766f;--line:#e4e9e5;--soft:#f5f8f5;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f7f9f7}button,input{font:inherit}.hidden{display:none!important}
.topbar{height:72px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand,.auth-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;font-size:16px}.text-button,.back-button{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer}
.hero{min-height:540px;padding:72px 8%;display:grid;grid-template-columns:1.1fr .9fr;gap:70px;align-items:center;background:linear-gradient(135deg,#fff 0%,#f3f8f3 100%)}.eyebrow{margin:0 0 12px;color:var(--brand);font-size:11px;font-weight:800;letter-spacing:.14em}.hero h1{font-size:56px;line-height:1.02;margin:0 0 22px;letter-spacing:-.04em}.hero h1 span{color:var(--brand)}.hero-text{max-width:570px;color:var(--muted);font-size:18px;line-height:1.7}.primary-button{border:0;border-radius:10px;padding:13px 20px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(46,125,50,.16)}.primary-button:hover{filter:brightness(.94)}.primary-button.full{width:100%;margin-top:8px}
.hero-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 22px 60px rgba(35,55,40,.08)}.mini-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.status-dot{color:var(--brand)}.preview-total{font-size:23px;font-weight:750;margin:34px 0 24px}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview-grid div{background:var(--soft);border-radius:12px;padding:16px}.preview-grid small{display:block;color:var(--muted);margin-bottom:7px}.preview-grid strong{font-size:20px}.preview-line{height:10px;background:#eef2ee;border-radius:99px;margin-top:24px}.preview-line.short{width:68%;margin-top:10px}.feature-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}.feature-strip>div{padding:28px 8%;background:#fff}.feature-strip b,.feature-strip span{display:block}.feature-strip span{color:var(--muted);font-size:13px;margin-top:7px}
.auth-wrap{min-height:100vh;padding:28px;display:grid;place-items:center;background:linear-gradient(135deg,#f7faf7,#eef5ef)}.auth-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 18px 50px rgba(30,55,35,.08)}.auth-brand{margin-bottom:34px}.auth-card h2{margin:0;font-size:28px}.muted{color:var(--muted);margin:8px 0 28px}.auth-card label{display:block;font-size:13px;font-weight:700;margin:18px 0}.auth-card input{display:block;width:100%;margin-top:8px;padding:13px 14px;border:1px solid #d7ded8;border-radius:9px;outline:none}.auth-card input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(46,125,50,.08)}.error{margin:12px 0;padding:11px 12px;border-radius:8px;background:#fff1f1;color:#a52b2b;font-size:13px}
.app-shell{min-height:100vh;display:flex}.sidebar{width:250px;position:fixed;inset:0 auto 0 0;background:#fff;border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column}.side-brand{padding:0 8px 28px}.business-card{padding:15px;background:var(--soft);border-radius:12px;margin-bottom:20px}.business-card small,.business-card span{display:block;color:var(--muted);font-size:11px}.business-card strong{display:block;margin:4px 0}.sidebar nav{display:grid;gap:5px}.nav-item{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#536056;cursor:pointer;font-weight:600}.nav-item:hover,.nav-item.active{background:#edf6ee;color:var(--brand)}.signout{margin-top:auto;border:0;background:none;text-align:left;padding:12px;color:#a33;cursor:pointer}.workspace{margin-left:250px;width:calc(100% - 250px);padding:34px 5%}.workspace-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}.workspace-head h1{margin:0;font-size:30px;letter-spacing:-.02em}.refresh{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer}.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.kpi,.panel,.empty-card{background:#fff;border:1px solid var(--line);border-radius:14px}.kpi{padding:20px}.kpi span{display:block;color:var(--muted);font-size:12px;margin-bottom:12px}.kpi strong{font-size:25px}.content-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel{padding:20px}.panel-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:4px}.panel-head h3{margin:0;font-size:15px}.tx{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f0f2f0;font-size:13px}.workspace-summary{display:grid;gap:10px;padding-top:14px}.workspace-summary span{color:var(--muted);font-size:13px}.empty,.loading{padding:30px;color:var(--muted);text-align:center}.empty-card{padding:44px;text-align:center;max-width:680px}.empty-card h3{margin:0 0 8px}.empty-card p{color:var(--muted);line-height:1.6}.coming{display:inline-block;margin-top:14px;padding:6px 9px;border-radius:99px;background:var(--soft);color:var(--brand);font-size:11px;font-weight:700}
@media(max-width:850px){.hero{grid-template-columns:1fr;gap:35px;padding:55px 7%}.hero h1{font-size:43px}.feature-strip{grid-template-columns:1fr}.sidebar{width:210px}.workspace{margin-left:210px;width:calc(100% - 210px);padding:25px}.kpi-grid{grid-template-columns:1fr 1fr}.content-grid{grid-template-columns:1fr}}
@media(max-width:600px){.topbar{padding:0 20px}.hero{min-height:auto;padding:48px 22px}.hero-card{padding:20px}.hero h1{font-size:39px}.feature-strip>div{padding:22px}.sidebar{width:100%;position:static;min-height:auto}.app-shell{display:block}.workspace{margin:0;width:100%;padding:22px 16px}.sidebar nav{grid-template-columns:1fr 1fr}.signout{margin-top:14px}.kpi-grid{grid-template-columns:1fr 1fr}.kpi{padding:16px}.kpi strong{font-size:20px}.workspace-head h1{font-size:24px}}
</style>
