<div id="client-records-v12-root" class="client-records-v12">
  <div class="client-records-head">
    <div><span class="section-kicker">RECORD DIRECTORY</span><h2>All Records</h2><p>Browse every record type available in your workspace.</p></div>
    <button type="button" class="client-records-refresh" onclick="clientRecordsV12Load()">Refresh</button>
  </div>
  <div id="client-records-message"></div>
  <div id="client-records-grid" class="client-records-grid">
    <div class="client-records-empty">Loading record directory…</div>
  </div>
</div>
<script>
(function(){
  var icons={Finance:'fa-calculator',Sales:'fa-chart-line',Ecommerce:'fa-cart-shopping',CRM:'fa-users',HR:'fa-briefcase',Logistics:'fa-truck',Tax:'fa-file-invoice',Agro:'fa-seedling',Productivity:'fa-clock',POS:'fa-cash-register',Attendance:'fa-fingerprint',Warehouse:'fa-warehouse','Business Center':'fa-store'};
  var classes={Finance:'finance',Sales:'sales',Ecommerce:'ecommerce',CRM:'crm',HR:'hr',Logistics:'logistics',Tax:'tax',Agro:'agro',Productivity:'productivity',POS:'pos',Attendance:'attendance',Warehouse:'warehouse'};
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function openRecord(x){
    if(x.source==='module'){if(window.selectView)window.selectView('module:'+String(x.module||x.key||''));return;}
    if(window.selectView)window.selectView('business');
  }
  window.clientRecordsV12Load=function(){
    var box=document.getElementById('client-records-grid');if(!box)return;
    box.innerHTML='<div class="client-records-empty">Loading record directory…</div>';
    google.script.run.withSuccessHandler(function(r){
      if(!r||r.success===false){box.innerHTML='<div class="client-records-empty error">Unable to load record directory.</div>';return;}
      var rows=Array.isArray(r.records)?r.records:[];
      if(!rows.length){box.innerHTML='<div class="client-records-empty"><strong>No record types available yet.</strong><p>Your assigned apps will appear here.</p></div>';return;}
      box.innerHTML=rows.map(function(x){
        var n=String(x.name||x.key||'Record'),m=String(x.module||''),icon=icons[m]||icons[n]||'fa-database',cl=classes[m]||'';
        return '<button type="button" class="client-record-card" onclick="clientRecordsV12Open('+JSON.stringify(String(x.key||''))+')"><span class="client-record-icon '+cl+'"><i class="fas '+icon+'"></i></span><span class="client-record-copy"><b>'+esc(n)+'</b><small>'+esc(m||'Records')+'</small></span><strong>'+esc(String(Number(x.count)||0))+'</strong><i class="fas fa-arrow-right"></i></button>';
      }).join('');
    }).withFailureHandler(function(e){box.innerHTML='<div class="client-records-empty error">'+esc(e&&e.message||'Unable to load record directory.')+'</div>';}).getRecordsDirectory(window.clientSessionId);
  };
  window.clientRecordsV12Open=function(key){
    var rows=String(key||'').split(':');
    if(rows[0]==='BC'){if(window.selectView)window.selectView('business');return;}
    if(window.selectView)window.selectView('module:'+String(key||''));
  };
})();
</script>
