<!-- Dedicated Staff Management Page -->
<div id="staff-page" class="hidden min-h-screen bg-gray-50">
  <div class="flex"><div class="flex-1 ml-0 md:ml-64">
    <div class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-10"><div class="flex items-center justify-between"><div><h1 class="text-xl font-semibold text-gray-900">Staff</h1><p class="text-sm text-gray-500 mt-1">Manage your business team members and access.</p></div><button onclick="showDashboardHome()" class="text-gray-500 hover:text-gray-700" title="Back to Dashboard"><i class="fas fa-times text-xl"></i></button></div></div>
    <div class="p-6"><div class="max-w-6xl mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6"><div><h2 class="text-lg font-semibold text-gray-900">Team Members</h2><p class="text-sm text-gray-500">Invite staff and manage who belongs to this workspace.</p></div><button onclick="openStaffInviteForm()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition"><i class="fas fa-user-plus mr-2"></i>Invite Staff</button></div>
      <div id="staff-invite-panel" class="hidden bg-white border border-gray-200 rounded-lg shadow-sm p-6 mb-6"><div class="flex items-center justify-between mb-4"><h3 class="font-semibold text-gray-900">Invite a Staff Member</h3><button type="button" onclick="closeStaffInviteForm()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button></div><form onsubmit="submitStaffInvite(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label><input id="staff-invite-name" type="text" required class="w-full border rounded-lg p-2" placeholder="Staff member name"></div><div><label class="block text-sm font-medium text-gray-700 mb-2">Email</label><input id="staff-invite-email" type="email" required class="w-full border rounded-lg p-2" placeholder="staff@example.com"></div><div><label class="block text-sm font-medium text-gray-700 mb-2">Role</label><select id="staff-invite-role" class="w-full border rounded-lg p-2"><option value="staff">Staff</option><option value="admin">Administrator</option></select></div><div class="flex items-end"><button id="staff-invite-submit" type="submit" class="bg-purple-600 text-white px-5 py-2 rounded-lg hover:bg-purple-700 transition">Send Invitation</button></div></form></div>
      <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden"><div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between"><h3 class="font-semibold text-gray-900">Current Team</h3><button onclick="loadStaffPage()" class="text-sm text-purple-600 hover:text-purple-800"><i class="fas fa-sync-alt mr-1"></i>Refresh</button></div><div id="staff-page-list" class="divide-y divide-gray-100"><div class="p-8 text-center text-gray-400">Loading staff members...</div></div></div>
    </div></div>
  </div></div>
</div>
<script>
(function(){
  function hidePage(id){const el=document.getElementById(id);if(el){el.classList.add('hidden');el.style.display='none';}}
  function showPage(id){const el=document.getElementById(id);if(el){el.classList.remove('hidden');el.style.display='block';}}
  function addStaffNavigationButton(){document.querySelectorAll('.sidebar nav').forEach(function(nav){if(nav.querySelector('[data-bizos-staff-nav]'))return;const button=document.createElement('button');button.type='button';button.setAttribute('data-bizos-staff-nav','true');button.className='w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center space-x-3';button.innerHTML='<i class="fas fa-user-tie text-gray-500"></i><span>Staff</span>';button.addEventListener('click',window.showStaffPage);const settingsButton=Array.from(nav.querySelectorAll('button')).find(function(btn){return(btn.getAttribute('onclick')||'').includes('showSettingsPage');});if(settingsButton)settingsButton.insertAdjacentElement('afterend',button);else nav.appendChild(button);});}
  window.showStaffPage=function(){hidePage('landing-page');hidePage('dashboard-home');hidePage('module-view');hidePage('profile-page');hidePage('apps-page');hidePage('settings-page');showPage('dashboard-page');showPage('staff-page');const title=document.getElementById('page-title');if(title)title.textContent='Staff';document.querySelectorAll('.sidebar nav button').forEach(function(btn){btn.classList.remove('bg-purple-50','text-purple-700');});document.querySelectorAll('[data-bizos-staff-nav]').forEach(function(btn){btn.classList.add('bg-purple-50','text-purple-700');});loadStaffPage();};
  window.openStaffInviteForm=function(){const panel=document.getElementById('staff-invite-panel');if(panel)panel.classList.remove('hidden');};
  window.closeStaffInviteForm=function(){const panel=document.getElementById('staff-invite-panel');if(panel)panel.classList.add('hidden');};
  window.submitStaffInvite=function(event){event.preventDefault();if(typeof currentUser==='undefined'||!currentUser||!['owner','admin'].includes(currentUser.role)){showNotification('Only business owners and administrators can invite staff.','warning');return;}const name=document.getElementById('staff-invite-name').value.trim();const email=document.getElementById('staff-invite-email').value.trim().toLowerCase();const role=document.getElementById('staff-invite-role').value;const submit=document.getElementById('staff-invite-submit');submit.disabled=true;submit.textContent='Sending...';callGoogleScript('inviteStaffMember',[currentUser.businessId,email,name,role,currentUser.email,['Finance']],function(response){submit.disabled=false;submit.textContent='Send Invitation';if(response&&response.success){showNotification(response.message||'Invitation sent.','success');document.getElementById('staff-invite-name').value='';document.getElementById('staff-invite-email').value='';closeStaffInviteForm();loadStaffPage();}else showNotification((response&&response.message)||'Unable to send invitation.','error');},function(error){submit.disabled=false;submit.textContent='Send Invitation';console.error('Staff invitation error:',error);showNotification('Unable to send invitation.','error');});};
  window.loadStaffPage=function(){const container=document.getElementById('staff-page-list');if(!container||typeof currentUser==='undefined'||!currentUser)return;container.innerHTML='<div class="p-8 text-center text-gray-400">Loading staff members...</div>';callGoogleScript('getBusinessStaff',[currentUser.businessId],function(members){if(!Array.isArray(members)||members.length===0){container.innerHTML='<div class="p-10 text-center text-gray-400"><i class="fas fa-users text-3xl mb-3"></i><p>No team members yet.</p></div>';return;}container.innerHTML=members.map(function(member){const status=String(member.isVerified||'').toUpperCase()==='YES'?'Verified':'Pending';const statusClass=status==='Verified'?'bg-green-50 text-green-700':'bg-yellow-50 text-yellow-700';const safeName=escapeHtml(member.name||'Unnamed');const safeEmail=escapeHtml(member.email||'');const safeRole=escapeHtml(member.role||'staff');const removable=member.role!=='owner';return '<div class="px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center font-semibold">'+escapeHtml((member.name||member.email||'U').charAt(0).toUpperCase())+'</div><div><p class="font-medium text-gray-900">'+safeName+'</p><p class="text-sm text-gray-500">'+safeEmail+'</p></div></div><div class="flex items-center gap-3"><span class="text-sm text-gray-600 capitalize">'+safeRole+'</span><span class="px-2 py-1 rounded-full text-xs '+statusClass+'">'+status+'</span>'+(removable?'<button onclick="removeStaffMember(\''+safeEmail.replace(/'/g,"\\'")+'\')" class="text-sm text-red-600 hover:text-red-800">Remove</button>':'')+'</div></div>';}).join('');},function(error){console.error('Staff list error:',error);container.innerHTML='<div class="p-8 text-center text-red-500">Unable to load staff members.</div>';});};
  window.removeStaffMember=function(email){if(typeof currentUser==='undefined'||!currentUser||!confirm('Remove '+email+' from this business?'))return;callGoogleScript('removeTeamMember',[currentUser.businessId,email],function(response){if(response&&response.success){showNotification('Staff member removed.','success');loadStaffPage();}else showNotification((response&&response.message)||'Unable to remove staff member.','error');},function(error){console.error('Remove staff error:',error);showNotification('Unable to remove staff member.','error');});};
  document.addEventListener('click',function(event){const button=event.target.closest('button');if(!button)return;const action=button.getAttribute('onclick')||'';if(/showDashboardHome|showProfilePage|showAppsPage|showSettingsPage|openModule\(/.test(action))hidePage('staff-page');});
  document.addEventListener('DOMContentLoaded',addStaffNavigationButton);setTimeout(addStaffNavigationButton,500);
})();
</script>
