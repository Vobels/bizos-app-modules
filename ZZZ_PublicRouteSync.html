<script>
// Public route synchronisation for the outer BizOS shell.
(function () {
  const PUBLIC_ORIGIN = 'https://bizos.higroups.com';
  const ROUTES = {
    landing: '/', dashboard: '/dashboard', profile: '/profile',
    staff: '/staff', admin: '/admin', adminSettings: '/admin/settings'
  };

  function notifyParent(path) {
    try {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'bizos-route', path: path }, PUBLIC_ORIGIN);
      }
    } catch (e) {}
  }

  function visible(id) {
    const el = document.getElementById(id);
    return !!el && !el.classList.contains('hidden') && el.style.display !== 'none';
  }

  function publishCurrentView() {
    if (visible('profile-page')) return notifyParent(ROUTES.profile);
    if (visible('dashboard-page')) return notifyParent(ROUTES.dashboard);
    if (visible('landing-page')) return notifyParent(ROUTES.landing);
  }

  function wrapNavigation() {
    const mappings = {
      showDashboardHome: ROUTES.dashboard,
      showProfilePage: ROUTES.profile,
      showSettingsPage: ROUTES.dashboard
    };
    Object.keys(mappings).forEach(function (name) {
      const original = window[name];
      if (typeof original !== 'function' || original.__bizosRouteWrapped) return;
      const wrapped = function () {
        const result = original.apply(this, arguments);
        setTimeout(function () { notifyParent(mappings[name]); }, 0);
        return result;
      };
      wrapped.__bizosRouteWrapped = true;
      window[name] = wrapped;
    });

    const originalOpenModule = window.openModule;
    if (typeof originalOpenModule === 'function' && !originalOpenModule.__bizosRouteWrapped) {
      const wrappedOpenModule = function () {
        const result = originalOpenModule.apply(this, arguments);
        setTimeout(function () { notifyParent(ROUTES.dashboard); }, 0);
        return result;
      };
      wrappedOpenModule.__bizosRouteWrapped = true;
      window.openModule = wrappedOpenModule;
    }
  }

  function start() {
    wrapNavigation();
    setTimeout(publishCurrentView, 0);
    const app = document.getElementById('app');
    if (app && window.MutationObserver) {
      new MutationObserver(function () {
        setTimeout(function () { wrapNavigation(); publishCurrentView(); }, 0);
      }).observe(app, { subtree: true, attributes: true, attributeFilter: ['class', 'style'] });
    }
    window.addEventListener('pageshow', function () {
      setTimeout(function () { wrapNavigation(); publishCurrentView(); }, 0);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>
