<script>
(function () {
  'use strict';

  var SESSION_IDLE_LIMIT_MS = 20 * 60 * 1000;
  var ACTIVITY_WRITE_INTERVAL_MS = 60 * 1000;
  var lastActivityWrite = 0;

  function hideAuthenticatedPages() {
    ['dashboard-page', 'profile-page', 'settings-page', 'staff-page'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
    var landing = document.getElementById('landing-page');
    if (landing) landing.classList.remove('hidden');
  }

  function closeLoginOrAppModals() {
    document.querySelectorAll('[id$="-modal"]').forEach(function (el) {
      if (el.id !== 'login-modal') {
        el.classList.add('hidden');
        el.style.display = 'none';
      }
    });
  }

  function forceLanding() {
    hideAuthenticatedPages();
    closeLoginOrAppModals();
    try {
      if (typeof window.__bizosCloseUpgradeReview === 'function') window.__bizosCloseUpgradeReview();
    } catch (e) {}
    try {
      window.__BIZOS_PUBLIC_ROUTE = '/';
      if (typeof window.publishBizOSRoute === 'function') window.publishBizOSRoute('/', true);
      else if (window.top !== window) window.top.postMessage({type: 'bizos-route', path: '/', replace: true}, '*');
    } catch (e) {}

  }

  window.__bizosForceLanding = function () { clearAndLand(); };

  function clearAndLand() {
    try {
      if (typeof window.clearSession === 'function') window.clearSession();
      else {
        localStorage.removeItem('bizos_session');
        localStorage.removeItem('bizos_user');
      }
      localStorage.removeItem('bizos_last_activity');
    } catch (e) {
      try {
        localStorage.removeItem('bizos_session');
        localStorage.removeItem('bizos_user');
        localStorage.removeItem('bizos_last_activity');
      } catch (ignore) {}
    }
    forceLanding();
  }

  function touchActivity(force) {
    var sessionId = null;
    try { sessionId = localStorage.getItem('bizos_session'); } catch (e) {}
    if (!sessionId) return;

    var now = Date.now();
    if (!force && now - lastActivityWrite < ACTIVITY_WRITE_INTERVAL_MS) return;
    lastActivityWrite = now;
    try { localStorage.setItem('bizos_last_activity', String(now)); } catch (e) {}
  }

  function isIdleExpired() {
    var sessionId = null;
    try { sessionId = localStorage.getItem('bizos_session'); } catch (e) {}
    if (!sessionId) return true;

    var raw = null;
    try { raw = localStorage.getItem('bizos_last_activity'); } catch (e) {}
    var last = Number(raw);

    // A session created by the existing login code may not have the new
    // activity marker yet. Initialize it instead of logging the user out.
    if (!last || !isFinite(last)) {
      touchActivity(true);
      return false;
    }

    return Date.now() - last >= SESSION_IDLE_LIMIT_MS;
  }

  function installActivityTracking() {
    if (window.__BIZOS_ACTIVITY_TRACKING_INSTALLED) return;
    window.__BIZOS_ACTIVITY_TRACKING_INSTALLED = true;

    ['click', 'keydown', 'mousemove', 'mousedown', 'touchstart', 'scroll'].forEach(function (eventName) {
      window.addEventListener(eventName, function () {
        if (localStorage.getItem('bizos_session')) touchActivity(false);
      }, {passive: true});
    });

    window.addEventListener('storage', function (event) {
      if (event.key === 'bizos_last_activity' && event.newValue) {
        lastActivityWrite = Number(event.newValue) || Date.now();
      }
      if (event.key === 'bizos_session' && !event.newValue) {
        forceLanding();
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        if (isIdleExpired()) clearAndLand();
        else touchActivity(true);
      }
    });
  }

  function installLogoutGuard() {
    if (typeof window.handleLogout !== 'function' || window.handleLogout.__bizosLogoutGuard) return;
    var originalLogout = window.handleLogout;
    var guardedLogout = function () {
      // Capture the session before clearing it so the server can invalidate it too.
      var sessionId = null;
      try { sessionId = currentSessionId || localStorage.getItem('bizos_session'); } catch (e) {}

      clearAndLand();

      if (sessionId && typeof window.callGoogleScript === 'function') {
        try { window.callGoogleScript('logout', [sessionId], function () {}, function () {}); } catch (e) {}
      }

      // The original handler is deliberately not called: it waits for a server
      // callback before changing the UI, which can leave the dashboard visible.
      try { if (typeof window.showNotification === 'function') window.showNotification('Logged out successfully', 'success'); } catch (e) {}
    };
    guardedLogout.__bizosLogoutGuard = true;
    guardedLogout.__bizosOriginal = originalLogout;
    window.handleLogout = guardedLogout;
  }

  function enforceNoSession() {
    var sessionId = null;
    try { sessionId = localStorage.getItem('bizos_session'); } catch (e) {}
    var userJson = null;
    try { userJson = localStorage.getItem('bizos_user'); } catch (e) {}

    if (!sessionId || !userJson) {
      var route = String(window.__BIZOS_PUBLIC_ROUTE || '/').toLowerCase();
      if (route !== '/' && route !== '/login') forceLanding();
      var dashboard = document.getElementById('dashboard-page');
      if (dashboard && !dashboard.classList.contains('hidden')) forceLanding();
      return;
    }

    if (isIdleExpired()) {
      clearAndLand();
      return;
    }

    touchActivity(false);
  }

  function boot() {
    installActivityTracking();
    installLogoutGuard();
    enforceNoSession();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, {once: true});
  else boot();
  setInterval(boot, 15000);
})();
</script>
