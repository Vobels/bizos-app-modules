<style>
/* ============================================================
   BIZOS AUTH MODAL — VIEWPORT-INDEPENDENT TOUCH / CLOSE FIX
   Works in normal mobile mode, Chrome Desktop Site mode, tablet,
   and desktop. Loaded after landing, scripts and forms.
   ============================================================ */
#login-modal,
#signup-modal,
#forgot-modal,
#demo-login-modal {
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto !important;
  isolation: isolate;
  overscroll-behavior: contain;
}

#login-modal > div,
#signup-modal > div,
#forgot-modal > div,
#demo-login-modal > div {
  position: relative !important;
  z-index: 100001 !important;
  pointer-events: auto !important;
}

#login-modal button[onclick*="closeLoginModal"],
#signup-modal button[onclick*="closeSignupModal"],
#forgot-modal button[onclick*="closeForgotModal"],
#demo-login-modal button[onclick*="closeDemoLoginModal"] {
  position: relative !important;
  z-index: 100002 !important;
  pointer-events: auto !important;
  touch-action: manipulation !important;
  -webkit-user-select: none !important;
  user-select: none !important;
  min-width: 44px !important;
  min-height: 44px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  cursor: pointer !important;
}

/* Do not put the core modal mechanics behind a mobile-only media query.
   Chrome Desktop Site can report a desktop-sized viewport on a phone. */
#login-modal,
#signup-modal,
#forgot-modal,
#demo-login-modal {
  padding: 16px !important;
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch;
}

#login-modal > div,
#signup-modal > div,
#forgot-modal > div,
#demo-login-modal > div {
  width: min(100%, 420px) !important;
  max-width: 420px !important;
  max-height: min(90vh, calc(100dvh - 32px)) !important;
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

@supports not (height: 100dvh) {
  #login-modal > div,
  #signup-modal > div,
  #forgot-modal > div,
  #demo-login-modal > div {
    max-height: calc(100vh - 32px) !important;
  }
}
</style>

<script>
(function () {
  'use strict';

  var MODALS = ['login-modal', 'signup-modal', 'forgot-modal', 'demo-login-modal'];

  function isOpen(modal) {
    return modal && !modal.classList.contains('hidden');
  }

  function lockBody() {
    if (!document.body) return;
    document.body.dataset.bizosModalOpen = '1';
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
    document.body.style.touchAction = 'none';
  }

  function unlockBody() {
    for (var i = 0; i < MODALS.length; i++) {
      var modal = document.getElementById(MODALS[i]);
      if (isOpen(modal)) return;
    }
    if (!document.body) return;
    delete document.body.dataset.bizosModalOpen;
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
    document.body.style.touchAction = '';
  }

  function closeModal(id) {
    var modal = document.getElementById(id);
    if (!modal) return;
    modal.classList.add('hidden');
    modal.setAttribute('aria-hidden', 'true');
    unlockBody();
  }

  function openModal(id) {
    var modal = document.getElementById(id);
    if (!modal) return;
    modal.classList.remove('hidden');
    modal.setAttribute('aria-hidden', 'false');
    lockBody();
  }

  window.closeLoginModal = function () { closeModal('login-modal'); };
  window.closeSignupModal = function () { closeModal('signup-modal'); };
  window.closeForgotModal = function () { closeModal('forgot-modal'); };
  window.closeDemoLoginModal = function () { closeModal('demo-login-modal'); };

  var originalShowLogin = window.showLoginModal;
  var originalShowSignup = window.showSignupModal;
  var originalShowForgot = window.showForgotPassword;
  var originalShowDemo = window.showDemoLoginModal;

  window.showLoginModal = function () {
    closeModal('signup-modal');
    closeModal('forgot-modal');
    closeModal('demo-login-modal');
    if (typeof originalShowLogin === 'function') originalShowLogin.apply(this, arguments);
    openModal('login-modal');
  };

  window.showSignupModal = function () {
    closeModal('login-modal');
    closeModal('forgot-modal');
    closeModal('demo-login-modal');
    if (typeof originalShowSignup === 'function') originalShowSignup.apply(this, arguments);
    openModal('signup-modal');
  };

  if (typeof originalShowForgot === 'function') {
    window.showForgotPassword = function () {
      closeModal('login-modal');
      closeModal('signup-modal');
      closeModal('demo-login-modal');
      originalShowForgot.apply(this, arguments);
      openModal('forgot-modal');
    };
  }

  if (typeof originalShowDemo === 'function') {
    window.showDemoLoginModal = function () {
      closeModal('login-modal');
      closeModal('signup-modal');
      closeModal('forgot-modal');
      originalShowDemo.apply(this, arguments);
      openModal('demo-login-modal');
    };
  }

  /*
     Use both pointerup and click. This is important on phones running
     Chrome Desktop Site, where the browser can expose a desktop layout
     while the physical input is still touch.
  */
  function handleCloseActivation(event) {
    var target = event.target;
    var button = target && target.closest ? target.closest('button') : null;
    if (!button) return;

    var onclick = button.getAttribute('onclick') || '';
    var modalId = null;

    if (onclick.indexOf('closeLoginModal') !== -1) modalId = 'login-modal';
    else if (onclick.indexOf('closeSignupModal') !== -1) modalId = 'signup-modal';
    else if (onclick.indexOf('closeForgotModal') !== -1) modalId = 'forgot-modal';
    else if (onclick.indexOf('closeDemoLoginModal') !== -1) modalId = 'demo-login-modal';

    if (!modalId) return;

    event.preventDefault();
    event.stopPropagation();
    closeModal(modalId);
  }

  document.addEventListener('pointerup', handleCloseActivation, true);
  document.addEventListener('click', handleCloseActivation, true);

  /* Backdrop activation works in every viewport mode. */
  function handleBackdrop(event) {
    var target = event.target;
    if (!target || !target.id || MODALS.indexOf(target.id) === -1) return;
    event.preventDefault();
    closeModal(target.id);
  }

  document.addEventListener('pointerup', handleBackdrop, true);
  document.addEventListener('click', handleBackdrop, true);

  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    for (var i = 0; i < MODALS.length; i++) {
      if (isOpen(document.getElementById(MODALS[i]))) {
        closeModal(MODALS[i]);
        break;
      }
    }
  });

  function syncAria() {
    for (var i = 0; i < MODALS.length; i++) {
      var modal = document.getElementById(MODALS[i]);
      if (modal) modal.setAttribute('aria-hidden', modal.classList.contains('hidden') ? 'true' : 'false');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', syncAria, { once: true });
  } else {
    syncAria();
  }
})();
</script>
