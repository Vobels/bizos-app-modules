<style>
#bizos-modal-host{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:2147483647!important;pointer-events:none!important;isolation:isolate!important;}
#login-modal,#signup-modal,#forgot-modal,#demo-login-modal{ -webkit-tap-highlight-color:transparent; pointer-events:auto!important; isolation:isolate; overscroll-behavior:contain; padding:16px!important; overflow-y:auto!important; -webkit-overflow-scrolling:touch; }
#login-modal,#signup-modal,#forgot-modal,#demo-login-modal{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:2147483647!important;}
#login-modal>div,#signup-modal>div,#forgot-modal>div,#demo-login-modal>div{ position:relative!important; z-index:2147483648!important; pointer-events:auto!important; width:min(100%,420px)!important; max-width:420px!important; max-height:min(90vh,calc(100dvh - 32px))!important; overflow-y:auto!important; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
#login-modal button[onclick="closeLoginModal()"],#signup-modal button[onclick="closeSignupModal()"],#forgot-modal button[onclick="closeForgotModal()"],#demo-login-modal button[onclick="closeDemoLoginModal()"]{ position:relative!important; z-index:2147483649!important; pointer-events:auto!important; touch-action:manipulation!important; min-width:44px!important; min-height:44px!important; display:inline-flex!important; align-items:center!important; justify-content:center!important; cursor:pointer!important; }
@supports not (height:100dvh){#login-modal>div,#signup-modal>div,#forgot-modal>div,#demo-login-modal>div{max-height:calc(100vh - 32px)!important;}}
</style>
<script>
(function(){'use strict';
var MODALS=['login-modal','signup-modal','forgot-modal','demo-login-modal'],savedScrollY=0,pageWasLocked=false,host=null;
function ensureHost(){if(!document.body)return null;host=document.getElementById('bizos-modal-host');if(!host){host=document.createElement('div');host.id='bizos-modal-host';document.body.appendChild(host);}return host;}
function moveModalsToHost(){var h=ensureHost();if(!h)return;for(var i=0;i<MODALS.length;i++){var m=document.getElementById(MODALS[i]);if(m&&m.parentElement!==h)h.appendChild(m);}}
function isOpen(m){return m&&!m.classList.contains('hidden');}
function lockBody(){if(!document.body||pageWasLocked)return;savedScrollY=window.pageYOffset||document.documentElement.scrollTop||0;pageWasLocked=true;document.body.dataset.bizosModalOpen='1';document.body.dataset.bizosModalScrollY=String(savedScrollY);document.documentElement.style.overflow='hidden';}
function unlockBody(){for(var i=0;i<MODALS.length;i++)if(isOpen(document.getElementById(MODALS[i])))return;if(!document.body||!pageWasLocked)return;pageWasLocked=false;document.documentElement.style.overflow='';delete document.body.dataset.bizosModalOpen;delete document.body.dataset.bizosModalScrollY;window.scrollTo(0,savedScrollY);}
function closeModal(id){var m=document.getElementById(id);if(!m)return;m.classList.add('hidden');m.setAttribute('aria-hidden','true');unlockBody();}
function openModal(id){moveModalsToHost();var m=document.getElementById(id);if(!m)return;m.classList.remove('hidden');m.setAttribute('aria-hidden','false');lockBody();}
window.closeLoginModal=function(){closeModal('login-modal');};window.closeSignupModal=function(){closeModal('signup-modal');};window.closeForgotModal=function(){closeModal('forgot-modal');};window.closeDemoLoginModal=function(){closeModal('demo-login-modal');};
var originalShowLogin=window.showLoginModal,originalShowSignup=window.showSignupModal,originalShowForgot=window.showForgotPassword,originalShowDemo=window.showDemoLoginModal,originalOpenLogin=window.openLoginModal;
window.showLoginModal=function(){moveModalsToHost();closeModal('signup-modal');closeModal('forgot-modal');closeModal('demo-login-modal');if(typeof originalShowLogin==='function')originalShowLogin.apply(this,arguments);openModal('login-modal');};
window.showSignupModal=function(){moveModalsToHost();closeModal('login-modal');closeModal('forgot-modal');closeModal('demo-login-modal');if(typeof originalShowSignup==='function')originalShowSignup.apply(this,arguments);openModal('signup-modal');};
window.showForgotPassword=function(){moveModalsToHost();closeModal('login-modal');closeModal('signup-modal');closeModal('demo-login-modal');if(typeof originalShowForgot==='function')originalShowForgot.apply(this,arguments);openModal('forgot-modal');};
window.showDemoLoginModal=function(){moveModalsToHost();closeModal('login-modal');closeModal('signup-modal');closeModal('forgot-modal');if(typeof originalShowDemo==='function')originalShowDemo.apply(this,arguments);openModal('demo-login-modal');};
window.openLoginModal=function(){moveModalsToHost();if(typeof originalOpenLogin==='function')originalOpenLogin.apply(this,arguments);openModal('login-modal');};
function buttonForClose(t){if(!t)return null;if(t.closest)return t.closest('button');var n=t;while(n&&n!==document){if(String(n.tagName).toLowerCase()==='button')return n;n=n.parentNode;}return null;}
function dedicated(b,name){if(!b)return false;var x=(b.getAttribute('onclick')||'').replace(/\s+/g,' ').trim();return new RegExp('^'+name+'\\s*\\(\\s*\\)\\s*;?$').test(x);}
function handleClose(e){var b=buttonForClose(e.target);if(!b)return;var id=null;if(dedicated(b,'closeLoginModal'))id='login-modal';else if(dedicated(b,'closeSignupModal'))id='signup-modal';else if(dedicated(b,'closeForgotModal'))id='forgot-modal';else if(dedicated(b,'closeDemoLoginModal'))id='demo-login-modal';if(!id)return;e.preventDefault();e.stopPropagation();closeModal(id);}
function stopBackgroundScroll(e){var h=document.getElementById('bizos-modal-host');if(!h||e.target===h)e.preventDefault();}
document.addEventListener('pointerup',handleClose,true);document.addEventListener('click',handleClose,true);
document.addEventListener('wheel',stopBackgroundScroll,{capture:true,passive:false});
function backdrop(e){var t=e.target;if(!t||!t.id||MODALS.indexOf(t.id)===-1)return;e.preventDefault();e.stopPropagation();closeModal(t.id);}document.addEventListener('pointerup',backdrop,true);document.addEventListener('click',backdrop,true);
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;for(var i=0;i<MODALS.length;i++)if(isOpen(document.getElementById(MODALS[i]))){closeModal(MODALS[i]);break;}});
function aria(){moveModalsToHost();for(var i=0;i<MODALS.length;i++){var m=document.getElementById(MODALS[i]);if(m)m.setAttribute('aria-hidden',m.classList.contains('hidden')?'true':'false');}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',aria,{once:true});else aria();
})();
</script>
