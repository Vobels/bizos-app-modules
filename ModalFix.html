<style>
/* BizOS — single authoritative modal controller */
#login-modal,#signup-modal,#forgot-modal,#demo-login-modal{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  min-height:100vh!important;
  min-height:100dvh!important;
  z-index:2147483646!important;
  padding:16px!important;
  box-sizing:border-box!important;
  align-items:center!important;
  justify-content:center!important;
  overflow-y:auto!important;
  overscroll-behavior:contain!important;
  -webkit-overflow-scrolling:touch!important;
  pointer-events:auto!important;
  isolation:isolate!important;
  -webkit-tap-highlight-color:transparent;
}

#login-modal.hidden,#signup-modal.hidden,#forgot-modal.hidden,#demo-login-modal.hidden{
  display:none!important;
}

#login-modal:not(.hidden),#signup-modal:not(.hidden),#forgot-modal:not(.hidden),#demo-login-modal:not(.hidden){
  display:flex!important;
}

#login-modal>div,#signup-modal>div,#forgot-modal>div,#demo-login-modal>div{
  position:relative!important;
  z-index:2147483647!important;
  pointer-events:auto!important;
  width:min(100%,420px)!important;
  max-width:420px!important;
  max-height:calc(100dvh - 32px)!important;
  overflow-y:auto!important;
  -webkit-overflow-scrolling:touch!important;
  overscroll-behavior:contain!important;
  box-sizing:border-box!important;
}

#login-modal button[onclick="closeLoginModal()"],
#signup-modal button[onclick="closeSignupModal()"],
#forgot-modal button[onclick="closeForgotModal()"],
#demo-login-modal button[onclick="closeDemoLoginModal()"]{
  position:relative!important;
  z-index:2147483648!important;
  pointer-events:auto!important;
  touch-action:manipulation!important;
  min-width:44px!important;
  min-height:44px!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  cursor:pointer!important;
}

@supports not (height:100dvh){
  #login-modal>div,#signup-modal>div,#forgot-modal>div,#demo-login-modal>div{
    max-height:calc(100vh - 32px)!important;
  }
}
</style>

<script>
(function(){
  'use strict';

  var MODALS=['login-modal','signup-modal','forgot-modal','demo-login-modal'];
  var savedScrollY=0;
  var bodyLocked=false;

  function getModal(id){ return document.getElementById(id); }
  function isOpen(id){
    var m=getModal(id);
    return !!(m && !m.classList.contains('hidden'));
  }

  function lockPage(){
    if(bodyLocked || !document.body) return;
    savedScrollY=window.pageYOffset || document.documentElement.scrollTop || 0;
    bodyLocked=true;

    document.body.style.position='fixed';
    document.body.style.top='-'+savedScrollY+'px';
    document.body.style.left='0';
    document.body.style.right='0';
    document.body.style.width='100%';
    document.body.style.overflow='hidden';
    document.documentElement.style.overflow='hidden';
  }

  function unlockPage(){
    if(!document.body || MODALS.some(isOpen)) return;
    if(!bodyLocked) return;

    document.body.style.position='';
    document.body.style.top='';
    document.body.style.left='';
    document.body.style.right='';
    document.body.style.width='';
    document.body.style.overflow='';
    document.documentElement.style.overflow='';
    bodyLocked=false;
    window.scrollTo(0,savedScrollY);
  }

  function clearFocus(modal){
    var active=document.activeElement;
    if(modal && active && modal.contains(active) && typeof active.blur==='function'){
      active.blur();
    }
  }

  function closeModal(id){
    var modal=getModal(id);
    if(!modal) return;

    clearFocus(modal);
    modal.classList.add('hidden');
    modal.style.display='none';
    modal.setAttribute('aria-hidden','true');

    unlockPage();
  }

  function closeAllExcept(id){
    MODALS.forEach(function(otherId){
      if(otherId!==id) closeModal(otherId);
    });
  }

  function openModal(id){
    var modal=getModal(id);
    if(!modal) return;

    closeAllExcept(id);

    /* Remove any stale inline display left by the old modal implementation. */
    modal.style.display='';
    modal.classList.remove('hidden');
    modal.style.display='flex';
    modal.setAttribute('aria-hidden','false');
    lockPage();

    /* Put focus into the first usable control without scrolling the page. */
    window.setTimeout(function(){
      var first=modal.querySelector('input:not([disabled]),button:not([disabled]),select:not([disabled]),textarea:not([disabled])');
      if(first && typeof first.focus==='function') first.focus({preventScroll:true});
    },30);
  }

  /* These are the ONLY public modal functions. We deliberately do not call
     the previous implementations, because they used independent display state. */
  window.closeLoginModal=function(){closeModal('login-modal');};
  window.closeSignupModal=function(){closeModal('signup-modal');};
  window.closeForgotModal=function(){closeModal('forgot-modal');};
  window.closeDemoLoginModal=function(){closeModal('demo-login-modal');};

  window.showLoginModal=function(){openModal('login-modal');};
  window.showSignupModal=function(){openModal('signup-modal');};
  window.showForgotPassword=function(){openModal('forgot-modal');};
  window.showDemoLoginModal=function(){openModal('demo-login-modal');};
  window.openLoginModal=function(){openModal('login-modal');};

  function modalFromTarget(target){
    if(!target) return null;
    if(target.closest){
      var found=target.closest('#login-modal,#signup-modal,#forgot-modal,#demo-login-modal');
      if(found) return found;
    }
    return null;
  }

  /* Backdrop click: only the backdrop itself closes the modal. */
  document.addEventListener('click',function(e){
    var modal=modalFromTarget(e.target);
    if(modal && e.target===modal){
      closeModal(modal.id);
    }
  },false);

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    for(var i=0;i<MODALS.length;i++){
      if(isOpen(MODALS[i])){
        e.preventDefault();
        closeModal(MODALS[i]);
        break;
      }
    }
  });

  /* Keep aria state synchronized, but never hide a focused modal first. */
  function syncAria(){
    MODALS.forEach(function(id){
      var m=getModal(id);
      if(!m) return;
      m.setAttribute('aria-hidden',m.classList.contains('hidden')?'true':'false');
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',syncAria,{once:true});
  }else{
    syncAria();
  }
})();
</script>
