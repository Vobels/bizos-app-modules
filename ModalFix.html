<style>
/* BizOS — modal presentation only. Modal itself scrolls; page scroll is never locked. */
#login-modal,#signup-modal,#forgot-modal,#demo-login-modal{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;min-height:100vh!important;min-height:100dvh!important;z-index:2147483646!important;padding:16px!important;box-sizing:border-box!important;align-items:center!important;justify-content:center!important;overflow-y:auto!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important;pointer-events:auto!important;isolation:isolate!important;-webkit-tap-highlight-color:transparent;}
#login-modal.hidden,#signup-modal.hidden,#forgot-modal.hidden,#demo-login-modal.hidden{display:none!important;}
#login-modal:not(.hidden),#signup-modal:not(.hidden),#forgot-modal:not(.hidden),#demo-login-modal:not(.hidden){display:flex!important;}
#login-modal>div,#signup-modal>div,#forgot-modal>div,#demo-login-modal>div{position:relative!important;z-index:2147483647!important;pointer-events:auto!important;width:min(100%,420px)!important;max-width:420px!important;max-height:calc(100dvh - 32px)!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior:contain!important;box-sizing:border-box!important;}
#login-modal button[onclick="closeLoginModal()"],#signup-modal button[onclick="closeSignupModal()"],#forgot-modal button[onclick="closeForgotModal()"],#demo-login-modal button[onclick="closeDemoLoginModal()"]{position:relative!important;z-index:2147483648!important;pointer-events:auto!important;touch-action:manipulation!important;min-width:44px!important;min-height:44px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;}
#login-business-name{display:none!important;}#login-business-name + *{display:none!important;}
@supports not (height:100dvh){#login-modal>div,#signup-modal>div,#forgot-modal>div,#demo-login-modal>div{max-height:calc(100vh - 32px)!important;}}
</style>
<script>
(function(){'use strict';
var MODALS=['login-modal','signup-modal','forgot-modal','demo-login-modal'];
function getModal(id){return document.getElementById(id);} function isOpen(id){var m=getModal(id);return !!(m&&!m.classList.contains('hidden'));}
/* Do not lock the document. Modal content is its own scroll container. */
function normalizePageScroll(){if(!document.body||!document.documentElement)return;var b=document.body,h=document.documentElement;['position','top','left','right','width','height','minHeight','overflow','overflowY','overflowX','touchAction'].forEach(function(p){b.style[p]='';});['position','height','minHeight','overflow','overflowY','overflowX'].forEach(function(p){h.style[p]='';});}
function clearFocus(m){var a=document.activeElement;if(m&&a&&m.contains(a)&&typeof a.blur==='function')a.blur();}
function closeModal(id){var m=getModal(id);if(!m)return;clearFocus(m);m.classList.add('hidden');m.style.display='none';m.setAttribute('aria-hidden','true');normalizePageScroll();}
function closeAllExcept(id){MODALS.forEach(function(x){if(x!==id)closeModal(x);});}
function openModal(id){var m=getModal(id);if(!m)return;closeAllExcept(id);m.classList.remove('hidden');m.style.display='flex';m.setAttribute('aria-hidden','false');normalizePageScroll();setTimeout(function(){var f=m.querySelector('input:not([disabled]),button:not([disabled]),select:not([disabled]),textarea:not([disabled])');if(f&&typeof f.focus==='function')f.focus({preventScroll:true});},30);}
window.closeLoginModal=function(){closeModal('login-modal');};window.closeSignupModal=function(){closeModal('signup-modal');};window.closeForgotModal=function(){closeModal('forgot-modal');};window.closeDemoLoginModal=function(){closeModal('demo-login-modal');};
window.showLoginModal=function(){openModal('login-modal');};window.showSignupModal=function(){openModal('signup-modal');};window.showForgotPassword=function(){openModal('forgot-modal');};window.showDemoLoginModal=function(){openModal('demo-login-modal');};window.openLoginModal=function(){openModal('login-modal');};
document.addEventListener('click',function(e){var m=e.target&&e.target.closest?e.target.closest('#login-modal,#signup-modal,#forgot-modal,#demo-login-modal'):null;if(m&&e.target===m)closeModal(m.id);},false);
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;for(var i=0;i<MODALS.length;i++)if(isOpen(MODALS[i])){e.preventDefault();closeModal(MODALS[i]);break;}});
function syncAria(){MODALS.forEach(function(id){var m=getModal(id);if(m)m.setAttribute('aria-hidden',m.classList.contains('hidden')?'true':'false');});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncAria,{once:true});else syncAria();
window.handleLogin=function(event){if(event&&event.preventDefault)event.preventDefault();var e=document.getElementById('login-email'),p=document.getElementById('login-password');var email=e?String(e.value||'').trim().toLowerCase():'';var password=p?String(p.value||''):'';if(!email||!password){if(window.showNotification)window.showNotification('Please enter your email and password.','error');return false;}var submit=document.querySelector('#login-form button[type="submit"]');if(submit){submit.disabled=true;submit.dataset.originalText=submit.textContent;submit.textContent='Signing in...';}google.script.run.withSuccessHandler(function(r){if(submit){submit.disabled=false;submit.textContent=submit.dataset.originalText||'Sign In';}if(!r||!r.success){var msg=r&&r.message||'Login failed. Please check your email and password.';if(window.showNotification)window.showNotification(msg,'error');var resend=document.getElementById('resend-verification-section');if(resend&&/verification/i.test(msg))resend.classList.remove('hidden');return;}if(window.saveSession)window.saveSession(r.sessionId,r.user);else{localStorage.setItem('bizos_session',r.sessionId||'');localStorage.setItem('bizos_user',JSON.stringify(r.user||{}));}closeModal('login-modal');var l=document.getElementById('landing-page'),d=document.getElementById('dashboard-page');if(l)l.style.display='none';if(d)d.style.display='block';if(window.loadDashboard)window.loadDashboard();if(window.loadEnhancedDashboard)setTimeout(window.loadEnhancedDashboard,300);}).withFailureHandler(function(err){if(submit){submit.disabled=false;submit.textContent=submit.dataset.originalText||'Sign In';}if(window.showNotification)window.showNotification(err&&err.message||'Login failed. Please try again.','error');}).authenticateUser(email,password,'');return false;};
function hideLegacy(){var i=document.getElementById('login-business-name');if(i&&i.parentElement)i.parentElement.style.display='none';}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hideLegacy,{once:true});else hideLegacy();
})();
</script>
