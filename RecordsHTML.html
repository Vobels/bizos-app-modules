<!-- BizOS Records directory -->
<div id="records-page" class="hidden fixed inset-0 z-[999997] bg-gray-50 overflow-hidden">
  <main class="w-full h-full overflow-y-auto">
    <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-10">
      <div class="flex items-center justify-between">
        <div><h1 class="text-xl font-semibold text-gray-900">Records</h1><p class="text-sm text-gray-500 mt-1">Your business records, organized by record type.</p></div>
        <button type="button" onclick="closeRecordsPage()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
      </div>
    </header>
    <div class="p-6">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <section class="bg-white border rounded-xl p-4">
          <div class="flex items-center justify-between gap-3 mb-3"><h2 class="font-semibold text-gray-900">Records by app</h2></div><input id="records-search" type="search" placeholder="Search records or apps..." class="w-full border rounded-lg px-3 py-2 text-sm mb-3" oninput="renderRecordsDirectorySearch()">
          <div id="records-type-list" class="space-y-1"><p class="text-sm text-gray-500 p-3">Loading...</p></div>
        </section>
        <section class="lg:col-span-3 bg-white border rounded-xl overflow-hidden">
          <div class="px-5 py-4 border-b"><h2 id="records-table-title" class="font-semibold text-gray-900">Select a record type</h2></div>
          <div id="records-table-wrap" class="overflow-x-auto"><p class="p-8 text-center text-gray-500">Choose a record type to view its records.</p></div>
        </section>
      </div>
    </div>
  </main>
</div>
<script>
(function(){
  var allRecords=[];
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function renderDirectory(){
    var list=document.getElementById('records-type-list');
    var query=(document.getElementById('records-search')||{}).value||'';
    query=String(query).trim().toLowerCase();
    var filtered=allRecords.filter(function(r){
      return !query || String(r.name||'').toLowerCase().indexOf(query)!==-1 ||
        String(r.module||'').toLowerCase().indexOf(query)!==-1;
    });
    var groups={};
    filtered.forEach(function(r){var g=r.module||'Other';(groups[g]||(groups[g]=[])).push(r);});
    var order=['Finance','Ecommerce','Sales','CRM','HR','Logistics','Tax','Agro','Productivity','POS','Attendance','Warehouse','Business Center'];
    var keys=Object.keys(groups).sort(function(a,b){
      var ai=order.indexOf(a),bi=order.indexOf(b);
      return (ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b);
    });
    list.innerHTML=keys.map(function(group){
      return '<div class="mb-4"><div class="text-xs font-semibold uppercase tracking-wide text-gray-400 px-2 py-1">'+esc(group)+'</div>'+
        groups[group].map(function(r){
          return '<button type="button" data-record-key="'+esc(r.key)+'" class="record-directory-item w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center justify-between"><span><i class="fas fa-table text-gray-400 mr-2"></i>'+esc(r.name)+'</span><span class="text-xs text-gray-500">'+Number(r.count||0)+'</span></button>';
        }).join('')+'</div>';
    }).join('')||'<p class="text-sm text-gray-500 p-3">No matching records found.</p>';
    list.querySelectorAll('[data-record-key]').forEach(function(btn){btn.addEventListener('click',function(){loadRecordRows(btn.getAttribute('data-record-key'));});});
  }
  window.renderRecordsDirectorySearch=renderDirectory;\n  window.closeRecordsPage=function(){var p=document.getElementById('records-page');if(p)p.classList.add('hidden');};
  window.showRecordsPage=function(){
    var p=document.getElementById('records-page');if(!p)return;
    p.classList.remove('hidden');
    var list=document.getElementById('records-type-list');
    list.innerHTML='<p class="text-sm text-gray-500 p-3">Loading your records…</p>';
    callGoogleScript('getRecordsDirectory',[],function(res){
      if(!res||!res.success){list.innerHTML='<p class="text-sm text-red-600 p-3">We could not load your records. Please try again.</p>';return;}
      allRecords=Array.isArray(res.records)?res.records:[];
      renderDirectory();
    },function(){list.innerHTML='<p class="text-sm text-red-600 p-3">We could not load your records. Please try again.</p>';});
  };
  window.loadRecordRows=function(key){
    var wrap=document.getElementById('records-table-wrap'),title=document.getElementById('records-table-title');
    wrap.innerHTML='<p class="p-8 text-center text-gray-500">Loading records…</p>';
    callGoogleScript('getRecordRows',[key],function(res){
      if(!res||!res.success){wrap.innerHTML='<p class="p-8 text-center text-red-600">We could not load these records. Please try again.</p>';return;}
      title.textContent=res.recordType||'Records';
      var headers=res.headers||[],rows=res.records||[];
      if(!rows.length){wrap.innerHTML='<p class="p-8 text-center text-gray-500">No records yet. They will appear here when you add data.</p>';return;}
      wrap.innerHTML='<div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr>'+headers.map(function(h){return '<th class="px-4 py-3 text-left font-semibold text-gray-600 whitespace-nowrap">'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(row){return '<tr class="border-t">'+headers.map(function(h){return '<td class="px-4 py-3 whitespace-nowrap text-gray-700">'+esc(row[h])+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
    },function(){wrap.innerHTML='<p class="p-8 text-center text-red-600">We could not load these records. Please try again.</p>';});
  };
})();
</script>
