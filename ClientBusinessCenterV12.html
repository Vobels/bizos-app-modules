<div id="bc-v12-root" class="bc-v12 hidden">
  <div class="bc-v12-head">
    <div>
      <span class="section-kicker">BUSINESS CENTER</span>
      <h2>Run your products, customers and sales</h2>
      <p>Keep your catalog, stock and customer activity connected in one place.</p>
    </div>
    <div class="bc-v12-actions">
      <button class="bc-v12-button" onclick="bcV12Refresh()">Refresh</button>
      <button class="bc-v12-button bc-v12-primary" onclick="bcV12OpenProduct()">Add product</button>
    </div>
  </div>
  <div id="bc-v12-alert" class="bc-v12-alert hidden"></div>
  <div class="bc-v12-tabs">
    <button data-bc-tab="overview" class="active" onclick="bcV12Tab('overview')">Overview</button>
    <button data-bc-tab="products" onclick="bcV12Tab('products')">Products</button>
    <button data-bc-tab="customers" onclick="bcV12Tab('customers')">Customers</button>
    <button data-bc-tab="sales" onclick="bcV12Tab('sales')">Sales</button>
    <button data-bc-tab="stock" onclick="bcV12Tab('stock')">Stock</button>
  </div>
  <div id="bc-v12-content"></div>

  <div id="bc-v12-modal" class="bc-v12-modal hidden" onclick="if(event.target===this)bcV12CloseModal()">
    <div class="bc-v12-modal-card">
      <div class="bc-v12-modal-head"><div><span id="bc-v12-modal-kicker" class="section-kicker">PRODUCT</span><h3 id="bc-v12-modal-title">Add product</h3></div><button onclick="bcV12CloseModal()" class="bc-v12-close">×</button></div>
      <form id="bc-v12-product-form" onsubmit="bcV12SaveProduct(event)">
        <input type="hidden" id="bc-v12-product-id">
        <div class="bc-v12-form-grid">
          <label>Name<input id="bc-v12-name" required></label>
          <label>SKU<input id="bc-v12-sku"></label>
          <label>Barcode<input id="bc-v12-barcode"></label>
          <label>Category<input id="bc-v12-category"></label>
          <label>Cost price<input id="bc-v12-cost" type="number" min="0" step="0.01" value="0"></label>
          <label>Selling price<input id="bc-v12-selling" type="number" min="0" step="0.01" value="0" required></label>
          <label>Opening stock<input id="bc-v12-stock" type="number" min="0" step="1" value="0"></label>
          <label>Minimum stock<input id="bc-v12-minimum" type="number" min="0" step="1" value="0"></label>
          <label>Unit<input id="bc-v12-unit" value="unit"></label>
          <label>Supplier<input id="bc-v12-supplier"></label>
          <label>Location<input id="bc-v12-location"></label>
        </div>
        <div class="bc-v12-modal-foot"><button type="button" class="bc-v12-button" onclick="bcV12CloseModal()">Cancel</button><button id="bc-v12-product-submit" class="bc-v12-button bc-v12-primary" type="submit">Save product</button></div>
      </form>
    </div>
  </div>

  <div id="bc-v12-customer-modal" class="bc-v12-modal hidden" onclick="if(event.target===this)bcV12CloseCustomerModal()">
    <div class="bc-v12-modal-card small">
      <div class="bc-v12-modal-head"><div><span class="section-kicker">CUSTOMER</span><h3>Add customer</h3></div><button onclick="bcV12CloseCustomerModal()" class="bc-v12-close">×</button></div>
      <form onsubmit="bcV12SaveCustomer(event)">
        <div class="bc-v12-form-grid">
          <label>Name<input id="bc-v12-customer-name" required></label>
          <label>Phone<input id="bc-v12-customer-phone"></label>
          <label>Email<input id="bc-v12-customer-email" type="email"></label>
          <label>Address<input id="bc-v12-customer-address"></label>
        </div>
        <div class="bc-v12-modal-foot"><button type="button" class="bc-v12-button" onclick="bcV12CloseCustomerModal()">Cancel</button><button class="bc-v12-button bc-v12-primary" type="submit">Save customer</button></div>
      </form>
    </div>
  </div>

  <div id="bc-v12-sale-modal" class="bc-v12-modal hidden" onclick="if(event.target===this)bcV12CloseSaleModal()">
    <div class="bc-v12-modal-card wide">
      <div class="bc-v12-modal-head"><div><span class="section-kicker">POINT OF SALE</span><h3>New sale</h3></div><button onclick="bcV12CloseSaleModal()" class="bc-v12-close">×</button></div>
      <div class="bc-v12-pos-grid">
        <div>
          <label>Find product<input id="bc-v12-pos-search" placeholder="Product name, SKU or barcode" oninput="bcV12SearchProducts()"></label>
          <div id="bc-v12-pos-results" class="bc-v12-pos-results"></div>
          <div class="bc-v12-cart-head"><strong>Current sale</strong><span id="bc-v12-cart-count">0 items</span></div>
          <div id="bc-v12-cart"></div>
        </div>
        <aside class="bc-v12-sale-summary">
          <span class="section-kicker">SALE TOTAL</span><strong id="bc-v12-sale-total">₦0.00</strong>
          <label>Customer<select id="bc-v12-sale-customer"><option value="">Walk-in customer</option></select></label>
          <label>Discount<input id="bc-v12-sale-discount" type="number" min="0" step="0.01" value="0" oninput="bcV12RenderCart()"></label>
          <label>Payment method<select id="bc-v12-sale-payment"><option>Cash</option><option>Bank Transfer</option><option>Debit Card</option><option>Credit Card</option><option>Mobile Money</option></select></label>
          <label>Amount received<input id="bc-v12-sale-paid" type="number" min="0" step="0.01" value="0" oninput="bcV12RenderCart()"></label>
          <div class="bc-v12-sale-balance"><span>Balance due</span><strong id="bc-v12-sale-balance">₦0.00</strong></div>
          <button id="bc-v12-complete" class="bc-v12-button bc-v12-primary full" onclick="bcV12CompleteSale()" disabled>Complete sale</button>
        </aside>
      </div>
    </div>
  </div>
</div>

<style>
.bc-v12{margin-top:2px}.bc-v12-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.bc-v12-head h2{margin:5px 0 5px;font-size:24px}.bc-v12-head p{margin:0;color:#6b7280}.bc-v12-actions{display:flex;gap:8px}.bc-v12-button{border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;color:#1f2937}.bc-v12-button:hover{background:#f9fafb}.bc-v12-primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 18%,transparent)}.bc-v12-primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}.bc-v12-button.full{width:100%;margin-top:18px}.bc-v12-alert{padding:11px 14px;border-radius:10px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;margin-bottom:15px}.bc-v12-tabs{display:flex;gap:4px;border-bottom:1px solid #e5e7eb;margin-bottom:18px;overflow:auto}.bc-v12-tabs button{border:0;background:transparent;padding:11px 14px;color:#6b7280;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}.bc-v12-tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}.bc-v12-stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.bc-v12-stat,.bc-v12-panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px}.bc-v12-stat{padding:17px}.bc-v12-stat span{display:block;color:#6b7280;font-size:12px}.bc-v12-stat strong{display:block;font-size:24px;margin-top:7px}.bc-v12-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.bc-v12-panel{padding:18px}.bc-v12-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.bc-v12-panel-head h3{margin:3px 0 0;font-size:16px}.bc-v12-table{width:100%;border-collapse:collapse}.bc-v12-table th,.bc-v12-table td{text-align:left;padding:11px 8px;border-bottom:1px solid #f0f1f3;font-size:13px}.bc-v12-table th{color:#6b7280;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.bc-v12-table td:last-child,.bc-v12-table th:last-child{text-align:right}.bc-v12-muted{color:#6b7280}.bc-v12-pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f3f4f6;color:#4b5563;font-size:11px;font-weight:600}.bc-v12-low{background:#fff7ed;color:#9a3412}.bc-v12-ok{background:#ecfdf5;color:#047857}.bc-v12-row-actions{display:flex;justify-content:flex-end;gap:6px}.bc-v12-mini{border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:11px}.bc-v12-empty{padding:35px 15px;text-align:center;color:#6b7280}.bc-v12-empty strong{display:block;color:#111827;margin-bottom:4px}.bc-v12-search{width:240px;max-width:100%;padding:9px 11px;border:1px solid #e5e7eb;border-radius:9px;outline:none}.bc-v12-modal{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}.bc-v12-modal-card{background:#fff;border-radius:16px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}.bc-v12-modal-card.small{width:min(560px,100%)}.bc-v12-modal-card.wide{width:min(1050px,100%)}.bc-v12-modal-head{display:flex;justify-content:space-between;gap:15px;margin-bottom:18px}.bc-v12-modal-head h3{margin:4px 0 0;font-size:20px}.bc-v12-close{border:0;background:#f3f4f6;border-radius:8px;width:34px;height:34px;font-size:22px;cursor:pointer}.bc-v12-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.bc-v12-form-grid label,.bc-v12-modal-card label,.bc-v12-sale-summary label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#374151}.bc-v12-form-grid input,.bc-v12-modal-card input,.bc-v12-sale-summary input,.bc-v12-sale-summary select,.bc-v12-pos-grid input{border:1px solid #dfe3e8;border-radius:9px;padding:10px 11px;font:inherit;outline:none;background:#fff;color:#111827}.bc-v12-modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.bc-v12-pos-grid{display:grid;grid-template-columns:1.5fr .7fr;gap:18px}.bc-v12-pos-results{margin-top:8px}.bc-v12-pos-result{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #e5e7eb;border-radius:9px;margin-bottom:6px}.bc-v12-cart-head{display:flex;justify-content:space-between;margin:18px 0 9px;color:#374151}.bc-v12-cart-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f1f3}.bc-v12-qty{display:flex;align-items:center;gap:5px}.bc-v12-qty button{border:1px solid #e5e7eb;background:#fff;border-radius:6px;width:26px;height:26px;cursor:pointer}.bc-v12-sale-summary{background:linear-gradient(160deg,var(--sidebar),var(--sidebar-2));color:#fff;border-radius:14px;padding:18px;align-self:start}.bc-v12-sale-summary label{color:#cbd5e1;margin-top:13px}.bc-v12-sale-summary input,.bc-v12-sale-summary select{background:#fff;color:#111827}.bc-v12-sale-summary>strong{display:block;font-size:30px;margin:5px 0 18px}.bc-v12-sale-balance{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.12);margin-top:18px;padding-top:15px}.bc-v12-stock-bar{height:7px;background:#f3f4f6;border-radius:99px;overflow:hidden;margin-top:6px}.bc-v12-stock-bar i{display:block;height:100%;background:var(--brand)}.bc-v12-hidden{display:none!important}
@media(max-width:900px){.bc-v12-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bc-v12-layout,.bc-v12-pos-grid{grid-template-columns:1fr}.bc-v12-head{flex-direction:column}.bc-v12-actions{width:100%}.bc-v12-actions button{flex:1}}@media(max-width:600px){.bc-v12-stat-grid,.bc-v12-form-grid{grid-template-columns:1fr}.bc-v12-table{min-width:620px}.bc-v12-panel{overflow:auto}.bc-v12-search{width:100%}}
</style>

<script>
(function(){
  var sessionKey='bizos_client_session_v12', data=null, currentTab='overview', cart=[];
  function sid(){return localStorage.getItem(sessionKey)||'';}
  function call(name,args,ok,fail){google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail||function(e){bcV12Message(window.clientFriendlyError(e&&e.message,''Request failed.');})[name].apply(null,args||[]);}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function money(v){return new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:2}).format(Number(v)||0);}
  function num(v){return new Intl.NumberFormat('en-NG').format(Number(v)||0);}
  function el(id){return document.getElementById(id);}
  function root(){return el('bc-v12-root');}
  function show(v){root().classList.toggle('hidden',!v);}
  function bcV12Message(message){var a=el('bc-v12-alert');if(!a)return;a.textContent=message||'';a.classList.toggle('hidden',!message);if(message)setTimeout(function(){a.classList.add('hidden');},4500);}
  function safeDate(v){if(!v)return '';var d=new Date(v);return isNaN(d.getTime())?String(v).slice(0,10):d.toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'});}
  function load(done){var c=el('bc-v12-content');c.innerHTML='<div class="bc-v12-empty">Loading your Business Center…</div>';call('getClientBusinessCenterData',[sid()],function(r){if(!r||!r.success){c.innerHTML='<div class="bc-v12-empty"><strong>Business Center unavailable</strong>'+esc(r&&r.message||'Please try again.')+'</div>';return;}data=r;render(done);});}
  function render(done){show(true);var tab=currentTab;document.querySelectorAll('[data-bc-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-bc-tab')===tab);});if(tab==='overview')renderOverview();if(tab==='products')renderProducts();if(tab==='customers')renderCustomers();if(tab==='sales')renderSales();if(tab==='stock')renderStock();if(done)done();}
  function renderOverview(){var s=data.summary||{},products=data.products||[],customers=data.customers||[],low=products.filter(function(p){return Number(p.Stock_Qty||0)<=Number(p.Minimum_Stock||0);});el('bc-v12-content').innerHTML='<div class="bc-v12-stat-grid"><div class="bc-v12-stat"><span>Products</span><strong>'+num(s.products)+'</strong></div><div class="bc-v12-stat"><span>Customers</span><strong>'+num(s.customers)+'</strong></div><div class="bc-v12-stat"><span>Stock units</span><strong>'+num(s.stockUnits)+'</strong></div><div class="bc-v12-stat"><span>Low stock</span><strong>'+num(s.lowStock)+'</strong></div></div><div class="bc-v12-layout"><section class="bc-v12-panel"><div class="bc-v12-panel-head"><div><span class="section-kicker">CATALOG</span><h3>Products needing attention</h3></div><button class="bc-v12-button" onclick="bcV12Tab(\'products\')">View products</button></div>'+productTable(low.slice(0,6),true)+'</section><section class="bc-v12-panel"><div class="bc-v12-panel-head"><div><span class="section-kicker">CUSTOMERS</span><h3>Customer accounts</h3></div><button class="bc-v12-button" onclick="bcV12OpenCustomer()">Add customer</button></div>'+customerTable(customers.slice(0,6))+'</section></div>';}
  function productTable(rows,lowOnly){if(!rows.length)return '<div class="bc-v12-empty"><strong>'+(lowOnly?'Stock looks healthy':'No products yet')+'</strong>'+(lowOnly?'No products are currently at or below minimum stock.':'Add your first product to build your catalog.')+'</div>';return '<div style="overflow:auto"><table class="bc-v12-table"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(function(p){var low=Number(p.Stock_Qty||0)<=Number(p.Minimum_Stock||0);return '<tr><td><strong>'+esc(p.Name)+'</strong><div class="bc-v12-muted">'+esc(p.SKU||p.Barcode||p.Product_ID)+'</div></td><td>'+money(p.Selling_Price)+'</td><td>'+num(p.Stock_Qty)+'</td><td><span class="bc-v12-pill '+(low?'bc-v12-low':'bc-v12-ok')+'">'+(low?'Low stock':'In stock')+'</span></td><td><div class="bc-v12-row-actions"><button class="bc-v12-mini" onclick="bcV12OpenProduct(\''+esc(p.Product_ID)+'\')">Edit</button><button class="bc-v12-mini" onclick="bcV12Stock(\''+esc(p.Product_ID)+'\')">Stock</button></div></td></tr>';}).join('')+'</tbody></table></div>';}
  function customerTable(rows){if(!rows.length)return '<div class="bc-v12-empty"><strong>No customers yet</strong>Add customers so sales and balances stay connected.</div>';return '<div style="overflow:auto"><table class="bc-v12-table"><thead><tr><th>Customer</th><th>Phone</th><th>Balance</th></tr></thead><tbody>'+rows.map(function(c){return '<tr><td><strong>'+esc(c.Name)+'</strong><div class="bc-v12-muted">'+esc(c.Email||'')+'</div></td><td>'+esc(c.Phone||'—')+'</td><td>'+money(c.Balance)+'</td></tr>';}).join('')+'</tbody></table></div>';}
  function renderProducts(){var rows=data.products||[];el('bc-v12-content').innerHTML='<section class="bc-v12-panel"><div class="bc-v12-panel-head"><div><span class="section-kicker">CATALOG</span><h3>'+num(rows.length)+' products</h3></div><div class="bc-v12-actions"><input class="bc-v12-search" id="bc-v12-product-filter" placeholder="Search products" oninput="bcV12FilterProducts()"><button class="bc-v12-button bc-v12-primary" onclick="bcV12OpenProduct()">Add product</button></div></div><div id="bc-v12-product-table">'+productTable(rows,false)+'</div></section>';}
  window.bcV12FilterProducts=function(){var q=(el('bc-v12-product-filter').value||'').toLowerCase();var rows=(data.products||[]).filter(function(p){return [p.Name,p.SKU,p.Barcode,p.Category].join(' ').toLowerCase().indexOf(q)>=0;});el('bc-v12-product-table').innerHTML=productTable(rows,false);};
  function renderCustomers(){var rows=data.customers||[];el('bc-v12-content').innerHTML='<section class="bc-v12-panel"><div class="bc-v12-panel-head"><div><span class="section-kicker">CUSTOMERS</span><h3>'+num(rows.length)+' customers</h3></div><button class="bc-v12-button bc-v12-primary" onclick="bcV12OpenCustomer()">Add customer</button></div>'+customerTable(rows)+'</section>';}
  function renderSales(){call('getClientBusinessCenterSales',[{limit:50},sid()],function(r){if(!r||!r.success){el('bc-v12-content').innerHTML='<div class="bc-v12-empty"><strong>Sales unavailable</strong>'+esc(r&&r.message||'Please try again.')+'</div>';return;}var rows=r.sales||[];el('bc-v12-content').innerHTML='<section class="bc-v12-panel"><div class="bc-v12-panel-head"><div><span class="section-kicker">SALES HISTORY</span><h3>'+num(rows.length)+' recent sales</h3></div><button class="bc-v12-button bc-v12-primary" onclick="bcV12OpenSale()">New sale</button></div>'+(rows.length?'<div style="overflow:auto"><table class="bc-v12-table"><thead><tr><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead><tbody>'+rows.map(function(s){return '<tr><td>'+safeDate(s.Date)+'</td><td>'+esc(s.Customer_Name||'Walk-in')+'</td><td>'+money(s.Total)+'</td><td>'+money(s.Amount_Paid)+'</td><td>'+money(s.Balance_Due)+'</td><td><span class="bc-v12-pill '+(Number(s.Balance_Due)>0?'bc-v12-low':'bc-v12-ok')+'">'+esc(s.Status||'Completed')+'</span></td></tr>';}).join('')+'</tbody></table></div>':'<div class="bc-v12-empty"><strong>No sales yet</strong>Start your first sale from the New sale button.</div>')+'</section>';});}
  function renderStock(){var rows=(data.products||[]).slice().sort(function(a,b){return Number(a.Stock_Qty||0)-Number(b.Stock_Qty||0);});el('bc-v12-content').innerHTML='<section class="bc-v12-panel"><div class="bc-v12-panel-head"><div><span class="section-kicker">INVENTORY</span><h3>Stock levels</h3></div><button class="bc-v12-button bc-v12-primary" onclick="bcV12OpenSale()">Sell products</button></div><div style="overflow:auto"><table class="bc-v12-table"><thead><tr><th>Product</th><th>Current</th><th>Minimum</th><th>Level</th><th></th></tr></thead><tbody>'+rows.map(function(p){var stock=Number(p.Stock_Qty||0),min=Math.max(1,Number(p.Minimum_Stock||0)),pct=Math.min(100,stock/Math.max(min*2,1)*100),low=stock<=min;return '<tr><td><strong>'+esc(p.Name)+'</strong></td><td>'+num(stock)+'</td><td>'+num(p.Minimum_Stock||0)+'</td><td style="min-width:150px"><span class="bc-v12-pill '+(low?'bc-v12-low':'bc-v12-ok')+'">'+(low?'Needs attention':'Healthy')+'</span><div class="bc-v12-stock-bar"><i style="width:'+pct+'%"></i></div></td><td><button class="bc-v12-mini" onclick="bcV12Stock(\''+esc(p.Product_ID)+'\')">Adjust</button></td></tr>';}).join('')+'</tbody></table></div></section>';}
  window.bcV12Tab=function(tab){currentTab=tab;render();if(tab==='sales')return;};
  window.bcV12Refresh=function(){load();};
  window.bcV12OpenProduct=function(id){var p=(data&&data.products||[]).find(function(x){return String(x.Product_ID)===String(id);})||null;el('bc-v12-product-id').value=p?p.Product_ID:'';el('bc-v12-modal-title').textContent=p?'Edit product':'Add product';[['name','Name'],['sku','SKU'],['barcode','Barcode'],['category','Category'],['cost','Cost_Price'],['selling','Selling_Price'],['stock','Stock_Qty'],['minimum','Minimum_Stock'],['unit','Unit'],['supplier','Supplier'],['location','Location']].forEach(function(pair){var x=el('bc-v12-'+pair[0]);if(x)x.value=p?(p[pair[1]]==null?'':p[pair[1]]):(['cost','selling','stock','minimum'].indexOf(pair[0])>=0?'0':pair[0]==='unit'?'unit':'');});el('bc-v12-stock').disabled=!!p;el('bc-v12-modal').classList.remove('hidden');};
  window.bcV12CloseModal=function(){el('bc-v12-modal').classList.add('hidden');};
  window.bcV12SaveProduct=function(e){e.preventDefault();var id=el('bc-v12-product-id').value;var payload={Name:el('bc-v12-name').value,SKU:el('bc-v12-sku').value,Barcode:el('bc-v12-barcode').value,Category:el('bc-v12-category').value,Cost_Price:Number(el('bc-v12-cost').value||0),Selling_Price:Number(el('bc-v12-selling').value||0),Minimum_Stock:Number(el('bc-v12-minimum').value||0),Unit:el('bc-v12-unit').value,Supplier:el('bc-v12-supplier').value,Location:el('bc-v12-location').value};var done=function(r){if(!r||!r.success){bcV12Message(r&&r.message||'Product could not be saved.');return;}bcV12CloseModal();load();};if(id){payload.Product_ID=id;call('updateClientBusinessCenterProduct',[payload,sid()],done);}else{payload.Stock_Qty=Number(el('bc-v12-stock').value||0);call('saveClientBusinessCenterProduct',[payload,sid()],done);}};
  window.bcV12OpenCustomer=function(){['name','phone','email','address'].forEach(function(x){el('bc-v12-customer-'+x).value='';});el('bc-v12-customer-modal').classList.remove('hidden');};
  window.bcV12CloseCustomerModal=function(){el('bc-v12-customer-modal').classList.add('hidden');};
  window.bcV12SaveCustomer=function(e){e.preventDefault();var p={Name:el('bc-v12-customer-name').value,Phone:el('bc-v12-customer-phone').value,Email:el('bc-v12-customer-email').value,Address:el('bc-v12-customer-address').value};call('saveClientBusinessCenterCustomer',[p,sid()],function(r){if(!r||!r.success){bcV12Message(r&&r.message||'Customer could not be saved.');return;}bcV12CloseCustomerModal();load();});};
  window.bcV12Stock=function(id){var p=(data&&data.products||[]).find(function(x){return String(x.Product_ID)===String(id);});if(!p)return;var action=prompt('Stock action: enter stock_in, stock_out or set','stock_in');if(!action)return;var q=prompt('Quantity',action==='set'?String(p.Stock_Qty||0):'1');if(q===null)return;var reason=prompt('Reason','Inventory adjustment');if(!reason)return;call('adjustClientBusinessCenterStock',[{Product_ID:id,Type:action,Quantity:Number(q),Reason:reason},sid()],function(r){if(!r||!r.success){bcV12Message(r&&r.message||'Stock could not be updated.');return;}load();});};
  window.bcV12OpenSale=function(){cart=[];el('bc-v12-pos-search').value='';el('bc-v12-sale-discount').value='0';el('bc-v12-sale-paid').value='0';var s=el('bc-v12-sale-customer');s.innerHTML='<option value="">Walk-in customer</option>'+(data&&data.customers||[]).map(function(c){return '<option value="'+esc(c.Customer_ID)+'">'+esc(c.Name)+'</option>';}).join('');el('bc-v12-sale-modal').classList.remove('hidden');bcV12RenderCart();};
  window.bcV12CloseSaleModal=function(){el('bc-v12-sale-modal').classList.add('hidden');};
  window.bcV12SearchProducts=function(){var q=(el('bc-v12-pos-search').value||'').toLowerCase().trim();var rows=(data&&data.products||[]).filter(function(p){return q&&[p.Name,p.SKU,p.Barcode,p.Product_ID].join(' ').toLowerCase().indexOf(q)>=0;}).slice(0,8);el('bc-v12-pos-results').innerHTML=rows.map(function(p){return '<button class="bc-v12-pos-result" onclick="bcV12AddCart(\''+esc(p.Product_ID)+'\')"><span><strong>'+esc(p.Name)+'</strong><small class="bc-v12-muted"> '+num(p.Stock_Qty)+' in stock · '+money(p.Selling_Price)+'</small></span><span>+</span></button>';}).join('');};
  window.bcV12AddCart=function(id){var p=(data.products||[]).find(function(x){return String(x.Product_ID)===String(id);});if(!p)return;var existing=cart.find(function(x){return x.Product_ID===id;});if(existing)existing.Quantity=Math.min(Number(p.Stock_Qty||0),existing.Quantity+1);else cart.push({Product_ID:id,Product_Name:p.Name,Quantity:1,Unit_Price:Number(p.Selling_Price||0)});bcV12RenderCart();};
  window.bcV12RenderCart=function(){var subtotal=cart.reduce(function(s,x){return s+Number(x.Quantity||0)*Number(x.Unit_Price||0);},0),discount=Math.max(0,Number(el('bc-v12-sale-discount').value||0)),total=Math.max(0,subtotal-discount),paid=Math.max(0,Number(el('bc-v12-sale-paid').value||0)),balance=Math.max(0,total-paid);el('bc-v12-sale-total').textContent=money(total);el('bc-v12-sale-balance').textContent=money(balance);el('bc-v12-cart-count').textContent=num(cart.reduce(function(s,x){return s+Number(x.Quantity||0);},0))+' items';el('bc-v12-cart').innerHTML=cart.length?cart.map(function(x,i){return '<div class="bc-v12-cart-row"><div><strong>'+esc(x.Product_Name)+'</strong><div class="bc-v12-muted">'+money(x.Unit_Price)+' each</div></div><div class="bc-v12-qty"><button onclick="bcV12Qty('+i+',-1)">−</button><span>'+num(x.Quantity)+'</span><button onclick="bcV12Qty('+i+',1)">+</button></div><strong>'+money(x.Quantity*x.Unit_Price)+'</strong></div>';}).join(''):'<div class="bc-v12-empty">Add products to the sale.</div>';var btn=el('bc-v12-complete');btn.disabled=!cart.length||total<=0||paid>total;};
  window.bcV12Qty=function(i,d){var x=cart[i],p=(data.products||[]).find(function(z){return z.Product_ID===x.Product_ID});x.Quantity+=d;if(x.Quantity<=0)cart.splice(i,1);else if(p)x.Quantity=Math.min(x.Quantity,Number(p.Stock_Qty||0));bcV12RenderCart();};
  window.bcV12CompleteSale=function(){var discount=Number(el('bc-v12-sale-discount').value||0),paid=Number(el('bc-v12-sale-paid').value||0),payload={Customer_ID:el('bc-v12-sale-customer').value,Discount:discount,Amount_Paid:paid,Payment_Method:el('bc-v12-sale-payment').value,items:cart.map(function(x){return{Product_ID:x.Product_ID,Quantity:x.Quantity};})};var btn=el('bc-v12-complete');btn.disabled=true;call('completeClientBusinessCenterSale',[payload,sid()],function(r){if(!r||!r.success){btn.disabled=false;bcV12Message(r&&r.message||'Sale could not be completed.');return;}bcV12CloseSaleModal();load();bcV12Message(r.message||'Sale completed.');});};
  window.bcV12Init=function(){show(true);load();};
})();
