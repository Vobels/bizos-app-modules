<div id="dashboard-page" class="hidden min-h-screen bg-gray-50">
  <div class="flex">
    <!-- ===== SIDEBAR ===== -->
    <div id="sidebar" class="sidebar bg-white border-r border-gray-200 h-screen fixed overflow-y-auto">
      <div class="p-6">
        <div class="text-2xl font-bold text-[#5D2A86] mb-8">BizOS</div>
        
        <!-- User Info -->
        <div id="user-info" class="mb-6 p-4 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100 transition" onclick="showProfilePage()">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-[#5D2A86] rounded-full flex items-center justify-center text-white font-bold">
              <span id="user-initial">U</span>
            </div>
            <div class="flex-1">
              <p id="user-name" class="font-medium text-gray-900"></p>
              <p id="user-tier" class="text-xs text-gray-500"></p>
            </div>
            <div id="user-upgrade-btn"></div>
          </div>
        </div>
        
        <!-- Navigation -->
        <nav class="space-y-2">
          <button onclick="showDashboardHome()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center space-x-3">
            <i class="fas fa-home text-gray-500"></i>
            <span>Dashboard</span>
          </button>
          <button onclick="showAppsPage()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center space-x-3">
            <i class="fas fa-th-large text-gray-500"></i>
            <span>Apps</span>
          </button>
          <button data-bizos-billing-link="1" onclick="showUpgradeModal()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center space-x-3">
            <i class="fas fa-credit-card text-gray-500"></i>
            <span>Billing</span>
          </button>
          <button onclick="showProfilePage()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center space-x-3">
            <i class="fas fa-user-circle text-gray-500"></i>
            <span>Profile</span>
          </button>
          <button onclick="showSettingsPage()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center space-x-3">
            <i class="fas fa-cog text-gray-500"></i>
            <span>Settings</span>
          </button>
          
          <!-- Module List -->
          <div class="pt-4">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Applications</p>
            <div id="module-list" class="space-y-2"></div>
          </div>
        </nav>
        
        <!-- Sign Out (Bottom) -->
        <div class="absolute bottom-0 left-0 right-0 p-6 border-t border-gray-200">
          <button onclick="handleLogout()" class="w-full text-left px-4 py-2 rounded-lg hover:bg-gray-100 transition flex items-center space-x-3 text-red-600">
            <i class="fas fa-sign-out-alt"></i>
            <span>Sign Out</span>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
    
    <!-- ===== MAIN CONTENT ===== -->
    <div class="flex-1 ml-0 md:ml-64">
      <!-- ===== HEADER ===== -->
      <div id="dashboard-header" class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-10">
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <button id="menu-toggle" class="md:hidden text-gray-600 mr-4">
              <i class="fas fa-bars text-xl"></i>
            </button>
            <h1 id="page-title" class="text-xl font-semibold text-gray-900">Dashboard</h1>
          </div>
          
          <!-- ===== HEADER ACTIONS (RIGHT SIDE) ===== -->
          <div id="header-actions" class="flex items-center space-x-3">
            <!-- 🔔 Notification Bell -->
            <div class="relative">
              <button onclick="toggleNotificationCenter()" class="text-gray-500 hover:text-gray-700 transition relative" title="Notifications">
                <i class="fas fa-bell text-xl"></i>
                <span id="notification-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
              </button>
            </div>
            <div id="header-actions-extra"></div>
          </div>
        </div>
      </div>
      
      <!-- ===== DASHBOARD CONTENT ===== -->
      <main id="dashboard-content" class="p-6">
        <div id="dashboard-home" class="page-view">
          <div id="dashboard-loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-[#5D2A86]"></div>
            <p class="mt-3 text-gray-500">Loading dashboard...</p>
          </div>
          <div id="dashboard-data" class="hidden"></div>
        </div>
        <div id="apps-page" class="hidden page-view"></div>
      </main>
    </div>
  </div>
</div>
