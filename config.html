// ============================================================
// 🛠 HELPER FUNCTIONS

function getAppName() { return APP_CONFIG.name; }
function getPrimaryColor() { return APP_CONFIG.colors.primary; }
function getModuleIcon(name) { return MODULES_CONFIG.icons[name] || "fa-folder"; }
function getModuleColor(name) { return MODULES_CONFIG.colors[name] || "from-gray-500 to-gray-700"; }
function getModuleLabel(name) { return MODULES_CONFIG.labels[name] || name; }
function isModuleFree(name) { return MODULES_CONFIG.free.includes(name); }
function isModuleAccessible(name, tier) {
  const access = MODULES_CONFIG.access[tier] || MODULES_CONFIG.access.starter;
  return access.includes(name);
}
function getSovereignPrice() { return PRICING_CONFIG.sovereign; }
function getServiceFee(type) { return PRICING_CONFIG.services[type] || PRICING_CONFIG.services.default; }
function isFeatureEnabled(feature) { return true; } // Will be overridden by backend

// ============================================================
// 🚀 LOAD CONFIG FROM BACKEND
// ============================================================
function loadFrontendConfig() {
  console.log('📦 Loading frontend config from backend...');
  
  // Check if we have a session
  if (!currentSessionId && typeof currentSessionId !== 'undefined') {
    console.log('No session, using default config');
    return;
  }
  
  callGoogleScript(
    'getFrontendConfig',
    [],
    function(response) {
      if (response && response.app) {
        // Override with backend config
        Object.assign(APP_CONFIG, response.app);
        Object.assign(MODULES_CONFIG, response.modules);
        Object.assign(PRICING_CONFIG, response.pricing);
        Object.assign(TIERS_CONFIG, response.tiers);
        console.log('✅ Frontend config loaded from backend');
        console.log('🏢 App:', APP_CONFIG.name);
        console.log('💰 Price:', PRICING_CONFIG.sovereign.usd);
      }
    },
    function(error) {
      console.log('⚠️ Using default frontend config');
    }
  );
}

// Load config when page loads
if (typeof window !== 'undefined') {
  // Will be called after session is loaded
  document.addEventListener('DOMContentLoaded', function() {
    // Small delay to ensure session is loaded
    setTimeout(loadFrontendConfig, 1000);
  });
}

console.log('✅ config.html loaded successfully');
