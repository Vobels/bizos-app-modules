  <script>
    function openLoginModal() {
      const modal = document.getElementById('login-modal');
      if (modal) {
        modal.classList.remove('hidden');
        console.log("✅ Login modal opened");
      } else {
        console.log("❌ Modal not found");
      }
    }

    // VALUE COMES FROM SERVER (NOT URL)
    const shouldShowLogin = <?= showLogin ? 'true' : 'false' ?>;

    window.addEventListener('load', function () {
      if (shouldShowLogin) {
        console.log("🔁 showLogin detected from server");
        let attempts = 0;
        const interval = setInterval(() => {
          const modal = document.getElementById('login-modal');
          if (modal) {
            openLoginModal();
            clearInterval(interval);
          }
          attempts++;
          if (attempts > 20) {
            console.log("❌ Modal never found");
            clearInterval(interval);
          }
        }, 200);
      }
    });
  </script>
