  <!-- ============================================================
       SINGLE CLIENT ROUTE STATE
       The public shell owns /, /login, /dashboard, /profile,
       /staff and /settings. This iframe receives the initial route
       from its URL fragment and reports navigation back to the shell.
       No query-string routing and no reload-based route controller.
       ============================================================ -->
  <script>
  (function () {
    const ROUTES = {
      '/': true,
      '/login': true,
      '/dashboard': true,
      '/profile': true,
      '/staff': true,
      '/settings': true
    };

    function normalizeRoute(value) {
      let raw = String(value || '').trim().toLowerCase();
      if (!raw || raw === '#') return '/';
      if (raw.charAt(0) === '#') raw = raw.substring(1);
      if (raw.charAt(0) !== '/') raw = '/' + raw;
      raw = raw.replace(/\/+$/, '') || '/';
      if (raw === '/landing') return '/';
      return ROUTES[raw] ? raw : '/';
    }

    function publishRoute(path, replace) {
      const route = normalizeRoute(path);
      window.__BIZOS_PUBLIC_ROUTE = route;

      try {
        if (window.top !== window) {
          window.top.postMessage({
            type: 'bizos-route',
            path: route,
            replace: !!replace
          }, '*');
        }
      } catch (e) {}

      return route;
    }

    function showLanding() {
      const landing = document.getElementById('landing-page');
      const dashboard = document.getElementById('dashboard-page');
      const profile = document.getElementById('profile-page');
      const settings = document.getElementById('settings-page');
      if (landing) landing.classList.remove('hidden');
      if (dashboard) dashboard.classList.add('hidden');
      if (profile) profile.classList.add('hidden');
      if (settings) settings.classList.add('hidden');
    }

    function openLogin() {
      showLanding();
      if (typeof window.showLoginModal === 'function') window.showLoginModal();
      else if (typeof window.openLoginModal === 'function') window.openLoginModal();
    }

    function authenticated() {
      return typeof window.loadSession !== 'function' || window.loadSession();
    }

    function applyRoute(path) {
      const route = normalizeRoute(path);
      window.__BIZOS_PUBLIC_ROUTE = route;

      if (route === '/') {
        showLanding();
        publishRoute('/');
        return;
      }

      if (route === '/login') {
        openLogin();
        publishRoute('/login');
        return;
      }

      if (!authenticated()) {
        openLogin();
        publishRoute('/login', true);
        return;
      }

      if (route === '/dashboard') {
        if (typeof window.showDashboardHome === 'function') window.showDashboardHome();
      } else if (route === '/profile') {
        if (typeof window.showProfilePage === 'function') window.showProfilePage();
      } else if (route === '/staff') {
        if (typeof window.showProfilePage === 'function') {
          window.showProfilePage();
          setTimeout(function () {
            if (typeof window.showProfileTab === 'function') window.showProfileTab('team');
          }, 50);
        }
      } else if (route === '/settings') {
        if (typeof window.showSettingsPage === 'function') window.showSettingsPage();
      }

      publishRoute(route);
    }

    function initialRouteFromIframe() {
      let route = normalizeRoute(window.__BIZOS_INITIAL_ROUTE || '/');

      // Apps Script exposes the iframe URL fragment through google.script.url.
      // This avoids the query-string path that was producing intermittent 404s.
      if (window.google && google.script && google.script.url && typeof google.script.url.getLocation === 'function') {
        google.script.url.getLocation(function (location) {
          const hashRoute = normalizeRoute(location && location.hash);
          if (hashRoute !== '/') route = hashRoute;
          applyRoute(route);
        });
      } else {
        const hashRoute = normalizeRoute(window.location.hash);
        if (hashRoute !== '/') route = hashRoute;
        applyRoute(route);
      }
    }

    // Netlify history navigation changes only the browser URL. It never
    // reloads the GAS iframe; this handler changes the visible page in place.
    window.addEventListener('message', function (event) {
      if (!event || !event.data || event.data.type !== 'bizos-shell-route') return;
      applyRoute(event.data.path || '/');
    });

    // A direct GAS hash navigation should work as well.
    window.addEventListener('hashchange', function () {
      applyRoute(window.location.hash || '/');
    });

    // Existing startup code automatically loads the dashboard when a session
    // exists. Protect that bootstrap only while a different explicit route is
    // being opened, so the existing navigation functions remain authoritative.
    function protectExplicitRouteStartup() {
      const requested = normalizeRoute(window.__BIZOS_INITIAL_ROUTE || window.location.hash || '/');
      if (requested === '/' || requested === '/dashboard') return;

      ['loadDashboard', 'loadEnhancedDashboard'].forEach(function (name) {
        const fn = window[name];
        if (typeof fn !== 'function' || fn.__bizosRouteStartupGuard) return;
        const guarded = function () { return undefined; };
        guarded.__bizosRouteStartupGuard = true;
        guarded.__bizosOriginal = fn;
        window[name] = guarded;
      });
    }

    function startRouteState() {
      protectExplicitRouteStartup();
      initialRouteFromIframe();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startRouteState, { once: true });
    } else {
      startRouteState();
    }
  })();
  </script>

  <script>
    const shouldShowLogin = <?= showLogin ? 'true' : 'false' ?>;
    window.addEventListener('load', function () {
      if (!shouldShowLogin) return;
      let attempts = 0;
      const interval = setInterval(function () {
        if (typeof window.showLoginModal === 'function' && document.getElementById('login-modal')) {
          window.showLoginModal(); clearInterval(interval); return;
        }
        if (typeof window.openLoginModal === 'function' && document.getElementById('login-modal')) {
          window.openLoginModal(); clearInterval(interval); return;
        }
        attempts++;
        if (attempts > 20) clearInterval(interval);
      }, 200);
    });
  </script>
</body>
</html>
