  <script>
    /* Login-page deep link uses the same authoritative modal controller
       as every other landing-page login button. */
    const shouldShowLogin = <?= showLogin ? 'true' : 'false' ?>;

    window.addEventListener('load', function () {
      if (!shouldShowLogin) return;

      console.log("🔁 showLogin detected from server");
      let attempts = 0;
      const interval = setInterval(function () {
        if (typeof window.openLoginModal === 'function' && document.getElementById('login-modal')) {
          window.openLoginModal();
          clearInterval(interval);
          return;
        }

        attempts++;
        if (attempts > 20) {
          console.log("❌ Login modal controller never became available");
          clearInterval(interval);
        }
      }, 200);
    });
  </script>
