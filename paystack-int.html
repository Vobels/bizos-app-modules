<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Payment - BizOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.paystack.co/v2/inline.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg overflow-hidden">
      <div class="bg-gradient-to-r from-purple-600 to-purple-800 p-6 text-center">
        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-crown text-purple-600 text-2xl"></i></div>
        <h1 class="text-2xl font-bold text-white">Complete Your Upgrade</h1>
        <p class="text-purple-200 mt-2">Sovereign Tier - One Time Payment</p>
      </div>
      <div class="p-6" id="payment-content">
        <div class="text-center py-8"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mb-4"></div><p class="text-gray-600">Loading payment details...</p></div>
      </div>
    </div>
  </div>
<script>
const requestId = new URLSearchParams(window.location.search).get('requestId');
const DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbxydvMYfUDCzk0b-_MJpcUrwPhdWXsmQZMH847JxMd2/dev';
let checkout = null;
function escapeHtml(str){return String(str||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function showError(message){document.getElementById('payment-content').innerHTML='<div class="text-center py-8"><div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-red-600 text-2xl"></i></div><h3 class="text-lg font-semibold text-gray-900 mb-2">Payment Not Activated</h3><p class="text-gray-600 mb-6">'+escapeHtml(message)+'</p><button onclick="location.href=DASHBOARD_URL" class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold">← Return to Dashboard</button></div>';}
function setStatus(message){var el=document.getElementById('payment-status');if(el)el.textContent=message;}
if(!requestId){showError('Unable to find the upgrade request.');}
else{google.script.run.withSuccessHandler(function(r){if(!r||!r.success){showError((r&&r.message)||'Unable to prepare payment.');return;}checkout=r;var symbols={'USD':'$','NGN':'₦','GBP':'£','EUR':'€'};var symbol=symbols[r.currency]||r.currency+' ';document.getElementById('payment-content').innerHTML='<div class="mb-6"><div class="bg-purple-50 rounded-lg p-4 mb-6"><div class="flex justify-between mb-3"><span class="text-gray-600">Business:</span><span class="font-semibold">'+escapeHtml(r.businessName)+'</span></div><div class="flex justify-between mb-3"><span class="text-gray-600">Request ID:</span><span class="font-mono text-sm">'+escapeHtml(r.requestId)+'</span></div><div class="flex justify-between pt-3 border-t"><span class="text-gray-600">Amount:</span><span class="text-2xl font-bold text-purple-600">'+symbol+Number(r.displayAmount).toLocaleString()+'</span></div></div><div class="bg-green-50 rounded-lg p-4 mb-6 text-sm text-green-800"><i class="fas fa-lock mr-2"></i>Secure payment powered by Paystack. Your payment is verified on the BizOS server before your deployment is activated.</div><button id="pay-button" onclick="startPayment()" class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700"><i class="fas fa-credit-card mr-2"></i>Pay Now</button><p id="payment-status" class="text-center text-sm text-gray-500 mt-4"></p></div>';}).withFailureHandler(function(e){showError(e&&e.message?e.message:'Unable to load payment details.');}).getPaystackCheckoutDetails(requestId);}
function startPayment(){if(!checkout||!checkout.publicKey){showError('Paystack is not configured yet.');return;}var button=document.getElementById('pay-button');if(button){button.disabled=true;button.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Opening secure checkout...';}try{var popup=new PaystackPop();popup.newTransaction({key:checkout.publicKey,email:checkout.email,amount:checkout.amount,currency:checkout.currency,reference:checkout.reference,metadata:{requestId:checkout.requestId,businessName:checkout.businessName},onLoad:function(){setStatus('Payment window opened. Complete your payment there.');},onSuccess:function(transaction){completePayment(transaction.reference||transaction.trxref);},onCancel:function(){if(button){button.disabled=false;button.innerHTML='<i class="fas fa-credit-card mr-2"></i>Pay Now';}setStatus('Payment cancelled. You can try again.');},onError:function(error){if(button){button.disabled=false;button.innerHTML='<i class="fas fa-credit-card mr-2"></i>Pay Now';}setStatus((error&&error.message)||'Unable to open Paystack checkout.');}});}catch(e){if(button){button.disabled=false;button.innerHTML='<i class="fas fa-credit-card mr-2"></i>Pay Now';}showError(e.message||'Unable to open payment checkout.');}}
function completePayment(reference){if(!reference){showError('Paystack returned no transaction reference.');return;}setStatus('Payment received. Verifying transaction and provisioning your BizOS workspace...');var button=document.getElementById('pay-button');if(button){button.disabled=true;button.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Activating BizOS...';}google.script.run.withSuccessHandler(function(response){if(response&&response.success){setStatus('Payment verified. Your BizOS workspace is ready. Redirecting...');setTimeout(function(){location.href=response.webAppUrl||response.landingUrl||DASHBOARD_URL;},1200);}else{showError((response&&response.message)||'Payment verification failed.');}}).withFailureHandler(function(error){showError(error&&error.message?error.message:'Payment verification could not be completed.');}).verifyPaystackPaymentAndProvisionSecure(reference,requestId);}
</script>
</body>
</html>
